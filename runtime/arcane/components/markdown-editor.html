<link rel="stylesheet" href="./arcane/css/layout.css">
<style>
    :host{
        display:block;
    }

    :host([data-fit="true"]){
        min-width:0;
        min-height:0;
        container:arcane-markdown-editor / inline-size;
    }

    .markdown-editor{
        display:grid;
        gap:.75em;
        grid-template-rows:auto auto auto auto auto;
    }

    .entry-title,
    .entry-markdown{
        box-sizing:border-box;
        margin:0;
        width:100%;
    }

    .preview{
        background:var(--background);
        border:1px solid var(--border-color);
        border-radius:.5em;
        overflow:visible;
        padding:1em;
    }

    .preview:empty::before{
        content:attr(data-empty-label);
        opacity:.55;
    }

    .toolbar,
    .actions{
        display:flex;
        flex-wrap:wrap;
        gap:.35em;
    }

    .toolbar button,
    .actions button{
        margin:0;
    }

    .entry-markdown{
        font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        min-height:10em;
        resize:vertical;
    }

    .actions{
        align-items:center;
        justify-content:flex-end;
    }

    .status{
        margin-right:auto;
    }

    .markdown-editor.fit{
        height:100%;
        min-height:0;
        min-width:0;
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        grid-template-rows:auto auto minmax(0,1fr) auto;
        grid-template-areas:"title title" "toolbar toolbar" "input preview" "actions actions";
    }

    .fit .entry-title{grid-area:title;}
    .fit .toolbar{grid-area:toolbar;}
    .fit .entry-markdown{grid-area:input;}
    .fit .preview{grid-area:preview;}
    .fit .actions{grid-area:actions;}

    .fit .entry-markdown,
    .fit .preview{
        box-sizing:border-box;
        min-width:0;
        min-height:0;
        height:100%;
        overflow:auto;
        overscroll-behavior:contain;
    }

    .fit .entry-markdown{resize:none;}
    .fit .preview{overflow-wrap:anywhere;}
    .fit .preview img{max-width:100%;height:auto;}
    .fit.without-preview{grid-template-areas:"title title" "toolbar toolbar" "input input" "actions actions";}

    @container arcane-markdown-editor (max-width:44rem){
        .markdown-editor.fit{
            grid-template-columns:minmax(0,1fr);
            grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr) auto;
            grid-template-areas:"title" "toolbar" "input" "preview" "actions";
        }

        .markdown-editor.fit.without-preview{
            grid-template-rows:auto auto minmax(0,1fr) auto;
            grid-template-areas:"title" "toolbar" "input" "actions";
        }
    }

    .hidden{
        display:none;
    }
</style>

<section class="markdown-editor" part="editor">
    <input id="entryTitle" class="entry-title" part="title" type="text">
    <section id="preview" class="preview" part="preview" tabindex="0"></section>
    <section id="toolbar" class="toolbar" part="toolbar"></section>
    <textarea id="entryMarkdown" class="entry-markdown" part="input"></textarea>
    <section class="actions" part="actions">
        <span id="status" class="status" part="status" aria-live="polite"></span>
        <button id="save" part="save-action" type="button" disabled></button>
    </section>
</section>

<script type="module">
    const {default:Is}=await import('strong-type');
    const is=new Is(false);

    const {arcaneLogging}=await import('arcane-os/logging');

    const host=this;
    const {default:MD}=await import('../modules/MD.js');
    const {
        applyMarkdownFormat,
        normalizeMarkdownOptions
    }=await import('../modules/ComponentContracts.js');
    const {createArcaneEventSource,projectArcaneDOMEvent}=await import('arcane-os/event-manager');
    const events=createArcaneEventSource(host,{source:'arcane.component.markdown-editor',eventTypes:['markdown-editor-change','markdown-editor-saved','markdown-editor-ready']});
    const lifecycleController=new AbortController();
    const editor=host.shadowRoot.querySelector('.markdown-editor');
    const titleInput=host.shadowRoot.querySelector('#entryTitle');
    const preview=host.shadowRoot.querySelector('#preview');
    const toolbar=host.shadowRoot.querySelector('#toolbar');
    const textarea=host.shadowRoot.querySelector('#entryMarkdown');
    const saveButton=host.shadowRoot.querySelector('#save');
    const status=host.shadowRoot.querySelector('#status');

    let previewFrame=0;
    let previewFollowPending=false;
    let operationSequence=0;
    let saveGeneration=0;
    let saveController=null;
    let destroyed=false;
    let options=normalizeMarkdownOptions(optionsFromDataset());

    function emit(type,detail={},publicDetail={},operationId=null){
        if(destroyed){
            return false;
        }
        const publication=events.dispatch(type,detail,{publicDetail,operationId});
        return projectArcaneDOMEvent(host,publication.occurrence,{bubbles:true,composed:true});
    }

    host.clear=clear;
    host.configure=configure;
    host.destroy=destroy;
    host.focus=()=>{if(destroyed)return false;textarea.focus();return true;};
    host.saveEntry=saveEntry;

    Object.defineProperties(
        host,
        {
            entryTitle:{
                configurable:true,
                get:()=>titleInput.value,
                set:value=>setTitle(value)
            },
            options:{configurable:true,get:getOptions,set:configure},
            value:{configurable:true,get:()=>textarea.value,set:setValue}
        }
    );

    textarea.addEventListener('input',contentChanged,{signal:lifecycleController.signal});
    titleInput.addEventListener('input',contentChanged,{signal:lifecycleController.signal});
    toolbar.addEventListener('click',formatMarkdown,{signal:lifecycleController.signal});
    saveButton.addEventListener('click',saveEntry,{signal:lifecycleController.signal});
    for(const type of ['wheel','pointerdown','touchstart','keydown']){
        preview.addEventListener(type,retainPreviewReadingPosition,{signal:lifecycleController.signal,passive:true});
    }

    function optionsFromDataset(){
        const dataset=host.dataset||{};
        const mapped={};
        const fields=[
            'bodyPlaceholder',
            'previewLabel',
            'saveLabel',
            'titlePlaceholder',
            'toolbarLabel'
        ];
        for(const field of fields){
            if(dataset[field]!==undefined){
                mapped[field]=dataset[field];
            }
        }
        for(const field of [
            'clearOnSave',
            'fit',
            'followPreview',
            'readOnly',
            'showPreview',
            'showSave',
            'showTitle',
            'showToolbar'
        ]){
            if(dataset[field]!==undefined){
                mapped[field]=dataset[field]==='true';
            }
        }
        return mapped;
    }

    function configure(input={}){
        if(destroyed){
            return false;
        }
        const sourceView = captureSourceView();
        const setInitialValue=Object.prototype.hasOwnProperty.call(
            input||{},
            'initialValue'
        );
        const setInitialTitle=Object.prototype.hasOwnProperty.call(
            input||{},
            'initialTitle'
        );
        options=normalizeMarkdownOptions(input,options);
        renderOptions();
        if(setInitialTitle){
            supersedeSave('markdown-title-replaced');
            titleInput.value=options.initialTitle;
        }
        if(setInitialValue){
            supersedeSave('markdown-content-replaced');
            if (textarea.value !== options.initialValue) {
                textarea.value = options.initialValue;
            }
        }
        updatePreview();
        restoreSourceView(sourceView);
        return getOptions();
    }

    function renderOptions(){
        host.dataset.fit=String(options.fit);
        editor.classList.toggle('fit',options.fit);
        editor.classList.toggle('without-preview',!options.showPreview);
        // Move only the preview when the layout changes. Reattaching the live
        // textarea during ordinary configuration would disturb focus/selection.
        if (options.fit) {
            if (textarea.nextSibling !== preview) {
                editor.insertBefore(preview, textarea.nextSibling);
            }
        } else if (preview.nextSibling !== toolbar) {
            editor.insertBefore(preview, toolbar);
        }
        titleInput.placeholder=options.labels.titlePlaceholder;
        titleInput.setAttribute('aria-label',options.labels.titlePlaceholder);
        textarea.placeholder=options.labels.bodyPlaceholder;
        textarea.setAttribute('aria-label',options.labels.bodyPlaceholder);
        preview.setAttribute('aria-label',options.labels.preview);
        preview.dataset.emptyLabel=options.labels.preview;
        toolbar.setAttribute('aria-label',options.labels.toolbar);
        saveButton.innerText=options.labels.save;
        titleInput.classList.toggle('hidden',!options.showTitle);
        preview.classList.toggle('hidden',!options.showPreview);
        toolbar.classList.toggle('hidden',!options.showToolbar);
        saveButton.classList.toggle('hidden',!options.showSave);
        titleInput.readOnly=options.readOnly;
        textarea.readOnly=options.readOnly;
        renderToolbar();
        syncSaveButton();
    }

    function renderToolbar(){
        const fragment=document.createDocumentFragment();
        for(const format of options.formats){
            const button=document.createElement('button');
            button.type='button';
            button.dataset.format=format.id;
            button.title=format.title;
            button.innerText=format.label;
            button.disabled=options.readOnly;
            fragment.append(button);
        }
        toolbar.replaceChildren(fragment);
    }

    function contentChanged(event){
        if(destroyed){
            return;
        }
        supersedeSave('markdown-content-edited');
        if(event?.currentTarget!==titleInput){
            schedulePreview(options.followPreview);
        }
        const detail={
            markdown:textarea.value,
            title:titleInput.value
        };
        emit('markdown-editor-change',detail,detail);
        if(options.onChange){
            Promise.resolve(options.onChange(detail)).catch(
                error=>arcaneLogging.error('Markdown change callback failed:',error)
            );
        }
    }

    function schedulePreview(follow=false){
        if(destroyed){
            return;
        }
        if(previewFrame){
            cancelAnimationFrame(previewFrame);
        }
        previewFollowPending=previewFollowPending||follow;
        previewFrame=requestAnimationFrame(renderPendingPreview);
    }

    function renderPendingPreview(){
        const follow=previewFollowPending;
        previewFrame=0;
        updatePreview(follow);
    }

    function retainPreviewReadingPosition(){
        previewFollowPending=false;
    }

    function captureSourceView() {
        return {
            scrollTop: textarea.scrollTop,
            scrollLeft: textarea.scrollLeft,
            selectionStart: textarea.selectionStart,
            selectionEnd: textarea.selectionEnd,
            selectionDirection: textarea.selectionDirection
        };
    }

    function restoreSourceView(view) {
        if (textarea.selectionStart !== view.selectionStart ||
            textarea.selectionEnd !== view.selectionEnd ||
            textarea.selectionDirection !== view.selectionDirection) {
            textarea.setSelectionRange(
                view.selectionStart,
                view.selectionEnd,
                view.selectionDirection
            );
        }
        // Native value/focus/selection updates may pan the textarea. Restore
        // this operation's viewport, never a position retained across user input.
        if (textarea.scrollTop !== view.scrollTop) {
            textarea.scrollTop = view.scrollTop;
        }
        if (textarea.scrollLeft !== view.scrollLeft) {
            textarea.scrollLeft = view.scrollLeft;
        }
    }

    function updatePreview(follow=false){
        if(destroyed){
            return;
        }
        if(previewFrame){
            cancelAnimationFrame(previewFrame);
        }
        previewFrame=0;
        previewFollowPending=false;
        const sourceView = captureSourceView();
        const scrollTop=preview.scrollTop;
        const scrollLeft=preview.scrollLeft;
        const markdown=new MD(textarea.value,{sourceMap:options.followPreview});
        preview.innerHTML=markdown.safeRendered;
        preview.querySelectorAll('a').forEach(
            link=>{
                link.target='_blank';
                link.removeAttribute('rel');
            }
        );
        preview.scrollTop=scrollTop;
        preview.scrollLeft=scrollLeft;
        if(follow&&options.followPreview&&options.showPreview){
            followTypingPosition(markdown.sourceMap);
        }
        restoreSourceView(sourceView);
    }

    function followTypingPosition(sourceMap){
        const records=new Map(sourceMap.map(record=>[record.marker,record]));
        const walker=document.createTreeWalker(preview,NodeFilter.SHOW_COMMENT);
        const anchors=[];
        for(let node=walker.nextNode();node;node=walker.nextNode()){
            const record=records.get(node.data);
            if(record){
                anchors.push({node,record});
            }
        }
        if(!anchors.length||!preview.clientHeight){
            return;
        }
        const caret=textarea.selectionDirection==='backward'
            ?textarea.selectionStart:textarea.selectionEnd;
        let selected=0;
        for(let index=0;index<anchors.length;index+=1){
            if(anchors[index].record.start>caret){
                break;
            }
            selected=index;
        }
        // Raw HTML can absorb an anchor or have no visible geometry. Use the
        // nearest rendered block; never move the containing page or input pane.
        let left=selected;
        let right=selected+1;
        while(left>=0||right<anchors.length){
            const useLeft=right>=anchors.length||(
                left>=0&&Math.abs(caret-anchors[left].record.end)<=Math.abs(anchors[right].record.start-caret)
            );
            const index=useLeft?left--:right++;
            const anchor=anchors[index];
            const range=document.createRange();
            range.setStartAfter(anchor.node);
            if(anchors[index+1]){
                range.setEndBefore(anchors[index+1].node);
            }else{
                range.setEnd(preview,preview.childNodes.length);
            }
            const bounds=range.getBoundingClientRect();
            if(!bounds.height){
                continue;
            }
            const viewportTop=preview.getBoundingClientRect().top+preview.clientTop;
            const viewportBottom=viewportTop+preview.clientHeight;
            if(bounds.height<=preview.clientHeight){
                if(bounds.top<viewportTop){
                    preview.scrollTop+=bounds.top-viewportTop;
                }else if(bounds.bottom>viewportBottom){
                    preview.scrollTop+=bounds.bottom-viewportBottom;
                }
            }else{
                // A top-level block may be a long paragraph, list or code fence.
                // Follow approximate position within it without rewriting text.
                const span=anchor.record.end-anchor.record.start;
                const fraction=span?Math.max(0,Math.min(1,(caret-anchor.record.start)/span)):0;
                const position=bounds.top+fraction*bounds.height;
                if(position<viewportTop||position>viewportBottom){
                    preview.scrollTop+=position-viewportTop-preview.clientHeight/2;
                }
            }
            return;
        }
    }

    function formatMarkdown(event){
        if(options.readOnly){
            return;
        }
        const button=event.target.closest('[data-format]');
        const format=options.formats.find(
            candidate=>candidate.id===button?.dataset.format
        );
        if(!button||!format){
            return;
        }

        const sourceView = captureSourceView();
        const result=applyMarkdownFormat(
            textarea.value,
            textarea.selectionStart,
            textarea.selectionEnd,
            format
        );
        textarea.value=result.value;
        textarea.focus(
            {preventScroll: true}
        );
        sourceView.selectionStart = result.selectionStart;
        sourceView.selectionEnd = result.selectionEnd;
        restoreSourceView(sourceView);
        contentChanged();
    }

    async function saveEntry(){
        if(destroyed||options.readOnly||!options.showSave){
            return false;
        }
        const markdown=textarea.value;
        const entryTitle=titleInput.value;
        if(!markdown.trim()){
            status.innerText=options.labels.emptyError;
            textarea.focus();
            return false;
        }

        const save=options.onSave||(
            is.function(host.save)?host.save.bind(host):null
        );
        if(!save){
            status.innerText=options.labels.unavailable;
            return false;
        }

        saveController?.abort('markdown-save-replaced');
        const controller=new AbortController();
        saveController=controller;
        const generation=++saveGeneration;
        const operationId=`${events.descriptor.instanceId}:save:${++operationSequence}`;
        saveButton.disabled=true;
        status.innerText=options.labels.saving;
        try{
            await save({title:entryTitle,markdown},{signal:controller.signal,operationId});
            if(destroyed||generation!==saveGeneration){
                return false;
            }
            if(options.clearOnSave){
                resetEditor(false);
            }
            status.innerText=options.labels.saved;
            const detail={title:entryTitle,markdown};
            emit('markdown-editor-saved',detail,detail,operationId);
            return true;
        }catch(error){
            if(destroyed||generation!==saveGeneration||controller.signal.aborted){
                return false;
            }
            status.innerText=options.labels.saveError;
            arcaneLogging.error('Unable to save Markdown content:',error);
            return false;
        }finally{
            if(saveController===controller){
                saveController=null;
            }
            if(!destroyed&&generation===saveGeneration){
                syncSaveButton();
            }
        }
    }

    function clear(){
        return resetEditor(true);
    }

    function resetEditor(supersede){
        if(destroyed){
            return false;
        }
        if(supersede){
            supersedeSave('markdown-content-cleared');
        }
        titleInput.value='';
        textarea.value='';
        updatePreview();
        return true;
    }

    function setValue(value=''){
        if(destroyed){
            return false;
        }
        supersedeSave('markdown-content-replaced');
        const sourceView = captureSourceView();
        const nextValue = `${value ?? ''}`;
        if (textarea.value !== nextValue) {
            textarea.value = nextValue;
        }
        updatePreview();
        restoreSourceView(sourceView);
        return textarea.value;
    }

    function setTitle(value=''){
        if(destroyed){
            return false;
        }
        supersedeSave('markdown-title-replaced');
        titleInput.value=`${value??''}`;
        return titleInput.value;
    }

    function syncSaveButton(){
        saveButton.disabled=options.readOnly||!options.showSave;
    }

    function getOptions(){
        return {
            ...options,
            labels:{...options.labels},
            formats:options.formats.map(format=>({...format}))
        };
    }

    function supersedeSave(reason){
        const active=saveController!==null;
        saveGeneration+=1;
        saveController?.abort(reason);
        saveController=null;
        if(!destroyed){
            if(active){
                status.innerText='';
            }
            syncSaveButton();
        }
    }

    function destroy(){
        if(destroyed){
            return false;
        }
        destroyed=true;
        supersedeSave('markdown-editor-destroyed');
        lifecycleController.abort('markdown-editor-destroyed');
        previewFollowPending=false;
        if(previewFrame){
            cancelAnimationFrame(previewFrame);
            previewFrame=0;
        }
        preview.replaceChildren();
        events.dispose();
        host.ready=false;
        return true;
    }

    renderOptions();
    titleInput.value=options.initialTitle;
    textarea.value=options.initialValue;
    updatePreview();
    status.innerText='';
    host.ready=true;
    emit('markdown-editor-ready',{}, {ready:true});
</script>
