                    await modal.close(undefined,true);
                    if(destroyed||generation!==deleteGeneration){
                        return;
                    }

                    if(closeFile&&is.function(fileModal.close)){
                        await fileModal.close(undefined,true);
                        if(destroyed||generation!==deleteGeneration){
                            return;
                        }
                    }

                    await loadAll();
                    if(destroyed||generation!==deleteGeneration){
                        return;
                    }

                    if(layout==='grid'){
                        await openDirectory(directory);
                    }
                }catch(error){
                    if(!destroyed&&generation===deleteGeneration){
                        message.innerText=`Unable to delete ${fileName}.`;
                        cancelButton.disabled=false;
                        deleteButton.disabled=false;
                    }
                    if (!destroyed) {
                        arcaneLogging.error('Unable to delete file:', error);
                    }
                }
            },
            {signal:lifecycleController.signal}
        );

        content.append(
            heading,
            message,
            cancelButton,
            deleteButton
        );

        await modal.populate(content,false);
        if(destroyed||generation!==deleteGeneration){
            return false;
        }
        modal.open();

        return true;
    }

    function selectFiles(directory=''){
        if(!directory){
            return;
        }

        uploadDirectory=directory;
        uploadPresentationController = presentationController;
        fileUpload.click();
    }

    async function uploadFiles(){
        if(destroyed){
            return false;
        }
        const files=Array.from(fileUpload.files||[]);
        const directory=uploadDirectory;
        const presentation = uploadPresentationController || presentationController;
        uploadPresentationController = null;
        fileUpload.value='';

        if(!files.length||!directory){
            return;
        }

        const {default:FileEntity}=await fileEntityPromise;
        if(destroyed){
            return false;
        }

        const results=await Promise.allSettled(
            files.map(
                function saveUploadedFile(file){
                    return new FileEntity(
                        file.name,
                        directory
                    ).save(file);
                }
            )
        );
        if(destroyed){
            return false;
        }

        await loadAll();
        if(destroyed){
            return false;
        }

        if(layout==='grid' && !presentation.signal.aborted){
            await openDirectory(directory, presentation.signal);
        }

        const failed=results.find(
            result=>result.status==='rejected'
        );

        if(failed){
            throw failed.reason;
        }
        return true;
    }

    async function init(){
        if(initialized||destroyed){
            return;
        }

        initialized=true;

        try{
            if(layout!=='tree'){
                await fileEntityPromise;
            }
            await loadAll();
            if(destroyed){
                return;
            }
            host.ready=true;
            const publication=events.dispatch('file-manager-ready',{}, {publicDetail:{ready:true}});
            projectArcaneDOMEvent(host,publication.occurrence);
        }catch(error){
            if(!destroyed){
                initialized=false;
                arcaneLogging.error('Unable to initialize file manager:',error);
            }
        }
    }

    async function waitForModal(modal, methods, signal) {
        try {
            return await waitForComponent(
                modal,
                {
                    methods,
                    property: 'ready',
                    event: 'modal-ready',
                    signal
                }
            );
        } catch (error) {
            if (signal.aborted) {
                return null;
            }
            throw error;
        }
    }

    async function closeFileManager() {
        if (destroyed) {
            return false;
        }
        presentationController.abort('file-manager-closed');
        presentationController = new AbortController();
        treeOpenGeneration += 1;
        directoryOpenGeneration += 1;
        deleteGeneration += 1;
        selectionGeneration += 1;
        // Cancel unfinished opens now; a settled preview remains usable until
        // its modal actually closes, including when a child refuses to close.
        if (!activePreview?.rendered) {
            fileOpenGeneration += 1;
            releasePreview(activePreview, 'file-manager-closed');
        }
        if (closingTask) {
            return closingTask;
        }

        closingTask = Promise.resolve().then(closeOwnedDialogs);
        try {
            return await closingTask;
        } finally {
            closingTask = null;
        }
    }

    async function closeOwnedDialogs() {
        try {
            for (const modal of [deleteModal, fileModal, directoryModal]) {
                if (destroyed) {
                    return false;
                }
                if (is.function(modal.close)) {
                    const closed = await modal.close();
                    if (closed === false) {
                        return false;
                    }
                }
                if (modal.opened === true) {
                    return false;
                }
            }
            return !destroyed;
        } catch (error) {
            arcaneLogging.error('Unable to close file manager:', error);
            return false;
        }
    }

    function destroy(){
        if(destroyed){
            return false;
        }
        destroyed=true;
        initialized=false;
        host.ready=false;
        lifecycleController.abort('file-manager-destroyed');
        presentationController.abort('file-manager-destroyed');
        treeLoadSequence+=1;
        gridLoadSequence+=1;
        providerGeneration+=1;
        filterGeneration+=1;
        treeOpenGeneration+=1;
        directoryOpenGeneration+=1;
        fileOpenGeneration+=1;
        deleteGeneration+=1;
        selectionGeneration+=1;
        releasePreview(activePreview,'file-manager-destroyed');
        treeItems.clear();
        provider=null;
        filter=null;
        directoryModal.destroy?.();
        fileModal.destroy?.();
        deleteModal.destroy?.();
        events.dispose();
        return true;
    }

    async function loadAll(){
        if(destroyed){
            return [];
        }
        selectionGeneration+=1;
        if(layout==='tree'){
            return loadTree();
        }
        const sequence=++gridLoadSequence;

        let tableNames=dirs;

        if(!tableNames?.length){
            tableNames=await dbopfs.getTableNames(true);
        }
        if(destroyed||sequence!==gridLoadSequence){
            return [];
        }

        tableNames.sort();
        fileManager.replaceChildren();

        for(let i=0;i<tableNames.length;i++){
            const tableName=tableNames[i];
            if(!isVisibleDirectory(tableName)){
                continue;
            }
            const keys=await dbopfs.getAllKeys(tableName);
            if(destroyed||sequence!==gridLoadSequence){
                return [];
            }
            const files=visibleFileNames(keys,tableName).sort();
            const metadata=layout==='files'
                ?await getFilesMetadata(tableName,files)
                :[];
            if(destroyed||sequence!==gridLoadSequence){
                return [];
            }
            const directory=document.createElement('ul');
            const folder=document.createElement('li');
            const folderIcon=document.createElement('img');
            const folderName=document.createElement('span');
            const fileCount=document.createElement('span');

            directory.className='directory';
            directory.dataset.directory=tableName;
            folder.className='file folder';
            folderIcon.className='icon';
            folderIcon.src=new URL('../img/folder.svg',componentHref).href;
            folderName.innerText=tableName;
            fileCount.className='file-count';
            fileCount.innerText=`${files.length} ${files.length===1?'file':'files'}`;

            folder.append(folderIcon,folderName,fileCount);
            directory.append(folder);

            for(let j=0;j<files.length;j++){
                const fileName=files[j];

                directory.append(
                    createFileRow(
                        tableName,
                        fileName,
                        metadata[j]
                    )
                );
            }

            if(!files.length){
                const empty=document.createElement('li');
                empty.className='empty-directory';
                empty.innerText='Empty';
                directory.append(empty);
            }

            fileManager.append(directory);
        }
        return tableNames;
    }
</script>
