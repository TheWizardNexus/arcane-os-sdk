<style>
    :host{
        display:block;
        overflow-y:auto;
        height:100%;
    }

    .file-manager{
        min-height:100%;
    }

    .directory{
        list-style:none;
        padding:1em;
        margin:0;
    }

    .directory.open{
        max-height:none;
        overflow:visible;
    }

    .file{
        display:flex;
        align-items:flex-start;
        cursor:pointer;
        line-height:1;
    }
    
    img.icon{
        filter:var(--file-icon-filter,none);
        transition:filter 180ms,transform 180ms;
    }

    img.action-icon{
        filter:var(--icon-filter,none);
    }

    .directory .icon{
        width:2em;
        height:2em;
        margin-right:0.5em;
    }

    .file span{
        line-height:2.5em;
    }

    .file-count{
        margin-left:auto;
        opacity:.6;
    }

    .empty-directory{
        list-style:none;
        opacity:.6;
        padding:.75em 2.5em;
    }

    :host([data-layout="grid"]) .file-manager{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(12em,1fr));
        gap:1em;
        min-height:0;
    }

    :host([data-layout="grid"]) .directory{
        background:var(--background);
        border:1px solid var(--border-color);
        border-radius:.5em;
        box-shadow:0 .15em .45em var(--shadow-color);
        max-height:none;
        padding:1em;
    }

    :host([data-layout="grid"]) .directory>.file:not(.folder),
    :host([data-layout="grid"]) .empty-directory{
        display:none;
    }

    :host([data-layout="grid"]) .folder{
        align-items:center;
        flex-direction:column;
        text-align:center;
    }

    :host([data-layout="grid"]) .folder .icon{
        height:4em;
        margin:0;
        width:4em;
    }

    :host([data-layout="grid"]) .folder:hover .icon{
        filter:var(--file-icon-filter,none) drop-shadow(0 .2em .25em var(--shadow-color));
        transform:translateY(-.12em);
    }

    :host([data-layout="grid"]) .folder .file-count{
        line-height:1.5em;
        margin:0;
    }

    :host([data-layout="files"]) .directory{
        max-height:none;
        padding:0;
    }

    :host([data-layout="files"]) .folder{
        display:none;
    }

    .directory-file-list{
        list-style:none;
        margin:1em 0 0;
        padding:0;
    }

    .directory-actions,
    .file-view-actions{
        display:flex;
        justify-content:flex-end;
    }

    .file-view-delete{
        align-items:center;
        display:flex;
        gap:.5em;
    }

    .file-view-delete img{
        height:1.25em;
        width:1.25em;
    }

    .file-row,
    .modal .file-row{
        align-items:center;
        background:transparent;
        border:0;
        border-radius:0;
        box-sizing:border-box;
        box-shadow:none;
        color:var(--text-color);
        display:flex;
        line-height:1;
        margin:0;
        overflow-wrap:anywhere;
        padding:0;
        text-align:left;
    }

    .file-row-open,
    .modal .file-row-open{
        align-items:flex-start;
        background:transparent;
        border:0;
        border-radius:0;
        box-shadow:none;
        color:var(--text-color);
        display:flex;
        flex:1 1 auto;
        gap:.5em;
        margin:0;
        min-width:0;
        padding:0;
        text-align:left;
    }

    .file-row-open:hover{
        background:var(--secondary-color);
    }

    .file-delete,
    .modal .file-delete{
        background:transparent;
        border:0;
        box-shadow:none;
        flex:0 0 auto;
        margin:0;
        opacity:.55;
        padding:.35em;
    }

    .file-delete:hover{
        opacity:1;
    }

    .file-delete img{
        display:block;
        height:1.25em;
        width:1.25em;
    }

    :host([data-layout="files"]) .file-row,
    [data-layout="files"] .file-row{
        border-bottom:1px solid var(--border-color);
        padding:.5em;
        width:100%;
    }

    .file-row .file-icon{
        flex:0 0 2em;
        height:2em;
        width:2em;
    }

    .file-row .file-details{
        display:flex;
        flex-direction:column;
        min-width:0;
    }

    .file-row .file-name{
        display:block;
        line-height:2.5em;
        overflow-wrap:anywhere;

    :host([data-layout="files"]) .file-row .file-name,
    [data-layout="files"] .file-row .file-name{
        line-height:1.4em;
    }

    .file-row .file-metadata{
        display:block;
        font-size:.8em;
        line-height:1.4em;
        margin-top:.25em;
        opacity:.65;
    }

    :host([data-layout="tree"]){
        overflow:auto;
    }

    :host([data-layout="tree"]) .file-manager{
        box-sizing:border-box;
        min-height:0;
        padding:.25em;
    }

    .tree-root,
    .tree-group{
        list-style:none;
        margin:0;
        padding:0;
    }

    .tree-group{
        margin-left:.7em;
        padding-left:.7em;
        border-left:1px solid var(--border-color);
    }

    .tree-item{
        position:relative;
        margin:.08em 0;
        border-radius:.35em;
        outline:none;
    }

    .tree-item-row{
        box-sizing:border-box;
        min-height:2em;
        display:grid;
        grid-template-columns:.8em 1.35em minmax(0,1fr) auto;
        align-items:center;
        gap:.35em;
        padding:.3em .4em;
        border:1px solid transparent;
        border-radius:inherit;
        color:var(--text-color);
        cursor:pointer;
    }

    .tree-item:hover>.tree-item-row,
    .tree-item:focus>.tree-item-row{
        border-color:var(--border-color);
        background:var(--secondary-color);
    }

    .tree-item[aria-selected="true"]>.tree-item-row{
        border-color:var(--focus-color,var(--accent-color));
        background:color-mix(in srgb,var(--secondary-color) 70%,transparent);
    }

    .tree-item[data-status="needs-review"]>.tree-item-row{
        box-shadow:inset .2em 0 var(--danger-color);
    }

    .tree-disclosure{
        width:.7em;
        color:var(--platinum,var(--text-color));
        text-align:center;
        transition:transform 120ms ease-out;
    }

    .tree-item[aria-expanded="true"]>.tree-item-row .tree-disclosure{
        transform:rotate(90deg);
    }

    .tree-item[data-kind="file"]>.tree-item-row .tree-disclosure{
        visibility:hidden;
    }

    .tree-entry-icon{
        width:1.25em;
        height:1.25em;
        filter:var(--file-icon-filter,none);
    }

    .tree-entry-name{
        min-width:0;
        overflow-wrap:anywhere;
    }

    .tree-file-count{
        color:var(--platinum,var(--text-color));
        font-size:.75em;
        overflow-wrap:anywhere;
    }

    .tree-empty,
    .tree-error{
        margin:.75em;
        color:var(--platinum,var(--text-color));
    }

    .tree-error{
        color:var(--danger-color);
    }

    .file-preview,
    .file-preview-collection{
        display:grid;
        gap:1em;
        min-width:0;
        overflow-wrap:anywhere;
    }

    .file-preview h2,
    .file-preview h3,
    .file-preview h4,
    .file-preview p{
        margin-top:0;
    }

    .file-preview pre{
        margin:0;
        overflow-wrap:anywhere;
        white-space:pre-wrap;
        user-select:text;
    }

    .file-preview img{
        max-width:100%;
        height:auto;
    }

    .file-preview audio,
    .file-preview iframe{
        width:100%;
    }

    .file-preview iframe{
        min-height:60vh;
        border:0;
    }

    .file-preview table{
        display:block;
        max-width:100%;
        overflow:auto;
    }

    .file-preview-conversation{
        display:grid;
        gap:1em;
    }

    .file-preview-message{
        display:grid;
        gap:.5em;
        padding:1em;
        border:1px solid var(--border-color);
        border-radius:.5em;
        background:var(--background);
    }

    .file-preview-message[data-role="user"]{
        background:var(--arcane-action,var(--primary-color));
        color:var(--arcane-action-text,var(--button-text-color,var(--text-color)));
        border-color:var(--arcane-action,var(--primary-color));
    }

    .file-preview-message[data-role="user"] a{
        color:inherit;
    }

    .file-preview-message[data-role="assistant"]{
        background:var(--arcane-surface,var(--background));
        color:var(--text-color);
    }

    .file-preview-message header,
    .file-preview-message footer{
        display:flex;
        flex-wrap:wrap;
        gap:.75em;
    }

    .file-preview-message footer{
        font-size:.85em;
    }

    .file-preview-download:focus-visible{
        outline:2px solid var(--focus-color,var(--accent-color));
        outline-offset:.2em;
    }

</style>

<div class="file-manager">
    
</div>

<input id="fileUpload" type="file" hidden multiple>

<html-import id="directoryModal" class="modal" href="./arcane/components/modal.html"></html-import>
<html-import id="fileModal" class="modal" href="./arcane/components/modal.html"></html-import>
<html-import id="deleteModal" class="modal" href="./arcane/components/modal.html"></html-import>

<script type="module">
    const {default:Is}=await import('strong-type');
    const is=new Is(false);

    const {arcaneLogging}=await import('arcane-os/logging');

    import('../modules/DBOPFS.js');
    //importing Document at the end of the file to avoid blocking;

    const host=this;
    const componentHref=new URL(host.getAttribute('href'),document.baseURI);
    const {default:waitForComponent}=await import('../modules/WaitForComponent.js');
    const {createArcaneEventSource,projectArcaneDOMEvent}=await import('arcane-os/event-manager');
    const events=createArcaneEventSource(host,{source:'arcane.component.file-manager',eventTypes:['file-manager-action','file-manager-select','file-manager-open','file-manager-ready']});
    const lifecycleController=new AbortController();

    const fileManager=host.shadowRoot.querySelector('.file-manager');
    const componentStyles=host.shadowRoot.querySelector('style');
    const fileUpload=host.shadowRoot.querySelector('#fileUpload');
    const directoryModal=host.shadowRoot.querySelector('#directoryModal');
    const fileModal=host.shadowRoot.querySelector('#fileModal');
    const deleteModal=host.shadowRoot.querySelector('#deleteModal');
    const layout=host.dataset.layout||'';
    const openMode=host.dataset.openMode||(
        host.hasAttribute('data-event-only-open')?'event':''
    );
    const dirs=host.dataset.dirs?.split(',').map(
        directory=>directory.trim()
    ).filter(Boolean);
    const fileEntityPromise=import('../entities/File.js');
    const printModulePromise=import('../modules/PrintView.js');
    void printModulePromise.catch(function reportPrintModuleFailure(error){
        arcaneLogging.error('Unable to load rendered printing:',error);
    });

    let activePreview=null;
    let presentationController = new AbortController();
    let uploadPresentationController = null;
    let closingTask = null;
    let markdownModulePromise=null;
    let uploadDirectory='';
    let initialized=false;
    let provider=null;
    let filter=null;
    let selectedPath='';
    let treeItems=new Map();
    let treeLoadSequence=0;
    let gridLoadSequence=0;
    let providerGeneration=0;
    let filterGeneration=0;
    let treeOpenGeneration=0;
    let directoryOpenGeneration=0;
    let fileOpenGeneration=0;
    let deleteGeneration=0;
    let selectionGeneration=0;
    let operationSequence=0;
    let destroyed=false;

    host.ready=false;
    host.loadAll=loadAll;
    host.setProvider=setProvider;
    host.setFilter=setFilter;
    host.setDirectoryFilter=setDirectoryFilter;
    host.select=select;
    host.clearSelection=clearSelection;
    host.close = closeFileManager;
    host.printPreview=printPreview;
    host.destroy=destroy;

    Object.defineProperty(
        host,
        'selectedPath',
        {
            configurable:true,
            enumerable:true,
            get:()=>selectedPath
        }
    );

    Object.defineProperty(
        host,
        'provider',
        {
            configurable:true,
            enumerable:true,
            get:()=>provider
        }
    );

    function configuredHiddenPrefixes(){
        if(host.hasAttribute('data-show-hidden')){
            return [];
        }

        const configured=host.dataset.hiddenPrefixes;

        if(configured!==undefined){
            return configured.split(',').map(value=>value.trim()).filter(Boolean);
        }

        return [];
    }

    function filterContext(directory='',fileName=''){
        return {
            directory,
            fileName,
            path:joinProviderPath(directory,fileName),
            layout
        };
    }

    function isVisibleDirectory(directory='',entry=null){
        const candidate=entry||{name:directory,path:directory,kind:'directory'};
        if(configuredHiddenPrefixes().some(function hasHiddenPrefix(prefix){
            return String(candidate.name||'').startsWith(prefix);
        })){
            return false;
        }
        return !is.function(host.directoryFilter)
            ||host.directoryFilter(candidate,filterContext(directory))!==false;
    }

    function isVisibleEntry(entry={},context=null){
        const normalized=is.string(entry)
            ?{name:entry,path:entry,kind:'file'}
            :entry;
        const directory=normalized.directory
            ||(normalized.kind==='directory'?normalized.path:'');
        const details=context||filterContext(directory,normalized.fileName||normalized.name);

        if(normalized.kind==='directory'
            &&!isVisibleDirectory(normalized.path||normalized.name,normalized)){
            return false;
        }
        const activeFilter=filter||provider?.filter;

        if(is.function(activeFilter)){
            return activeFilter(normalized,details)!==false;
        }

        const name=String(normalized.name||'');
        return !configuredHiddenPrefixes().some(prefix=>name.startsWith(prefix));
    }

    function visibleFileNames(fileNames=[],directory=''){
        return fileNames.filter(function isVisibleFileName(fileName){
            return isVisibleEntry(
                {name:fileName,path:fileName,kind:'file'},
                filterContext(directory,fileName)
            );
        });
    }

    fileModal.addEventListener(
        'modal-closed',
        function closeFilePreview(){
            fileOpenGeneration+=1;
            releasePreview(activePreview,'file-preview-closed');
        },
        {signal:lifecycleController.signal}
    );

    fileUpload.addEventListener(
        'change',
        ()=>uploadFiles().catch(
            error=>{
                if(!destroyed){
                    arcaneLogging.error('Unable to upload files:',error);
                }
            }
        ),
        {signal:lifecycleController.signal}
    );

    fileManager.addEventListener(
        'click', 
        async function(e){
            const folder=e.target.closest('.folder');

            if(folder){
                const directoryElement=folder.closest('.directory');
                if(!directoryElement) return;

                if(layout==='grid'){
                    openDirectory(directoryElement.dataset.directory).catch(
                        error=>{
                            if(!destroyed){
                                arcaneLogging.error('Unable to open directory:',error);
                            }
                        }
                    );
                    return;
                }

                directoryElement.classList.toggle('open');
                return;
            }

        },
        {signal:lifecycleController.signal}
    );

    fileManager.addEventListener(
        'keydown',
        onTreeKeydown,
        {signal:lifecycleController.signal}
    );

    function nextOperationId(action='operation'){
        operationSequence+=1;
        return `${events.descriptor.instanceId}:${action}:${operationSequence}`;
    }

    function publicEventDetail(_name,detail={}){
        return detail;
    }

    function emit(name,detail={},cancelable=false,operationId=null){
        if(destroyed){
            return false;
        }
        const publication=events.dispatch(name,detail,{publicDetail:publicEventDetail(name,detail),cancelable,operationId});
        if(cancelable&&!publication.accepted){
            return false;
        }
        return projectArcaneDOMEvent(host,publication.occurrence,{bubbles:true,cancelable,composed:true});
    }

    function emitAction(action,entry={},detail={},cancelable=false,operationId=null){
        return emit(
            'file-manager-action',
            {
                action:action,
                path:entry.path||'',
                entry:entry,
                ...detail
            },
            cancelable,
            operationId
        );
    }

    async function setProvider(nextProvider=null){
        if(destroyed){
            return null;
        }
        if(nextProvider!==null&&!is.function(nextProvider?.list)){
            throw new TypeError('File manager providers must expose list(path).');
        }

        const generation=++providerGeneration;
        provider=nextProvider;

        if(layout==='tree'){
            if(!initialized){
                await init();
            }else{
                await loadAll();
            }
        }

        return destroyed||generation!==providerGeneration?null:provider;
    }

    async function setFilter(nextFilter=null){
        if(destroyed){
            return null;
        }
        if(nextFilter!==null&&!is.function(nextFilter)){
            throw new TypeError('File manager filters must be functions or null.');
        }

        const generation=++filterGeneration;
        filter=nextFilter;

        if(initialized){
            await loadAll();
        }

        return destroyed||generation!==filterGeneration?null:filter;
    }

    async function setDirectoryFilter(nextFilter=null){
        if(destroyed){
            return null;
        }
        if(nextFilter!==null&&!is.function(nextFilter)){
            throw new TypeError('File manager directory filters must be functions or null.');
        }
        const generation=++filterGeneration;
        host.directoryFilter=nextFilter;
        if(initialized){
            await loadAll();
        }
        return destroyed||generation!==filterGeneration?null:host.directoryFilter;
    }

    function normalizeProviderPath(path=''){
        return String(path||'')
            .replaceAll('\\','/')
            .split('/')
            .filter(segment=>segment&&segment!=='.')
            .join('/');
    }

    function joinProviderPath(parentPath='',name=''){
        return [normalizeProviderPath(parentPath),normalizeProviderPath(name)]
            .filter(Boolean)
            .join('/');
    }

    function normalizeProviderEntry(candidate={},parentPath=''){
        if(!candidate||!is.object(candidate)){
            return null;
        }

        const kind=candidate.kind==='directory'?'directory':'file';
        const rawPath=normalizeProviderPath(candidate.path||'');
        const name=String(
            candidate.name
            ||rawPath.split('/').pop()
            ||''
        ).trim();

        if(!name){
            return null;
        }

        const path=rawPath||joinProviderPath(parentPath,name);

        if(!path||path===normalizeProviderPath(parentPath)){
            return null;
        }

        return {
            ...candidate,
            name:name,
            path:path,
            kind:kind,
            size:is.finite(Number(candidate.size))?Number(candidate.size):0,
            mimeType:String(candidate.mimeType||''),
            lastModified:candidate.lastModified||'',
            status:String(candidate.status||''),
            hasChildren:kind==='directory'&&candidate.hasChildren!==false
        };
    }

    function normalizeProviderEntries(entries=[],parentPath=''){
        if(!is.array(entries)){
            throw new TypeError('File manager provider list(path) must return an array.');
        }

        const unique=new Map();

        for(const candidate of entries){
            const entry=normalizeProviderEntry(candidate,parentPath);

            if(entry&&isVisibleEntry(entry,filterContext(parentPath,entry.name))&&!unique.has(entry.path)){
                unique.set(entry.path,entry);
            }
        }

        return Array.from(unique.values()).sort((left,right)=>{
            if(left.kind!==right.kind){
                return left.kind==='directory'?-1:1;
            }

            return left.name.localeCompare(right.name,undefined,{numeric:true,sensitivity:'base'});
        });
    }

    const dbopfsTreeProvider={
        async list(path=''){
            const normalizedPath=normalizeProviderPath(path);

            if(!normalizedPath){
                let tableNames=dirs;

                if(!tableNames?.length){
                    tableNames=await dbopfs.getTableNames(true);
                }

                return tableNames.map(tableName=>({
                    name:tableName,
                    path:tableName,
                    kind:'directory',
                    hasChildren:true
                }));
            }

            if(!isVisibleDirectory(normalizedPath)){
                return [];
            }
            const files=visibleFileNames(await dbopfs.getAllKeys(normalizedPath),normalizedPath).sort();
            const metadata=await getFilesMetadata(normalizedPath,files);

            return files.map((fileName,index)=>({
                name:fileName,
                path:joinProviderPath(normalizedPath,fileName),
                kind:'file',
                size:metadata[index]?.size,
                mimeType:metadata[index]?.type||metadata[index]?.mimeType||'',
                lastModified:metadata[index]?.lastModified,
                directory:normalizedPath,
                fileName:fileName
            }));
        },
        async open(entry={}){
            if(entry.directory&&entry.fileName){
                return openFile(entry.directory,entry.fileName);
            }
        }
    };

    // Immediate readiness can enter loadTree before init reaches its first await.
    window.addEventListener(
        'dbopfs-ready',
        init,
        {once:true,signal:lifecycleController.signal}
    );

    if(window.dbopfs?.ready){
        init();
    }

    function activeTreeProvider(){
        return provider||dbopfsTreeProvider;
    }

    async function loadTree(){
        const sequence=++treeLoadSequence;
        fileManager.replaceChildren();
        fileManager.setAttribute('role','tree');
        fileManager.setAttribute(
            'aria-label',
            host.getAttribute('aria-label')||'Files'
        );
        fileManager.setAttribute('aria-busy','true');
        treeItems=new Map();

        if(!provider&&!window.dbopfs?.ready){
            const waiting=document.createElement('p');
            waiting.className='tree-empty';
            waiting.innerText='Files will appear when storage is ready.';
            fileManager.append(waiting);
            fileManager.setAttribute('aria-busy','false');
            return [];
        }

        try{
            const entries=normalizeProviderEntries(
                await activeTreeProvider().list(''),
                ''
            );

            if(sequence!==treeLoadSequence){
                return [];
            }

            const root=document.createElement('ul');
            root.className='tree-root';
            root.setAttribute('role','group');
            appendTreeEntries(root,entries);
            fileManager.append(root);

            if(!entries.length){
                const empty=document.createElement('p');
                empty.className='tree-empty';
                empty.innerText=host.dataset.emptyLabel||'No files are available.';
                fileManager.append(empty);
            }

            const restoredPath=selectedPath;
            const firstItem=treeItems.values().next().value;

            if(firstItem){
                setRovingTreeItem(firstItem,false);
            }

            if(restoredPath){
                const restoration=select(
                    restoredPath,
                    {emit:false,focus:false}
                );
                const restorationGeneration=selectionGeneration;
                const restored=await restoration;

                if(!restored
                    &&selectionGeneration===restorationGeneration
                    &&selectedPath===restoredPath){
                    clearSelection({emit:false});
                }
            }

            return entries;
        }catch(error){
            if(sequence!==treeLoadSequence){
                return [];
            }

            const message=document.createElement('p');
            message.className='tree-error';
            message.innerText='Unable to list files.';
            fileManager.append(message);
            emitAction(
                'error',
                {},
                {
                    error,
                    code:String(error?.code||'ARCANE_FILE_MANAGER_ROOT_LIST_FAILED'),
                    reason:'file-root-list-failed'
                },
                false,
                nextOperationId('root-list-error')
            );
            throw error;
        }finally{
            if(sequence===treeLoadSequence){
                fileManager.setAttribute('aria-busy','false');
            }
        }
    }

    function appendTreeEntries(group,entries=[]){
        const size=entries.length;

        entries.forEach((entry,index)=>{
            group.append(createTreeItem(entry,index+1,size));
        });
    }

    function createTreeItem(entry,position=1,setSize=1){
        const item=document.createElement('li');
        const row=document.createElement('div');
        const disclosure=document.createElement('span');
        const icon=document.createElement('img');
        const name=document.createElement('span');
        const count=document.createElement('span');

        item.className='tree-item';
        item.dataset.kind=entry.kind;
        item.dataset.path=entry.path;
        item.dataset.status=entry.status||'';
        item.tabIndex=-1;
        item.setAttribute('role','treeitem');
        item.setAttribute('aria-selected',String(entry.path===selectedPath));
        item.setAttribute('aria-posinset',String(position));
        item.setAttribute('aria-setsize',String(setSize));
        item._fileManagerEntry=entry;

        row.className='tree-item-row';
        row.title=entry.path;
        disclosure.className='tree-disclosure';
        disclosure.setAttribute('aria-hidden','true');
        disclosure.innerText='>';
        icon.className='tree-entry-icon';
        icon.alt='';
        icon.src=entry.kind==='directory'
            ?new URL('../img/folder.svg',componentHref).href
            :new URL('../img/doc.svg',componentHref).href;
        name.className='tree-entry-name';
        name.innerText=entry.name;
        count.className='tree-file-count';

        if(is.finite(Number(entry.fileCount))){
            setFileCountLabel(count,Number(entry.fileCount),false);
            item.dataset.fileCount=String(Number(entry.fileCount));
        }

        row.append(disclosure,icon,name,count);
        item.append(row);
        treeItems.set(entry.path,item);

        if(entry.kind==='directory'&&entry.hasChildren){
            const group=document.createElement('ul');
            group.className='tree-group';
            group.hidden=true;
            group.setAttribute('role','group');
            item.setAttribute('aria-expanded','false');
            item.append(group);
        }else if(entry.kind==='directory'){
            setFileCountLabel(count,0,false);
            item.dataset.fileCount='0';
        }

        row.addEventListener(
            'click',
            async()=>{
                const selected=await select(entry.path,{entry:entry,focus:true});
                if(!selected||destroyed){
                    return;
                }

                if(entry.kind==='directory'){
                    await toggleTreeItem(item);
                }
            },
            {signal:lifecycleController.signal}
        );
        row.addEventListener(
            'dblclick',
            async event=>{
                if(entry.kind==='file'){
                    event.preventDefault();
                    await openTreeItem(item,'double-click');
                }
            },
            {signal:lifecycleController.signal}
        );
        item.addEventListener(
            'focus',
            ()=>setRovingTreeItem(item,false),
            {signal:lifecycleController.signal}
        );

        return item;
    }

    function setFileCountLabel(element,count=0,partial=false){
        const suffix=partial?'+':'';
        element.innerText=`${count}${suffix} ${count===1&&!partial?'file':'files'}`;
    }

    function updateTreeCounts(item){
        let current=item;

        while(current){
            if(current.dataset.kind==='directory'){
                const exact=Number(current._fileManagerEntry?.fileCount);
                const countElement=current.querySelector(':scope>.tree-item-row>.tree-file-count');

                if(is.finite(exact)){
                    current.dataset.fileCount=String(exact);
                    setFileCountLabel(countElement,exact,false);
                }else if(current.dataset.loaded==='true'){
                    const group=current.querySelector(':scope>.tree-group');
                    const count=group
                        ?group.querySelectorAll('.tree-item[data-kind="file"]').length
                        :0;
                    const partial=Boolean(
                        group&&Array.from(
                            group.querySelectorAll('.tree-item[data-kind="directory"]')
                        ).some(directory=>
                            directory._fileManagerEntry?.hasChildren
                            &&directory.dataset.loaded!=='true'
                        )
                    );
                    current.dataset.fileCount=String(count);
                    setFileCountLabel(countElement,count,partial);
                }
            }

            current=current.parentElement?.closest('.tree-item')||null;
        }
    }

    async function expandTreeItem(item,{emitEvent=true}={}){
        if(destroyed||!item||item.dataset.kind!=='directory'){
            return false;
        }

        const group=item.querySelector(':scope>.tree-group');

        if(!group){
            return false;
        }

        if(item.dataset.loaded!=='true'){
            const entry=item._fileManagerEntry;
            const sequence=treeLoadSequence;
            item.setAttribute('aria-busy','true');

            try{
                const entries=normalizeProviderEntries(
                    await activeTreeProvider().list(entry.path),
                    entry.path
                );

                if(sequence!==treeLoadSequence||!fileManager.contains(item)){
                    return false;
                }

                group.replaceChildren();
                appendTreeEntries(group,entries);

                if(!entries.length){
                    const empty=document.createElement('li');
                    empty.className='tree-empty';
                    empty.setAttribute('role','none');
                    empty.innerText='Empty';
                    group.append(empty);
                }

                item.dataset.loaded='true';
                updateTreeCounts(item);
            }catch(error){
                if(destroyed||sequence!==treeLoadSequence||!fileManager.contains(item)){
                    return false;
                }
                group.replaceChildren();
                const message=document.createElement('li');
                message.className='tree-error';
                message.setAttribute('role','none');
                message.innerText='Unable to list this folder.';
                group.append(message);
                emitAction(
                    'error',
                    entry,
                    {
                        error,
                        code:String(error?.code||'ARCANE_FILE_MANAGER_DIRECTORY_LIST_FAILED'),
                        reason:'directory-list-failed'
                    },
                    false,
                    nextOperationId('directory-list-error')
                );
                return false;
            }finally{
                if(!destroyed
                    &&sequence===treeLoadSequence
                    &&fileManager.contains(item)){
                    item.removeAttribute('aria-busy');
                }
            }
        }

        group.hidden=false;
        item.setAttribute('aria-expanded','true');

        if(emitEvent){
            emitAction('expand',item._fileManagerEntry);
        }

        return true;
    }

    function collapseTreeItem(item,{emitEvent=true}={}){
        if(destroyed){
            return false;
        }
        const group=item?.querySelector(':scope>.tree-group');

        if(!group){
            return false;
        }

        group.hidden=true;
        item.setAttribute('aria-expanded','false');

        if(emitEvent){
            emitAction('collapse',item._fileManagerEntry);
        }

        return true;
    }

    async function toggleTreeItem(item){
        if(destroyed){
            return false;
        }
        if(item?.getAttribute('aria-expanded')==='true'){
            return collapseTreeItem(item);
        }

        return expandTreeItem(item);
    }

    function setRovingTreeItem(item,focus=true){
        if(!item){
            return;
        }

        for(const treeItem of treeItems.values()){
            treeItem.tabIndex=treeItem===item?0:-1;
        }

        if(focus){
            item.focus();
        }
    }

    function visibleTreeItems(){
        return Array.from(
            fileManager.querySelectorAll('.tree-item[role="treeitem"]')
        ).filter(
            item=>!item.closest('.tree-group[hidden]')
        );
    }

    async function revealTreePath(path=''){
        const normalizedPath=normalizeProviderPath(path);
        let item=treeItems.get(normalizedPath)||null;

        if(item){
            return item;
        }

        const segments=normalizedPath.split('/').filter(Boolean);

        for(let i=1;i<segments.length;i++){
            const parentPath=segments.slice(0,i).join('/');
            const parent=treeItems.get(parentPath);

            if(parent?.dataset.kind==='directory'){
                await expandTreeItem(parent,{emitEvent:false});
                item=treeItems.get(normalizedPath)||null;

                if(item){
                    return item;
                }
            }
        }

        return null;
    }

    async function select(path='',options={}){
        if(destroyed){
            return false;
        }
        const generation=++selectionGeneration;
        const normalizedPath=normalizeProviderPath(path);

        if(!normalizedPath){
            return clearSelection(options);
        }

        let item=null;
        let entry=options.entry||null;

        if(layout==='tree'){
            item=await revealTreePath(normalizedPath);

            if(destroyed||generation!==selectionGeneration){
                return false;
            }

            if(!item){
                return false;
            }

            entry=item._fileManagerEntry;
        }

        selectedPath=normalizedPath;

        if(layout==='tree'){
            for(const treeItem of treeItems.values()){
                treeItem.setAttribute(
                    'aria-selected',
                    String(treeItem===item)
                );
            }
            setRovingTreeItem(item,options.focus===true);
        }else{
            fileManager.querySelectorAll('[data-file-path]').forEach(element=>{
                element.setAttribute(
                    'aria-selected',
                    String(element.dataset.filePath===selectedPath)
                );
            });
        }

        if(options.emit!==false){
            emit('file-manager-select',{path:selectedPath,entry:entry});
        }

        return true;
    }

    function clearSelection(options={}){
        if(destroyed){
            return false;
        }
        selectionGeneration+=1;
        const changed=Boolean(selectedPath);
        selectedPath='';

        if(layout==='tree'){
            for(const treeItem of treeItems.values()){
                treeItem.setAttribute('aria-selected','false');
            }
        }else{
            fileManager.querySelectorAll('[data-file-path]').forEach(element=>{
                element.setAttribute('aria-selected','false');
            });
        }

        if(options.emit===true){
            emit('file-manager-select',{path:'',entry:null});
        }

        return changed;
    }

    async function openTreeItem(item,trigger='open'){
        if(destroyed){
            return false;
        }
        const generation=++treeOpenGeneration;
        const entry=item?._fileManagerEntry;

        if(!entry||entry.kind!=='file'){
            return false;
        }

        const selected=await select(entry.path,{entry:entry,focus:true});
        if(!selected||destroyed||generation!==treeOpenGeneration){
            return false;
        }
        const detail={path:entry.path,entry:entry,trigger:trigger};
        const operationId=nextOperationId('open');
        const openAllowed=emit('file-manager-open',detail,true,operationId);
        const actionAllowed=emitAction('open',entry,{trigger:trigger},true,operationId);

        if(!openAllowed||!actionAllowed||openMode==='event'){
            return true;
        }

        if(is.function(activeTreeProvider().open)){
            try{
                await activeTreeProvider().open(entry);
                if(destroyed||generation!==treeOpenGeneration){
                    return false;
                }
            }catch(error){
                if(!destroyed&&generation===treeOpenGeneration){
                    emitAction(
                        'error',
                        entry,
                        {
                            error,
                            code:String(error?.code||'ARCANE_FILE_MANAGER_ENTRY_OPEN_FAILED'),
                            reason:'file-open-failed'
                        },
                        false,
                        nextOperationId('open-error')
                    );
                    arcaneLogging.error('Unable to open file:',error);
                }
                return false;
            }
        }

        return true;
    }

    async function onTreeKeydown(event){
        if(layout!=='tree'){
            return;
        }

        const item=event.target.closest?.('.tree-item[role="treeitem"]');

        if(!item||!fileManager.contains(item)){
            return;
        }

        const items=visibleTreeItems();
        const index=items.indexOf(item);
        const focusAt=nextIndex=>{
            const next=items[nextIndex];
            if(next){
                setRovingTreeItem(next,true);
            }
        };

        switch(event.key){
            case 'ArrowDown':
                event.preventDefault();
                focusAt(Math.min(items.length-1,index+1));
                break;
            case 'ArrowUp':
                event.preventDefault();
                focusAt(Math.max(0,index-1));
                break;
            case 'Home':
                event.preventDefault();
                focusAt(0);
                break;
            case 'End':
                event.preventDefault();
                focusAt(items.length-1);
                break;
            case 'ArrowRight':
                if(item.dataset.kind!=='directory'){
                    break;
                }
                event.preventDefault();
                if(item.getAttribute('aria-expanded')!=='true'){
                    await expandTreeItem(item);
                }else{
                    const firstChild=item.querySelector(':scope>.tree-group>.tree-item');
                    if(firstChild){
                        setRovingTreeItem(firstChild,true);
                    }
                }
                break;
            case 'ArrowLeft':{
                event.preventDefault();
                if(item.dataset.kind==='directory'&&item.getAttribute('aria-expanded')==='true'){
                    collapseTreeItem(item);
                }else{
                    const parent=item.parentElement?.closest('.tree-item');
                    if(parent){
                        setRovingTreeItem(parent,true);
                    }
                }
                break;
            }
            case 'Enter':
                event.preventDefault();
                if(item.dataset.kind==='directory'){
                    await toggleTreeItem(item);
                    await select(item.dataset.path,{entry:item._fileManagerEntry});
                }else{
                    await openTreeItem(item,'keyboard');
                }
                break;
            case ' ':
                event.preventDefault();
                await select(item.dataset.path,{entry:item._fileManagerEntry});
                break;
        }
    }

    async function openDirectory(directory = '', signal = presentationController.signal) {
        if (closingTask && !await closingTask) {
            return false;
        }
        if(destroyed||signal.aborted||!isVisibleDirectory(directory)){
            return false;
        }
        const generation=++directoryOpenGeneration;
        const modal = await waitForModal(
            directoryModal,
            ['populate', 'open'],
            signal
        );
        if(!modal||destroyed||generation!==directoryOpenGeneration||!isVisibleDirectory(directory)){
            return false;
        }
        const keys=await dbopfs.getAllKeys(directory);
        if(destroyed||generation!==directoryOpenGeneration){
            return false;
        }
        const files=visibleFileNames(keys,directory).sort();
        const metadata=await getFilesMetadata(directory,files);
        if(destroyed||generation!==directoryOpenGeneration){
            return false;
        }
        const content=document.createElement('section');
        const styles=componentStyles.cloneNode(true);
        const heading=document.createElement('h1');
        const actions=document.createElement('section');
        const uploadButton=document.createElement('button');
        const list=document.createElement('ul');

        heading.innerText=directory;
        actions.className='directory-actions';
        uploadButton.type='button';
        uploadButton.dataset.directory=directory;
        uploadButton.innerText='Upload Files';
        uploadButton.addEventListener(
            'click',
            ()=>selectFiles(directory),
            {signal:lifecycleController.signal}
        );
        list.className='directory-file-list';
        list.dataset.layout='files';

        actions.append(uploadButton);
        content.append(styles,heading,actions);

        if(!files.length){
            const empty=document.createElement('p');
            empty.innerText='This directory is empty.';
            content.append(empty);
        }else{
            for(let i=0;i<files.length;i++){
                list.append(
                    createFileRow(
                        directory,
                        files[i],
                        metadata[i]
                    )
                );
            }

            content.append(list);
        }

        await modal.populate(content,false);
        if(destroyed||generation!==directoryOpenGeneration){
            return false;
        }
        modal.open();
        return true;
    }

    async function openFile(directory='',fileName=''){
        const signal = presentationController.signal;
        if (closingTask && !await closingTask) {
            return false;
        }
        if(destroyed||signal.aborted){
            return false;
        }
        releasePreview(activePreview,'file-preview-replaced');
        const generation=++fileOpenGeneration;
        const preview={
            controller:new AbortController(),
            generation,
            urls:new Set(),
            media:new Set(),
            markdownMedia:new Set(),
            markdownStatus:false,
            title:`${directory}/${fileName}`,
            rendered:null,
            printPreparation:null,
            printRetains:0,
            released:false
        };
        activePreview=preview;
        let modal;
        try{
            modal=await waitForComponent(
                fileModal,
                {
                    methods:['populate','open'],
                    property:'ready',
                    event:'modal-ready',
                    signal:preview.controller.signal
                },
                {signal:preview.controller.signal}
            );
        }catch(error){
            const current=isCurrentPreview(preview);
            releasePreview(preview,'file-preview-unavailable');
            if(current){
                throw error;
            }
            return false;
        }
        if(!isCurrentPreview(preview)){
            return false;
        }
        configureFileModal(modal);
        const content=document.createElement('section');
        const styles=componentStyles.cloneNode(true);
        const heading=document.createElement('h1');
        const actions=document.createElement('section');
        const deleteButton=document.createElement('button');
        const deleteIcon=document.createElement('img');
        const status=document.createElement('p');
        const printButton=document.createElement('button');

        heading.innerText=`${directory}/${fileName}`;
        printButton.type='button';
        printButton.textContent='Print';
        printButton.disabled=true;
        preview.printButton=printButton;
        preview.printStatus=status;
        preview.container=content;
        printButton.addEventListener('click',function printOpenPreview(){
            void printPreview().catch(function reportPrintRejection(error){
                reportPreviewPrintFailure(error,preview);
            });
        },{signal:preview.controller.signal});
        actions.className='file-view-actions';
        deleteButton.type='button';
        deleteButton.className='file-view-delete';
        deleteButton.innerText='Delete File';
        deleteIcon.alt='';
        deleteIcon.className='action-icon';
        deleteIcon.src=new URL('../img/trash.svg',componentHref).href;
        deleteButton.prepend(deleteIcon);
        deleteButton.onclick=function deletePreviewFile(){
            return confirmDelete(directory,fileName,true).catch(
                error=>{
                    if(!destroyed){
                        arcaneLogging.error('Unable to delete file:',error);
                    }
                }
            );
        };
        status.innerText='Opening file...';
        status.setAttribute('role','status');
        actions.append(printButton,deleteButton);
        content.append(
            styles,
            heading,
            actions,
            document.createElement('hr'),
            status
        );

        await modal.populate(content,false);
        if(!isCurrentPreview(preview)){
            return false;
        }
        modal.open();

        try{
            const {default:FileEntity}=await fileEntityPromise;
            if(!isCurrentPreview(preview)){
                return false;
            }
            const file=new FileEntity(fileName,directory);
            const fileRef=await file.open();
            if(!isCurrentPreview(preview)){
                return false;
            }

            const rendered=await renderFile(fileRef,{directory,fileName},preview);
            if(!isCurrentPreview(preview)){
                releasePreview(preview,'file-preview-superseded');
                return false;
            }
            status.remove();
            content.append(rendered);
            preview.rendered=rendered;
            updateMarkdownPreviewStatus(preview);
            void preparePreviewPrint(preview).catch(function reportPrintPreparation(error){
                reportPreviewPrintFailure(error,preview);
            });
            return true;
        }catch(error){
            if(isCurrentPreview(preview)){
                status.innerText='Unable to open this file.';
                status.setAttribute('role','alert');
                arcaneLogging.error('Unable to open file:',error);
            }
            releasePreview(preview,'file-preview-failed');
            return false;
        }
    }

    function preparePreviewPrint(preview){
        if(!preview.printPreparation){
            preview.printPreparation=printModulePromise.then(function registerPreviewPrint({createPrintView}){
                if(!isCurrentPreview(preview)||!preview.rendered){
                    return null;
                }
                const view=createPrintView({
                    host,
                    content:()=>previewPrintContent(preview),
                    title:()=>preview.title,
                    active:()=>isCurrentPreview(preview)&&fileModal.opened===true,
                    priority:1,
                    signal:preview.controller.signal,
                    prepare:function preparePreviewMedia(signal){return waitForPreviewMarkdown(preview,signal);},
                    retain:()=>retainPreviewPrintResources(preview),
                    onError:error=>reportPreviewPrintFailure(error,preview)
                });
                preview.printButton.disabled=false;
                return view;
            });
        }
        return preview.printPreparation;
    }

    async function printPreview(){
        const preview=activePreview;
        if(!preview?.rendered||!isCurrentPreview(preview)||fileModal.opened!==true){
            return false;
        }
        if(!await waitForPreviewMarkdown(preview)){
            return false;
        }
        const view=await preparePreviewPrint(preview);
        return view&&isCurrentPreview(preview)?view.print():false;
    }

    async function waitForPreviewMarkdown(preview,signal){
        signal?.throwIfAborted();
        const results=await Promise.allSettled(
            [...preview.markdownMedia].map(function markdownReadiness(media){
                return media.owner.ready;
            })
        );
        signal?.throwIfAborted();
        if(!isCurrentPreview(preview)||fileModal.opened!==true){
            return false;
        }
        const failures=results.filter(function failedMarkdown(result){
            return result.status==='rejected';
        }).map(function markdownFailure(result){
            return result.reason;
        });
        if(failures.length){
            throw new AggregateError(failures,'Local images could not be prepared for printing.');
        }
        return true;
    }

    function previewPrintContent(preview){
        const failures=[];
        for(const media of preview.markdownMedia){
            if(!media.settled){
                throw new Error('Local images are still loading. Use Print after they finish.');
            }
            if(media.error){
                failures.push(media.error);
            }
        }
        if(failures.length){
            throw new AggregateError(failures,'Local images could not be prepared for printing.');
        }
        return preview.rendered;
    }

    function updateMarkdownPreviewStatus(preview){
        if(!isCurrentPreview(preview)||!preview.rendered){
            return;
        }
        if([...preview.markdownMedia].some(function failedMarkdown(media){return media.error;})){
            preview.markdownStatus=true;
            preview.printStatus.textContent='Some images could not be loaded. Reopen this file to try again.';
            preview.printStatus.setAttribute('role','alert');
            preview.container.append(preview.printStatus);
        }else if(preview.markdownStatus&&[...preview.markdownMedia].every(function settledMarkdown(media){return media.settled;})){
            preview.markdownStatus=false;
            preview.printStatus.remove();
        }
    }

    function reportPreviewPrintFailure(error,preview){
        arcaneLogging.error('Unable to print file preview:',error);
        if(isCurrentPreview(preview)){
            const media=[...preview.markdownMedia];
            preview.markdownStatus=media.some(function unavailableImage(item){return !item.settled||item.error;});
            preview.printStatus.textContent=media.some(function pendingImage(item){return !item.settled;})
                ?'Images are still loading. Close this print dialog and use Print after they finish.'
                :media.some(function failedImage(item){return item.error;})
                    ?'Some images could not be loaded. Close any print dialog and reopen this file to try again.'
                    :'Unable to open print preview. Please try again.';
            preview.printStatus.setAttribute('role','alert');
            preview.container.append(preview.printStatus);
        }
    }

    function retainPreviewPrintResources(preview){
        const markdownReleases=[];
        try{
            for(const media of preview.markdownMedia){
                markdownReleases.push(media.owner.retain());
            }
        }catch(error){
            for(const release of markdownReleases){
                release();
            }
            throw error;
        }
        preview.printRetains+=1;
        let retained=true;
        return function releasePrintedPreviewResources(){
            if(!retained){
                return;
            }
            retained=false;
            for(const release of markdownReleases){
                release();
            }
            preview.printRetains-=1;
            if(preview.released&&preview.printRetains===0){
                releasePreviewURLs(preview);
            }
        };
    }

    function releasePreviewURLs(preview){
        for(const url of preview.urls){
            URL.revokeObjectURL(url);
        }
        preview.urls.clear();
    }

    function configureFileModal(modal){
        const appearance=getComputedStyle(host);
        for(const property of ['--modal-width','--modal-max-height','--modal-padding']){
            if(!modal.style.getPropertyValue(property)){
                modal.style.setProperty(property,appearance.getPropertyValue(property).trim());
            }
        }
    }

    function isCurrentPreview(preview){
        return !destroyed
            &&activePreview===preview
            &&preview.generation===fileOpenGeneration
            &&!preview.controller.signal.aborted;
    }

    function releasePreview(preview,reason){
        if(!preview||preview.released){
            return;
        }
        preview.released=true;
        preview.controller.abort(reason);
        for(const media of preview.markdownMedia){
            media.owner.destroy();
        }
        preview.markdownMedia.clear();
        for(const element of preview.media){
            if(element.localName==='audio'){
                element.pause();
            }
            if(element.localName==='iframe'){
                element.removeAttribute('srcdoc');
            }
            element.removeAttribute(element.localName==='a'?'href':'src');
            if(element.localName==='audio'){
                element.load();
            }
        }
        if(preview.printRetains===0){
            releasePreviewURLs(preview);
        }
        preview.media.clear();
        if(activePreview===preview){
            activePreview=null;
        }
    }

    function previewObjectURL(content,preview){
        if(!(content instanceof Blob)){
            throw new TypeError('File preview media and downloads require a Blob or File.');
        }
        preview.controller.signal.throwIfAborted();
        const url=URL.createObjectURL(content);
        preview.urls.add(url);
        return url;
    }

    async function renderDescriptor(descriptor,preview,depth=0){
        preview.controller.signal.throwIfAborted();
        if(!descriptor||!is.object(descriptor)||is.array(descriptor)){
            throw new TypeError('File preview descriptors must be objects.');
        }
        const rendered=document.createElement('section');
        rendered.className='file-preview';
        if(descriptor.title!==undefined){
            const heading=document.createElement(`h${Math.min(depth+2,6)}`);
            heading.textContent=descriptor.title;
            rendered.append(heading);
        }

        switch(descriptor.kind){
            case 'text':
            case 'markdown':
            case 'html':{
                if(!is.string(descriptor.content)){
                    throw new TypeError(`File preview ${descriptor.kind} content must be a string.`);
                }
                if(descriptor.kind==='text'){
                    rendered.append(createPreformatted(descriptor.content));
                    break;
                }
                const body=document.createElement(descriptor.kind==='html'?'iframe':'div');
                if(descriptor.kind==='markdown'){
                    markdownModulePromise=markdownModulePromise||Promise.all([
                        import('../modules/MD.js'),
                        import('../modules/MarkdownMedia.js')
                    ]);
                    const [{default:MD},{hydrateMarkdownMedia}]=await markdownModulePromise;
                    preview.controller.signal.throwIfAborted();
                    const template=document.createElement('template');
                    template.innerHTML=new MD(descriptor.content).safeRendered;
                    const owner=hydrateMarkdownMedia(template.content,{signal:preview.controller.signal});
                    const media={owner,settled:false,error:null};
                    preview.markdownMedia.add(media);
                    void owner.ready.then(
                        function markdownImagesReady(){
                            media.settled=true;
                            updateMarkdownPreviewStatus(preview);
                        },
                        function markdownImagesFailed(error){
                            media.settled=true;
                            media.error=error;
                            if(isCurrentPreview(preview)){
                                arcaneLogging.error('Unable to load local Markdown images:',error);
                                updateMarkdownPreviewStatus(preview);
                            }
                        }
                    );
                    body.append(template.content);
                }else{
                    body.title=descriptor.title||'HTML preview';
                    body.srcdoc=descriptor.content;
                    preview.media.add(body);
                }
                rendered.append(body);
                break;
            }
            case 'json':
                rendered.append(createPreformatted(JSON.stringify(descriptor.content,null,4)));
                break;
            case 'conversation':{
                if(!is.array(descriptor.messages)){
                    throw new TypeError('File preview conversation messages must be an array.');
                }
                const messages=document.createElement('div');
                messages.className='file-preview-conversation';
                const entries=await Promise.all(
                    descriptor.messages.map(async function renderConversationMessage(message){
                        if(!message||!is.string(message.role)||!is.string(message.content)){
                            throw new TypeError('File preview messages require role and content strings.');
                        }
                        const article=document.createElement('article');
                        const header=document.createElement('header');
                        const speaker=document.createElement('strong');
                        const footer=document.createElement('footer');
                        const time=document.createElement('time');
                        article.className='file-preview-message';
                        article.dataset.role=message.role;
                        if(message.role==='assistant'){
                            speaker.textContent=is.string(message.name)&&message.name.trim()
                                ?message.name
                                :'AI';
                        }else{
                            speaker.textContent=message.name===undefined
                                ?message.role
                                :`${message.name} · ${message.role}`;
                        }
                        header.append(speaker);
                        if(message.timestamp===undefined||message.timestamp===null){
                            time.textContent='Time unavailable';
                        }else{
                            const timestamp=new Date(message.timestamp);
                            if(is.finite(timestamp.getTime())){
                                time.dateTime=timestamp.toISOString();
                                time.textContent=timestamp.toLocaleString();
                            }else{
                                time.textContent=String(message.timestamp);
                            }
                        }
                        footer.append(time);
                        if(message.status!==undefined){
                            const state=document.createElement('span');
                            state.textContent=message.status;
                            footer.append(state);
                        }
                        const body=await renderDescriptor(
                            {kind:'markdown',content:message.content},
                            preview,
                            depth+1
                        );
                        article.append(header,body,footer);
                        return article;
                    })
                );
                preview.controller.signal.throwIfAborted();
                for(const entry of entries){
                    messages.append(entry);
                }
                rendered.append(messages);
                break;
            }
            case 'collection':{
                if(!is.array(descriptor.items)){
                    throw new TypeError('File preview collection items must be an array.');
                }
                const items=await Promise.all(
                    descriptor.items.map(function renderCollectionItem(item){
                        return renderDescriptor(item,preview,depth+1);
                    })
                );
                preview.controller.signal.throwIfAborted();
                const collection=document.createElement('div');
                collection.className='file-preview-collection';
                for(const item of items){
                    collection.append(item);
                }
                rendered.append(collection);
                break;
            }
            case 'image':
            case 'audio':
            case 'pdf':
            case 'download':{
                if(descriptor.kind==='download'&&!is.string(descriptor.fileName)){
                    throw new TypeError('File preview downloads require a fileName string.');
                }
                if(is.function(descriptor.content)){
                    const item=document.createElement('div');
                    const loadButton=document.createElement('button');
                    const state=document.createElement('p');
                    loadButton.type='button';
                    loadButton.textContent=`Load ${descriptor.title||descriptor.fileName||descriptor.kind}`;
                    state.setAttribute('role','status');
                    loadButton.addEventListener(
                        'click',
                        async function loadPreviewMedia(){
                            loadButton.disabled=true;
                            state.setAttribute('role','status');
                            state.textContent='Loading...';
                            try{
                                const content=await descriptor.content({signal:preview.controller.signal});
                                if(!isCurrentPreview(preview)){
                                    return;
                                }
                                item.replaceChildren(createPreviewMedia(descriptor,content,preview));
                            }catch(error){
                                if(isCurrentPreview(preview)){
                                    state.setAttribute('role','alert');
                                    state.textContent='Unable to load this item.';
                                    loadButton.disabled=false;
                                    arcaneLogging.error('Unable to load file preview item:',error);
                                }
                            }
                        },
                        {signal:preview.controller.signal}
                    );
                    item.append(loadButton,state);
                    rendered.append(item);
                }else{
                    rendered.append(createPreviewMedia(descriptor,descriptor.content,preview));
                }
                break;
            }
            default:
                throw new TypeError(`Unsupported file preview kind: ${String(descriptor.kind)}.`);
        }
        return rendered;
    }

    function createPreviewMedia(descriptor,content,preview){
        const tag={image:'img',audio:'audio',pdf:'iframe',download:'a'}[descriptor.kind];
        const media=document.createElement(tag);
        const url=previewObjectURL(content,preview);
        preview.media.add(media);
        if(descriptor.kind==='download'){
            media.className='file-preview-download';
            media.href=url;
            media.download=descriptor.fileName;
            media.textContent=descriptor.title||descriptor.fileName;
        }else{
            media.src=url;
            if(descriptor.kind==='image'){
                media.alt=descriptor.alt??descriptor.title??content.name??'';
            }else if(descriptor.kind==='audio'){
                media.controls=true;
                media.preload='metadata';
                media.setAttribute('aria-label',descriptor.title||content.name||'Audio preview');
            }else{
                media.title=descriptor.title||content.name||'PDF preview';
            }
        }
        return media;
    }

    async function renderFile(fileRef,context={},preview){
        const details={
            directory:String(context.directory||''),
            extension:String(fileRef.ext||''),
            fileName:String(context.fileName||fileRef.name||''),
            path:joinProviderPath(context.directory,context.fileName||fileRef.name),
            mimeType:String(fileRef.mime||fileRef.type||''),
            signal:preview.controller.signal
        };
        const mimeType=details.mimeType.split(';')[0].trim().toLowerCase();
        if(is.function(host.previewDescriptor)){
            const descriptor=await host.previewDescriptor(fileRef,details);
            preview.controller.signal.throwIfAborted();
            if(descriptor!==null&&descriptor!==undefined){
                return renderDescriptor(descriptor,preview);
            }
        }

        if(mimeType.startsWith('image/')||['png','jpg','jpeg','webp','svg'].includes(fileRef.ext)){
            return renderDescriptor(
                {kind:'image',content:new Blob([fileRef],{type:fileRef.mime}),alt:fileRef.name},
                preview
            );
        }
        if(mimeType.startsWith('audio/')){
            return renderDescriptor(
                {kind:'audio',content:new Blob([fileRef],{type:fileRef.mime})},
                preview
            );
        }
        if(fileRef.ext==='pdf'||mimeType==='application/pdf'){
            return renderDescriptor(
                {kind:'pdf',content:new Blob([fileRef],{type:fileRef.mime}),title:fileRef.name},
                preview
            );
        }
        if(fileRef.ext==='html'||mimeType==='text/html'){
            const html=await fileRef.text();
            preview.controller.signal.throwIfAborted();
            return renderDescriptor({kind:'html',content:html,title:fileRef.name},preview);
        }
        if(fileRef.ext==='md'||mimeType==='text/markdown'){
            const markdown=await fileRef.text();
            preview.controller.signal.throwIfAborted();
            return renderDescriptor({kind:'markdown',content:markdown},preview);
        }

        const rendered=document.createElement('div');
        rendered.className='file-preview';
        let value=fileRef.parsed;
        const jsonFile=['json','jsonl','ndjson'].includes(fileRef.ext);
        const transformed=jsonFile&&is.function(host.previewTransform);
        let completeJSON;

        if(transformed){
            value=await host.previewTransform(
                value,
                {
                    directory:String(context.directory||''),
                    extension:String(fileRef.ext||''),
                    fileName:String(context.fileName||fileRef.name||'')
                }
            );
            preview.controller.signal.throwIfAborted();
        }else if(jsonFile){
            // Recognition needs the complete file: FileEntity's parsed JSONL
            // rows do not include every unparseable line in the original.
            const [{decodeMarkdownMediaRecord},text]=await Promise.all([
                import('../modules/MarkdownMedia.js'),
                fileRef.text()
            ]);
            preview.controller.signal.throwIfAborted();
            completeJSON=text;
            let imageRecord;
            try {
                imageRecord = JSON.parse(completeJSON);
            } catch {
                // Mixed JSONL and ordinary text keep their complete presentation.
                imageRecord = null;
            }
            while (is.array(imageRecord) && imageRecord.length === 1) {
                imageRecord = imageRecord[0];
            }
            // A dataUrl property alone does not identify an image record.
            // Recognize its declared media type before attempting any decoding.
            if (is.string(imageRecord?.mediaType)
                && imageRecord.mediaType.toLowerCase().startsWith('image/')) {
                const image = decodeMarkdownMediaRecord(imageRecord);
                if (image?.type.startsWith('image/')) {
                    return renderDescriptor(
                        {kind: 'image', content: image, alt: fileRef.name},
                        preview
                    );
                }
            }
        }

        switch(fileRef.ext){
            case 'json':
                rendered.append(
                    createPreformatted(
                        JSON.stringify(value,null,4)
                    )
                );
                break;
            case 'jsonl':
            case 'ndjson':{
                if(!transformed){
                    rendered.append(createPreformatted(completeJSON));
                    break;
                }
                const records=is.array(value)?value:[];

                for(let i=0;i<records.length;i++){
                    rendered.append(
                        createPreformatted(
                            JSON.stringify(records[i],null,4)
                        )
                    );

                    if(i<records.length-1){
                        rendered.append(document.createElement('hr'));
                    }
                }
                break;
            }
            default:
                if(mimeType.startsWith('text/')
                    ||['application/json','application/javascript','application/xml'].includes(mimeType)
                    ||mimeType.endsWith('+json')
                    ||mimeType.endsWith('+xml')
                    ||['txt','log','css','js','mjs'].includes(fileRef.ext)){
                    rendered.append(createPreformatted(await fileRef.text()));
                }else{
                    rendered.append(
                        await renderDescriptor(
                            {kind:'download',content:fileRef,fileName:details.fileName},
                            preview
                        )
                    );
                }
        }

        preview.controller.signal.throwIfAborted();
        return rendered;
    }

    function createPreformatted(content=''){
        const pre=document.createElement('pre');
        pre.innerText=content;
        return pre;
    }

    async function getFilesMetadata(directory='',files=[]){
        return Promise.all(
            files.map(
                fileName=>dbopfs.getFileMetadata(
                    directory,
                    fileName
                ).catch(()=>({}))
            )
        );
    }

    function formatLastModified(metadata={}){
        if(!metadata.lastModified){
            return '';
        }

        return `Updated: ${new Date(metadata.lastModified).toLocaleString()}`;
    }

    function createFileRow(directory='',fileName='',metadata={}){
        const file=document.createElement('li');
        const openButton=document.createElement('button');
        const fileIcon=document.createElement('img');
        const fileDetails=document.createElement('span');
        const fileLabel=document.createElement('span');
        const fileMetadata=document.createElement('small');
        const deleteButton=document.createElement('button');
        const deleteIcon=document.createElement('img');
        const entry={
            name:fileName,
            path:joinProviderPath(directory,fileName),
            kind:'file',
            size:Number(metadata.size)||0,
            mimeType:String(metadata.type||metadata.mimeType||''),
            lastModified:metadata.lastModified||'',
            directory:directory,
            fileName:fileName
        };

        file.className='file file-row';

        file.title=fileName;
        openButton.type='button';
        openButton.className='file-row-open';
        openButton.dataset.fileAction='open';
        openButton.dataset.directory=directory;
        openButton.dataset.file=fileName;
        openButton.dataset.filePath=entry.path;
        openButton.setAttribute('aria-selected',String(entry.path===selectedPath));

        fileIcon.alt='';
        fileIcon.className='icon file-icon';
        fileIcon.src=new URL('../img/doc.svg',componentHref).href;
        fileDetails.className='file-details';
        fileLabel.className='file-name';
        fileLabel.innerText=fileName;
        fileMetadata.className='file-metadata';
        fileMetadata.innerText=formatLastModified(metadata);

        fileDetails.append(fileLabel);

        if(fileMetadata.innerText){
            fileDetails.append(fileMetadata);
        }

        deleteButton.type='button';
        deleteButton.className='file-delete';
        deleteButton.dataset.fileAction='delete';
        deleteButton.dataset.directory=directory;
        deleteButton.dataset.file=fileName;
        deleteButton.title=`Delete ${fileName}`;
        deleteButton.setAttribute('aria-label',`Delete ${fileName}`);

        deleteIcon.alt='';
        deleteIcon.className='action-icon';
        deleteIcon.src=new URL('../img/trash.svg',componentHref).href;

        openButton.addEventListener(
            'click',
            async function openSelectedFile() {
                const signal = presentationController.signal;
                await select(entry.path,{entry:entry});
                if (destroyed || signal.aborted) {
                    return;
                }
                const detail={path:entry.path,entry:entry,trigger:'click'};
                const operationId=nextOperationId('open');
                const openAllowed=emit('file-manager-open',detail,true,operationId);
                const actionAllowed=emitAction('open',entry,{trigger:'click'},true,operationId);

                if(!openAllowed||!actionAllowed||openMode==='event'){
                    return;
                }

                openFile(directory,fileName).catch(
                    error=>arcaneLogging.error('Unable to open file:',error)
                );
            },
            {signal:lifecycleController.signal}
        );
        deleteButton.addEventListener(
            'click',
            ()=>{
                if(!emitAction('delete',entry,{},true,nextOperationId('delete'))){
                    return;
                }

                confirmDelete(directory,fileName).catch(
                    error=>arcaneLogging.error('Unable to delete file:',error)
                );
            },
            {signal:lifecycleController.signal}
        );

        openButton.append(fileIcon,fileDetails);
        deleteButton.append(deleteIcon);
        file.append(openButton,deleteButton);

        return file;
    }

    async function confirmDelete(directory='',fileName='',closeFile=false){
        const signal = presentationController.signal;
        if (closingTask && !await closingTask) {
            return false;
        }
        if(destroyed||signal.aborted||!directory||!fileName){
            return false;
        }
        const generation=++deleteGeneration;

        const modal = await waitForModal(
            deleteModal,
            ['populate', 'open', 'close'],
            signal
        );
        if(!modal||destroyed||generation!==deleteGeneration){
            return false;
        }
        const content=document.createElement('section');
        const heading=document.createElement('h1');
        const message=document.createElement('p');
        const cancelButton=document.createElement('button');
        const deleteButton=document.createElement('button');

        heading.innerText='Delete File';
        message.innerText=`Delete ${fileName}? This cannot be undone.`;
        cancelButton.type='button';
        cancelButton.innerText='Cancel';
        deleteButton.type='button';
        deleteButton.innerText='Delete';

        cancelButton.addEventListener(
            'click',
            ()=>modal.close(undefined,true),
            {signal:lifecycleController.signal}
        );
        deleteButton.addEventListener(
            'click',
            async function deleteSelectedFile(){
                if (destroyed || signal.aborted || generation !== deleteGeneration) {
                    return;
                }
                cancelButton.disabled=true;
                deleteButton.disabled=true;

                try{
                    await dbopfs.delete(directory,fileName);
                    if(destroyed){
                        return;
                    }
                    if (generation !== deleteGeneration) {
                        await loadAll();
                        return;
                    }
