<link rel="stylesheet" href="./arcane/css/layout.css">
<style>
    :host{
        display:flex;
        justify-content:flex-end;
    }

    button{
        margin:0;
    }
</style>

<button id="openData" type="button" aria-haspopup="dialog"></button>
<html-import id="dataModal" class="modal" href="./arcane/components/modal.html"></html-import>

<script type="module">
    const {default:Is}=await import('strong-type');
    const is=new Is(false);

    const {arcaneLogging}=await import('arcane-os/logging');

    const host=this;
    const componentHref=new URL(host.getAttribute('href'),document.baseURI);
    const openButton=host.shadowRoot.querySelector('#openData');
    const dataModal=host.shadowRoot.querySelector('#dataModal');
    const {default:waitForComponent}=await import('../modules/WaitForComponent.js');
    const {createArcaneEventSource,projectArcaneDOMEvent}=await import('arcane-os/event-manager');
    const events=createArcaneEventSource(host,{source:'arcane.component.data-view',eventTypes:['data-view-ready']});
    const lifecycleController=new AbortController();

    let content=null;
    let fileManager=null;
    let operationGeneration=0;
    let openController = null;
    let closingTask = null;
    let destroyed=false;

    host.beforeOpen=is.function(host.beforeOpen)
        ?host.beforeOpen
        :async function beforeOpen(){};
    host.open=openData;
    host.close = closeData;
    host.printPreview=printPreview;
    host.destroy=destroy;

    openButton.innerText=host.dataset.button||'View Data';
    openButton.addEventListener(
        'click',
        ()=>openData().catch(
            error=>{
                if(!destroyed){
                    arcaneLogging.error('Unable to open data view:',error);
                }
            }
        ),
        {signal:lifecycleController.signal}
    );

    dataModal.addEventListener(
        'modal-closed',
        function closeDataFromModal(event) {
            if (event.target === dataModal && !closingTask) {
                closeData();
            }
        },
        {signal: lifecycleController.signal}
    );

    async function openData() {
        if (destroyed) {
            return false;
        }
        const requestedGeneration=operationGeneration;
        if (closingTask && !await closingTask) {
            return false;
        }
        if (destroyed||requestedGeneration!==operationGeneration) {
            return false;
        }
        const generation = ++operationGeneration;
        openController?.abort('data-view-open-replaced');
        const controller = new AbortController();
        openController = controller;

        try {
            await host.beforeOpen();
            if (destroyed || generation !== operationGeneration) {
                return false;
            }

            const reload = Boolean(content);
            const modal = await waitForComponent(
                dataModal,
                {
                    methods: ['populate', 'open'],
                    property: 'ready',
                    event: 'modal-ready',
                    signal: controller.signal
                }
            );
            if (destroyed || generation !== operationGeneration) {
                return false;
            }

            if (!content) {
                content = document.createElement('section');
                fileManager = document.createElement('html-import');

                const heading = document.createElement('h1');

                heading.innerText = host.dataset.title || 'Data';
                fileManager.className = 'file-manager';
                forwardPreviewOptions();
                fileManager.dataset.dirs = host.dataset.dirs || '';
                fileManager.dataset.layout = host.dataset.layout || 'files';
                fileManager.setAttribute(
                    'href',
                    new URL('./file-manager.html', componentHref).href
                );

                content.append(heading, fileManager);
                await modal.populate(content, false);
                if (destroyed || generation !== operationGeneration) {
                    return false;
                }
            }

            if (reload) {
                forwardPreviewOptions();
            }

            const manager = await waitForComponent(
                fileManager,
                {
                    methods: ['loadAll'],
                    property: 'ready',
                    event: 'file-manager-ready',
                    signal: controller.signal
                }
            );
            if (destroyed || generation !== operationGeneration) {
                return false;
            }

            if (reload) {
                await manager.loadAll();
                if (destroyed || generation !== operationGeneration) {
                    return false;
                }
            }

            return await modal.open();
        } catch (error) {
            if (controller.signal.aborted) {
                return false;
            }
            throw error;
        } finally {
            if (openController === controller) {
                openController = null;
            }
        }
    }

    async function closeData() {
        if (destroyed) {
            return false;
        }
        operationGeneration += 1;
        openController?.abort('data-view-closed');
        openController = null;
        if (closingTask) {
            return closingTask;
        }

        const childClosing = is.function(fileManager?.close)
            ? fileManager.close()
            : Promise.resolve(true);
        closingTask = Promise.resolve(childClosing)
            .then(closeDataAfterChildren)
            .catch(
                function reportDataCloseFailure(error) {
                    arcaneLogging.error('Unable to close data view:', error);
                    return false;
                }
            );
        try {
            return await closingTask;
        } finally {
            closingTask = null;
        }
    }

    async function closeDataAfterChildren(childrenClosed) {
        if (childrenClosed === false || destroyed) {
            return false;
        }
        if (is.function(dataModal.close)) {
            const closed = await dataModal.close();
            if (closed === false) {
                return false;
            }
        }
        return !destroyed && dataModal.opened !== true;
    }

    async function printPreview(){
        if(destroyed||dataModal.opened!==true||!is.function(fileManager?.printPreview)){
            return false;
        }
        return fileManager.printPreview();
    }

    function forwardPreviewOptions(){
        fileManager.previewTransform=host.previewTransform;
        fileManager.previewDescriptor=host.previewDescriptor;
        fileManager.directoryFilter=host.directoryFilter;
        if(host.dataset.hiddenPrefixes===undefined){
            delete fileManager.dataset.hiddenPrefixes;
        }else{
            fileManager.dataset.hiddenPrefixes=host.dataset.hiddenPrefixes;
        }
        fileManager.toggleAttribute('data-show-hidden',host.hasAttribute('data-show-hidden'));
    }

    function destroy(){
        if(destroyed){
            return false;
        }
        destroyed=true;
        operationGeneration+=1;
        openController?.abort('data-view-destroyed');
        openController = null;
        lifecycleController.abort('data-view-destroyed');
        fileManager?.destroy?.();
        dataModal.destroy?.();
        events.dispose();
        host.ready=false;
        return true;
    }

    host.ready=true;
    const readyPublication=events.dispatch('data-view-ready',{}, {publicDetail:{ready:true}});
    projectArcaneDOMEvent(host,readyPublication.occurrence);
</script>
