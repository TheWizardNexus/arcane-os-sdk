<link rel="stylesheet" href="./arcane/css/layout.css?v=3" />
<style>
    :host {
        display: block;
        height: 100%;
        min-width: 0;
        min-inline-size:0;
        max-inline-size:100%;
        min-height: 0;
        --arcane-chat-gap: var(--arcane-space-3, .75rem);
        --arcane-chat-radius: var(--arcane-radius-large, 1rem);
    }

    .chat_area {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-sizing: border-box;
        width: min(100%, 72rem);
        min-width:0;
        min-inline-size:0;
        max-inline-size:100%;
        height: 100%;
        min-height: 0;
        margin-inline: auto;
        padding: clamp(.65rem, 1.5vw, 1.25rem);
        gap: var(--arcane-chat-gap);
        overflow: visible;
    }

    .chat_area .thinking{
        opacity:.36;
        overflow-wrap:anywhere;
        white-space:pre-wrap;
    }

    .chat_area .thinking.message_progress{
        display:grid;
        gap:.38em;
        width:min(34em,100%);
        opacity:1;
    }

    .message_progress_label{
        display:flex;
        justify-content:space-between;
        gap:1em;
        font-size:.9em;
        font-variant-numeric:tabular-nums;
    }

    .message_progress_track{
        display:block;
        height:.58em;
        overflow:hidden;
        border:1px solid var(--border-color);
        border-radius:999px;
        background:var(--background);
    }

    .message_progress_fill{
        display:block;
        width:0;
        height:100%;
        border-radius:inherit;
        background:var(--primary-color);
        transition:width 240ms ease;
    }

    .message_progress_content.indeterminate .message_progress_fill{
        width:32%;
        animation:message-progress-indeterminate 1.2s ease-in-out infinite;
    }

    @keyframes message-progress-indeterminate{
        from{transform:translateX(-120%);}
        to{transform:translateX(320%);}
    }

    @media (prefers-reduced-motion:reduce){
        .message_progress_fill{
            transition:none;
        }

        .message_progress_content.indeterminate .message_progress_fill{
            animation:none;
            transform:none;
        }
    }

    .conversation_timebox{
        display:block;
        flex:0 0 auto;
        align-self:flex-end;
        margin-block-end:.12em;
        margin-inline-end:1em;
        color:var(--text-color);
        font-size:.68em;
        line-height:1;
        pointer-events:none;
    }

    .conversation_timebox[hidden]{
        display:none;
    }

    .chat_area[data-conversation-complete="true"] .conversation_timebox,
    .chat_area[data-conversation-complete="true"] .ai_activation,
    .chat_area[data-conversation-complete="true"] .chat_input_area,
    .chat_area[data-conversation-complete="true"] > #speech,
    .chat_area[data-conversation-complete="true"] > .controls{
        display:none;
    }

    .conversation_timebox[data-error="true"]{
        color:var(--danger-color,var(--text-color));
    }

    .conversation_timebox output{
        font-variant-numeric:tabular-nums;
        font-weight:600;
        white-space:nowrap;
    }

    .conversation_timebox_status{
        position:absolute;
        width:1px;
        height:1px;
        padding:0;
        margin:-1px;
        overflow:hidden;
        clip:rect(0,0,0,0);
        white-space:nowrap;
        border:0;
    }

    .chat_session_status{
        display:block;
        flex:0 0 auto;
        min-height:1.25em;
        padding-inline:.25rem;
        color:var(--text-color);
        font-size:.82rem;
        overflow-wrap:anywhere;
    }

    .chat_session_status[data-state="error"]{
        color:var(--danger-color,var(--text-color));
    }

    .chat_output {
        flex:1 1 auto;
        display:flow-root;
        box-sizing: border-box;
        width: 100%;
        min-height:0;
        min-inline-size:0;
        max-inline-size:100%;
        margin: 0;
        padding: clamp(1rem, 2vw, 1.5rem);
        list-style: none;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-chat-radius);
        background: var(--arcane-surface-raised, var(--modal-background));
        box-shadow: var(--arcane-shadow-medium, 0 .65rem 1.8rem var(--shadow-color));
    }

    .chat_output > li {
        box-sizing: border-box;
        width: auto;
        min-width: 0;
        min-inline-size:0;
        max-inline-size:min(92%,48rem);
        max-width: min(92%, 48rem);
        margin: 0 0 .85rem;
        padding: .85rem 1rem;
        clear: both;
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: calc(var(--arcane-chat-radius) - .1rem);
        overflow-x: hidden;
        overflow-wrap: anywhere;
    }

    .chat_output > li.ai {
        width: auto;
        float: left;
        background: var(--arcane-surface, var(--background));
        border-start-start-radius: var(--arcane-radius-small, .3rem);
    }

    .chat_output > li.user {
        float: right;
        background: var(--arcane-action, var(--primary-color));
        color: var(--arcane-action-text, var(--button-text-color, var(--text-color)));
        border-color: var(--arcane-action, var(--primary-color));
        border-start-end-radius: var(--arcane-radius-small, .3rem);
        text-align: right;
    }

    .message_header{
        display:block;
        margin:0 0 .65rem;
    }

    .message_timestamp{
        display:block;
        margin-top:.65rem;
        color:currentColor;
        font-size:.72rem;
        line-height:1.2;
        opacity:.7;
        text-align:right;
    }

    .message_tool_calls{
        display:grid;
        box-sizing:border-box;
        width:100%;
        min-width:0;
        min-inline-size:0;
        max-inline-size:100%;
        max-width:100%;
        gap:.55rem;
        margin-top:.75rem;
    }

    .message_tool_call{
        box-sizing:border-box;
        width:100%;
        min-width:0;
        min-inline-size:0;
        max-inline-size:100%;
        max-width:100%;
        padding:.65rem;
        border:1px solid currentColor;
        border-radius:var(--arcane-radius-small,.3rem);
        overflow-x:hidden;
        overflow-wrap:anywhere;
    }

    .message_tool_message{
        margin:.45rem 0 0;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
    }

    .message_tool_details{
        box-sizing:border-box;
        width:100%;
        min-width:0;
        min-inline-size:0;
        max-inline-size:100%;
        max-width:100%;
        margin-top:.55rem;
        overflow-x:hidden;
    }

    .message_tool_details summary{
        cursor:pointer;
        overflow-wrap:anywhere;
    }

    .message_tool_call pre{
        box-sizing:border-box;
        width:100%;
        min-width:0;
        min-inline-size:0;
        max-inline-size:100%;
        max-width:100%;
        margin:.45rem 0 0;
        white-space:pre-wrap;
        word-break:break-word;
        overflow-x:auto;
        overflow-wrap:anywhere;
    }

    .message_tool_call code{
        display:block;
        box-sizing:border-box;
        min-inline-size:0;
        max-inline-size:100%;
        white-space:inherit;
        word-break:inherit;
        overflow-wrap:anywhere;
    }

    .chat_output li ul,
    .chat_output li ol {
        display: block;
        min-height: auto;
        margin: .55rem 0 .55rem 1.35rem;
        padding: 0;
        overflow: visible;
        list-style: revert;
    }

    .chat_output li li {
        float: none;
        width: auto;
        max-width: none;
        margin: .28rem 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        text-align: start;
    }

    .chat_input_area {
        display: grid;
        box-sizing: border-box;
        width: 100%;
        padding: var(--arcane-space-3, .7rem);
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: var(--arcane-space-2, .6rem);
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-chat-radius);
        background: var(--arcane-surface-raised, var(--modal-background));
        box-shadow: var(--arcane-shadow-small, 0 .35rem 1rem var(--shadow-color));
    }

    .ai_activation {
        display:flex;
        flex:0 0 auto;
        box-sizing:border-box;
        width:100%;
        padding:var(--arcane-space-3, .75rem);
        align-items:center;
        justify-content:space-between;
        gap:var(--arcane-space-3, .75rem);
        border:1px solid var(--arcane-border, var(--border-color));
        border-radius:var(--arcane-chat-radius);
        background:var(--arcane-surface-raised, var(--modal-background));
        color:var(--text-color);
    }

    .ai_activation[hidden] {
        display:none;
    }

    .ai_activation_copy {
        flex:1 1 auto;
        min-width:0;
    }

    .ai_activation_copy strong,
    .ai_activation_copy span {
        display:block;
        overflow-wrap:anywhere;
    }

    .ai_activation_copy span {
        margin-block-start:.22rem;
        font-size:.9rem;
    }

    .ai_activation_progress{
        display:block;
        width:100%;
        height:.6rem;
        margin-block-start:.7rem;
        accent-color:var(--arcane-action,var(--primary-color));
    }

    .ai_activation_progress[hidden]{
        display:none;
    }

    .ai_activation button {
        flex:0 0 auto;
        min-height:2.65rem;
        padding:.55rem .8rem;
        border:1px solid var(--arcane-action, var(--primary-color));
        border-radius:var(--arcane-radius-medium, .7rem);
        background:var(--arcane-action, var(--primary-color));
        color:var(--arcane-action-text, var(--button-text-color, var(--text-color)));
        font:inherit;
        font-weight:600;
        cursor:pointer;
    }

    .ai_activation button:focus-visible {
        outline:.2rem solid var(--arcane-focus, var(--focus-color));
        outline-offset:.18rem;
    }

    .ai_activation button:disabled {
        cursor:not-allowed;
        opacity:.65;
    }

    .chat_input {
        box-sizing: border-box;
        width: 100%;
        min-height: 3rem;
        margin: 0;
        padding: .82rem .9rem;
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-radius-medium, .7rem);
        background: var(--arcane-surface, var(--background));
        color: var(--text-color);
        font: inherit;
        font-size: 1rem;
        line-height: 1.35;
        resize: vertical;
        overflow: visible;
    }

    .chat_input:focus-visible {
        outline: .18em solid var(--arcane-focus, var(--focus-color));
        outline-offset: .12em;
        border-color: var(--arcane-focus, var(--focus-color));
    }

    .chat_submit,
    button.chat_upload {
        display:grid;
        place-items:center;
        width:3rem;
        height:3rem;
        padding:0;
        margin:0;
        background-color:var(--arcane-action, var(--primary-color));
        border:.2em solid var(--arcane-action, var(--primary-color));
        border-radius:var(--arcane-radius-medium, .7rem);
        cursor: pointer;
        outline: none;
        box-shadow:var(--arcane-shadow-small, 0 .18em .45em var(--shadow-color));
        align-self:center;
        transition:background-color 180ms,border-color 180ms,box-shadow 180ms,transform 120ms;
        color:var(--arcane-action-text, var(--button-text-color,var(--text-color)));
    }

    .chat_submit::before,
    button.chat_upload::before {
        content:'';
        width:1.65em;
        height:1.65em;
        background-color:currentColor;
        mask-position:center;
        mask-repeat:no-repeat;
        mask-size:contain;
        -webkit-mask-position:center;
        -webkit-mask-repeat:no-repeat;
        -webkit-mask-size:contain;
    }

    .chat_submit::before {
        mask-image:url('./arcane/img/send.svg');
        -webkit-mask-image:url('./arcane/img/send.svg');
    }

    button.chat_upload::before {
        mask-image:url('./arcane/img/upload.svg');
        -webkit-mask-image:url('./arcane/img/upload.svg');
    }

    .chat_submit img,
    button.chat_upload img {
        display:none;
    }

    .chat_submit:hover,
    button.chat_upload:hover {
        background-color:var(--arcane-secondary, var(--secondary-color));
        border-color:var(--arcane-secondary, var(--secondary-color));
        color:var(--arcane-secondary-text, var(--text-color));
        box-shadow:0 .25em .6em var(--shadow-color);
    }

    .chat_submit:focus-visible,
    button.chat_upload:focus-visible {
        outline: .2rem solid var(--arcane-focus, var(--focus-color));
        outline-offset: .18rem;
    }

    #speech {
        display: grid;
        flex: 0 0 auto;
        min-width: 0;
    }

    .controls {
        display: flex;
        justify-content: flex-end;
    }

    .controls select {
        width: min(100%, 18rem);
        min-height: 2.65rem;
        padding: .55rem .75rem;
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-radius-medium, .7rem);
        background: var(--arcane-surface-raised, var(--modal-background));
        color: var(--text-color);
        font: inherit;
    }

    .controls select:focus-visible {
        outline: .2rem solid var(--arcane-focus, var(--focus-color));
        outline-offset: .18rem;
    }

    :host([presentation="basic"]) .chat_input_area {
        grid-template-columns:minmax(0,1fr) auto;
    }

    :host([presentation="basic"]) #chat_upload,
    :host([presentation="basic"]) #file_upload_input,
    :host([presentation="basic"]) .controls {
        display:none;
    }

    @media (max-width: 44rem) {
        .chat_area {
            padding: var(--arcane-space-2, .5rem);
        }

        .chat_output > li {
            max-width: 96%;
        }

        .controls select {
            width: 100%;
        }
    }


    :host(.journal){
           .chat_output {
               display:none;
           }
    }

    table {
        width:calc(100% - .5em);
        margin: auto; /* Center the table horizontally */
        border-collapse: collapse;
        overflow-x: auto; /* Enables horizontal scrolling */
        display:table;
        background: var(--modal-background);
        box-shadow: 0 0 0.7em var(--border-color);
        border-radius: 0.5em 0.5em 0.5em 0.5em;
        border-spacing: unset;
    }

    thead, tbody {
        display: table; /* These elements behave like table rows */
        width: 100%; /* Table rows take full available space */
        table-layout: fixed; /* Ensures the table layout respects the width settings */
    }

    tbody tr{
        height: 130px;
    }

    thead tr{
        background: var(--background);
        color: var(--platinum);
        border-radius: .5em .5em 0 0;
    }

    tr{
        display: grid;
        grid-template-columns: 
                6em 1fr 1fr 1fr;
    }

    tr:hover{
        background:var(--secondary-color);
    }

    th, td {
        text-align: left;
        word-wrap: break-word;
    }

    th{
        border:none;
        padding:.4em;
    }

    td{
        background: var(--border-color);
        padding:.4em;
        border: 1px solid var(--accent-color);
        overflow: visible;
    }
</style>

<section class="chat_area">
    <section
        id="conversation_timebox"
        class="conversation_timebox"
        aria-label="Conversation timer"
        hidden
    >
        <output
            id="conversation_timebox_elapsed"
            role="timer"
            aria-live="off"
            aria-label="Conversation elapsed time"
        >00:00</output>
        <span
            id="conversation_timebox_status"
            class="conversation_timebox_status"
            role="status"
            aria-live="polite"
        >Starting the elapsed timer.</span>
    </section>
    <ul type='text' class='chat_output' id='chat_output' tabindex='-1' aria-label='Conversation transcript'></ul>
    <output
        id="chat_session_status"
        class="chat_session_status"
        role="status"
        aria-live="polite"
        data-state="idle"
    >Chat session is not connected.</output>
    <section
        id="ai_activation"
        class="ai_activation"
        role="status"
        aria-live="polite"
        aria-busy="false"
        hidden
    >
        <span class="ai_activation_copy">
            <strong id="ai_activation_title">Language model not active</strong>
            <span id="ai_activation_status">Start the selected language model to enable chat.</span>
            <progress
                id="ai_activation_progress"
                class="ai_activation_progress"
                aria-label="Language model activation progress"
                hidden
            ></progress>
        </span>
        <button type="button" id="ai_activation_button">Start language model</button>
    </section>
    <div class="chat_input_area">
        <textarea type='text' class='chat_input' id='chat_input' placeholder='Message' aria-label='Message'></textarea>
        <button type="button" id="chat_upload" class="chat_upload" title="Upload files" aria-label="Upload files">
            <img class='upload-icon' src="./arcane/img/upload.svg" />
        </button>
        <input type="file" id="file_upload_input" class="chat_upload" accept=".txt, .md, image/*" hidden multiple />
        <button type="button" id="chat_submit" class="chat_submit" title="Send message" aria-label="Send message">
            <img class='send-icon' src="./arcane/img/send.svg" />
        </button>
    </div>
    <span id="speech_mount"></span>
    <section class="controls">

<script type="module"> 
    const {
        createArcaneEventSource,
        projectArcaneDOMEvent
    }=await import('arcane-os/event-manager');

    const host=this;
    const componentURL=new URL(
        host.getAttribute('href')||'./arcane/components/chat.html',
        document.baseURI
    );
    const speechMount=host.shadowRoot.querySelector('#speech_mount');
    const speechImport=document.createElement('html-import');
    speechImport.id='speech';
    speechImport.setAttribute(
        'href',

    const events=createArcaneEventSource(
        host,
        {
            source:'arcane.component.chat',
            eventTypes:[
                'chat-ready',

                'chat-session-message',

                'chat-language-change-error',
                'chat-ai-activation-request',
                'chat-ai-activation-error',
                'chat-speech-synthesis-error',
                'conversation-timebox-error'
            ]
        }
    );
    const shadowRoot=host.shadowRoot;

    const textArea=shadowRoot.querySelector('#chat_input');
    const chatOutput = shadowRoot.querySelector('#chat_output');
    const send = shadowRoot.querySelector('#chat_submit');
    const chatSessionStatus=shadowRoot.querySelector('#chat_session_status');
    const speech = speechImport;
    const uploadBtn = shadowRoot.querySelector('#chat_upload');
    const fileInput = shadowRoot.querySelector('#file_upload_input');
    const conversationTimeboxPanel=shadowRoot.querySelector('#conversation_timebox');
    const conversationTimeboxElapsed=shadowRoot.querySelector('#conversation_timebox_elapsed');
    const conversationTimeboxStatus=shadowRoot.querySelector('#conversation_timebox_status');
    const aiActivationPanel=shadowRoot.querySelector('#ai_activation');
    const aiActivationTitle=shadowRoot.querySelector('#ai_activation_title');
    const aiActivationStatus=shadowRoot.querySelector('#ai_activation_status');
    const aiActivationProgress=shadowRoot.querySelector('#ai_activation_progress');
    const aiActivationButton=shadowRoot.querySelector('#ai_activation_button');
    const [
        {default:MD},
        {default:FileEntity},
        {ConversationSubmissionBarrier,requireConversationTimeboxDelivery},
        {requestAIRuntimeIntent,subscribeAIRuntimeState},
        {createPersistentAIChatSession}
    ]=await Promise.all([

        import('../modules/ConversationTimebox.js'),

        import('../modules/PersistentAIChatSession.js')

    host.language=host.language||'English';
    host.name = host.name||'User';
    host.aiName='AI';
    let requestedInitialSpeechMuted=typeof speech.initialMuted==='boolean'
        ?speech.initialMuted
        :true;
    let initialSpeechMuteListenerInstalled=false;
    let latestAIRuntimeRoles=null;
    const hostSubmissionBarrier=new ConversationSubmissionBarrier();
    const aiRuntimeStateAbortController=new AbortController();
    const AI_TTS_FAILURE_EVENT='ai-tts-failure';
    let programmaticSubmissionQueue=Promise.resolve(true);
    let conversationTimeboxController=null;
    let conversationTimeboxUnsubscribe=null;
    let conversationTimeboxError='';
    let lastQueuedTimeboxRevision=null;
    let hostSubmissionGeneration=0;
    let eventOperationSequence=0;
    let destroyed=false;
    let boundChatSession=null;
    let boundChatAI=null;
    let sessionBindingPending=false;
    let sessionMessagePending=false;
    let activeSessionMessageToken=null;
    let sessionBindingGeneration=0;

    let pendingStructuralToolCall=null;

    const activeSubmissionOwnerships=new Set();
    const conversationTimeboxRetryDelays=[0,500,1_500];
    const chatReasons={
        ready:'chat-ready',
        sessionBindingCompleted:'session-binding-completed',
        sessionBindingRejected:'session-binding-rejected',
        sessionMessageCompleted:'session-message-completed',
        sessionMessageRejected:'session-message-rejected',

        languageModelActivationRequested:'language-model-activation-requested',

        speechSynthesisRejected:'speech-synthesis-rejected',
        conversationTimeboxDeliveryRejected:'conversation-timebox-delivery-rejected'
    };
    const chatErrorCodes={
        destroyed:'ARCANE_CHAT_DESTROYED',
        sessionAlreadyBound:'ARCANE_CHAT_SESSION_ALREADY_BOUND',
        sessionBindingRejected:'ARCANE_CHAT_SESSION_BINDING_REJECTED',
        sessionMessageRejected:'ARCANE_CHAT_SESSION_MESSAGE_REJECTED',
        messageSubmissionAborted:'ARCANE_CHAT_MESSAGE_SUBMISSION_ABORTED',
        languageModelActivationRejected:'ARCANE_CHAT_LANGUAGE_MODEL_ACTIVATION_REQUEST_REJECTED',
        hostMessageSubmissionRejected:'ARCANE_CHAT_HOST_MESSAGE_SUBMISSION_REJECTED',
        fileStorageRejected:'ARCANE_CHAT_FILE_STORAGE_REJECTED',
        languageChangeCallbackRejected:'ARCANE_CHAT_LANGUAGE_CHANGE_CALLBACK_REJECTED',
        speechSynthesisRejected:'ARCANE_CHAT_SPEECH_SYNTHESIS_REQUEST_REJECTED',
        conversationTimeboxDeliveryRejected:'ARCANE_CHAT_CONVERSATION_TIMEBOX_DELIVERY_REJECTED'
    };

    function nextChatOperationId(kind){
        eventOperationSequence+=1;
        return `${events.descriptor.instanceId}:${kind}:${eventOperationSequence}`;
    }

    function dispatchChatEvent(
        type,
        compatibilityDetail={},
        {
            publicDetail={},
            operationId=null,
            bubbles=false,
            composed=false,
            cancelable=false
        }={}
    ){
        if(destroyed){
            return false;
        }
        const publication=events.dispatch(
            type,
            compatibilityDetail,
            {
                publicDetail,
                operationId,
                cancelable
            }
        );
        if(!publication.accepted){
            return false;
        }
        return projectArcaneDOMEvent(
            host,
            publication.occurrence,
            {
                bubbles,
                composed,
                cancelable
            }
        );
    }

    function publicErrorFields(error,boundaryCode){
        let causeCode='';
        let message='';
        try{
            causeCode=typeof error?.code==='string'?error.code:'';
            message=typeof error?.message==='string'?error.message:'';
        }catch{}
        return {
            error,
            code:boundaryCode,
            ...(causeCode&&causeCode!==boundaryCode?{causeCode}:{}),
            ...(message?{message}:{})
        };
    }

    function chatError(message,code){
        const error=new Error(message);
        error.code=code;
        return error;
    }

    function isPlainRecord(value){
        return Boolean(value)
            &&typeof value==='object'
            &&!Array.isArray(value)
            &&Object.getPrototypeOf(value)===Object.prototype;
    }

    function visibleErrorMessage(error,fallback){
        try{
            // Only errors deliberately classified by their owner may provide UI copy.
            // Provider and protocol diagnostics remain complete in console/events.
            if(error?.userSafe===true){
                const message=typeof error.userMessage==='string'
                    ?error.userMessage
                    :error.message;
                if(typeof message==='string'&&message.trim()){
                    return message;
                }
            }
        }catch{}
        return fallback;
    }

    function visibleProgressText(value,fallback,field){
        if(typeof value==='string'){
            return value||fallback;
        }
        if(value&&typeof value==='object'){
            console.error(`Arcane chat progress ${field} is not text.`,value);
            return visibleErrorMessage(value,fallback);
        }
        if(value!==undefined&&value!==null&&value!==''){
            const error=new TypeError(
                `Arcane chat progress ${field} must be text.`,
                {cause:value}
            );
            console.error(`Arcane chat progress ${field} is not text.`,error);
        }
        return fallback;
    }

    function setSessionStatus(state,message){
        const status={state:String(state),message:String(message)};
        host.sessionStatus=status;
        chatSessionStatus.dataset.state=status.state;
        chatSessionStatus.value=status.message;
        chatSessionStatus.textContent=status.message;
        return status;
    }

    function compatibleChatSession(session){
        return Boolean(session)
            &&typeof session==='object'
            &&typeof session.ready==='function'
            &&typeof session.history==='function'
            &&typeof session.send==='function';
    }

    function scrollTranscriptToBottom(){
        chatOutput.scrollTop=chatOutput.scrollHeight;
        return true;
    }

    function transcriptTime(timestamp){
        const time=chatOutput.ownerDocument.createElement('time');
        time.className='message_timestamp';
        const value=timestamp instanceof Date
            ?timestamp
            :new Date(timestamp);
        if(timestamp!==undefined&&timestamp!==null&&Number.isFinite(value.getTime())){
            time.dateTime=value.toISOString();
            time.textContent=value.toLocaleTimeString([],{
                hour:'2-digit',
                minute:'2-digit',
                hourCycle:'h23'
            });
            time.title=value.toLocaleString();
        }else{
            time.textContent='Time unavailable';
            time.setAttribute('aria-label','Message time unavailable');
        }
        return time;
    }

    function normalizeVisibleToolCalls(value){
        if(value===undefined) return [];
        if(!Array.isArray(value)){
            const failure=new TypeError('Chat session tool calls must be an array.');
            failure.code='AI_CHAT_INVALID_TOOL_CALL';
            throw failure;
        }
        return value.map((call,index)=>{
            if(
                !call
                ||typeof call!=='object'
                ||Array.isArray(call)
                ||call.type!=='function'
                ||!call.function
                ||typeof call.function!=='object'
                ||Array.isArray(call.function)
                ||typeof call.id!=='string'
                ||!call.id.trim()
                ||typeof call.function.name!=='string'
                ||!call.function.name.trim()
                ||typeof call.function.arguments!=='string'
            ){
                const failure=new TypeError(`Chat session tool call ${index+1} is invalid.`);
                failure.code='AI_CHAT_INVALID_TOOL_CALL';
                throw failure;
            }
            structuralToolMessage(call);
            return call;
        });
    }

    function structuralToolMessage(call){
        let argumentsRecord;
        try{
            argumentsRecord=JSON.parse(call.function.arguments);
        }catch(error){
            const failure=new TypeError(
                'Structural tool call arguments must encode a JSON object.',
                {cause:error}
            );
            failure.code='AI_CHAT_INVALID_TOOL_CALL';
            throw failure;
        }
        if(!isPlainRecord(argumentsRecord)){
            const failure=new TypeError(
                'Structural tool call arguments must encode a JSON object.'
            );
            failure.code='AI_CHAT_INVALID_TOOL_CALL';
            throw failure;
        }
        if(typeof argumentsRecord.message!=='string'||!argumentsRecord.message.trim()){
            const failure=new TypeError(
                'Structural tool call arguments must include a nonempty user-facing message.'
            );
            failure.code='AI_CHAT_TOOL_MESSAGE_REQUIRED';
            throw failure;
        }
        return argumentsRecord.message;
    }

    function setPendingStructuralToolCall(call=null){
        if(call===null){
            pendingStructuralToolCall=null;
            pendingStructuralToolMessage='';
            return null;
        }
        pendingStructuralToolMessage=structuralToolMessage(call);
        pendingStructuralToolCall={
            id:call.id,
            type:'function',
            function:{
                name:call.function.name,
                arguments:call.function.arguments
            }
        };
        return pendingStructuralToolCall;
    }

    function sameStructuralToolCall(left,right){
        return Boolean(left&&right)
            &&left.id===right.id
            &&left.type===right.type
            &&left.function?.name===right.function?.name
            &&left.function?.arguments===right.function?.arguments;
    }

    function pendingStructuralToolSummary(){
        return pendingStructuralToolCall
            ?{
                id:pendingStructuralToolCall.id,
                name:pendingStructuralToolCall.function.name,
                message:pendingStructuralToolMessage
            }
            :null;
    }

    function appendVisibleToolCall(item,call){
        const toolCalls=item.querySelector('.message_tool_calls')
            ??item.ownerDocument.createElement('section');
        if(!toolCalls.classList.contains('message_tool_calls')){
            toolCalls.className='message_tool_calls';
            toolCalls.setAttribute('aria-label','Tool calls');
            item.insertBefore(toolCalls,item.querySelector('.message_timestamp'));
        }
        const existing=[...toolCalls.children].find(
            candidate=>candidate.dataset.toolCallId===call.id
        );
        if(existing) return existing;
        const entry=item.ownerDocument.createElement('article');
        entry.className='message_tool_call';
        entry.dataset.toolCallId=call.id;
        const heading=item.ownerDocument.createElement('strong');
        heading.textContent=`Tool: ${call.function.name}`;
        const userMessage=item.ownerDocument.createElement('p');
        userMessage.className='message_tool_message';
        userMessage.textContent=structuralToolMessage(call);
        const details=item.ownerDocument.createElement('details');
        details.className='message_tool_details';
        const summary=item.ownerDocument.createElement('summary');
        summary.textContent='Tool call details';
        const argumentsBlock=item.ownerDocument.createElement('pre');
        const code=item.ownerDocument.createElement('code');
        code.textContent=call.function.arguments;
        argumentsBlock.append(code);
        details.append(summary,argumentsBlock);
        entry.append(heading,userMessage,details);
        toolCalls.append(entry);
        scrollTranscriptToBottom();
        return entry;
    }

    function setTranscriptMessageContent(item,content,timestamp){
        if(typeof content!=='string'){
            throw new TypeError('Chat session message content must be a string.');
        }
        item.querySelector('.thinking')?.remove();
        const markdown=item.querySelector('.markdown');
        markdown.raw=content;
        markdown.innerHTML=new MD(content).rendered;
        if(timestamp!==undefined){
            item.querySelector('.message_timestamp')?.replaceWith(
                transcriptTime(timestamp)
            );
        }
        scrollTranscriptToBottom();
        return item;
    }

    function setTranscriptMessageTimestamp(item,timestamp){
        const current=item?.querySelector?.('.message_timestamp');
        if(!current||timestamp===undefined||timestamp===null){
            return false;
        }
        current.replaceWith(transcriptTime(timestamp));
        scrollTranscriptToBottom();
        return true;
    }

    function latestCommittedTranscriptTurn(transcript,requestMessage){
        if(!Array.isArray(transcript)) return null;
        const requestRole=requestMessage?.role??'user';
        const requestContent=requestMessage?.content;
        for(let index=transcript.length-1;index>0;index--){
            const response=transcript[index];
            const request=transcript[index-1];
            if(
                response?.role==='assistant'
                &&request?.role===requestRole
                &&request.content===requestContent
                &&(
                    requestRole!=='tool'
                    ||request.tool_call_id===requestMessage.tool_call_id
                )
            ){
                return {request,response};
            }
        }
        return null;
    }

    function createTranscriptMessage(role,content,name,{timestamp,toolCalls}={}){
        if(typeof content!=='string'){
            throw new TypeError('Chat session message content must be a string.');
        }
        const item=chatOutput.ownerDocument.createElement('li');
        item.className=role==='user'?'user':'ai';
        item.dataset.role=role;
        const header=chatOutput.ownerDocument.createElement('header');
        header.className='message_header';
        const heading=chatOutput.ownerDocument.createElement('strong');
        heading.textContent=name;
        header.append(heading);
        const markdown=chatOutput.ownerDocument.createElement('div');
        markdown.className='markdown';
        markdown.raw=content;
        markdown.innerHTML=new MD(content).rendered;
        item.append(header,markdown,transcriptTime(timestamp));
        for(const call of normalizeVisibleToolCalls(toolCalls)){
            appendVisibleToolCall(item,call);
        }
        return item;
    }

    function appendTranscriptMessage(role,content,name,{timestamp=Date.now(),toolCalls}={}){
        const item=createTranscriptMessage(role,content,name,{timestamp,toolCalls});
        chatOutput.append(item);
        scrollTranscriptToBottom();
        return item;
    }

    function renderSessionHistory(history){
        if(!Array.isArray(history)){
            throw new TypeError('Chat session history must be an array.');
        }
        const fragment=chatOutput.ownerDocument.createDocumentFragment();
        const rendered=[];
        let restoredPendingToolCall=null;
        for(const message of history){
            if(!message||typeof message!=='object'||Array.isArray(message)){
                throw new TypeError('Chat session history contains an invalid message.');
            }
            if(message.role==='system'){
                if(restoredPendingToolCall){
                    throw chatError(
                        'Saved chat contains a system record before its pending structural tool result.',
                        'AI_CHAT_INCOHERENT_PERSISTENCE'
                    );
                }
                continue;
            }
            if(!['assistant','tool','user'].includes(message.role)){
                throw new TypeError(`Chat session history contains an unsupported role: ${message.role}.`);
            }
            if(typeof message.content!=='string'){
                throw new TypeError('Chat session history message content must be a string.');
            }
            if(message.role==='tool'&&!message.content.trim()){
                throw chatError(
                    'Saved chat contains a blank structural tool result.',
                    'AI_CHAT_INVALID_TOOL_MESSAGE'
                );
            }
            const calls=normalizeVisibleToolCalls(message.tool_calls);
            if(calls.length>1){
                throw chatError(
                    'Saved chat contains parallel structural tool calls.',
                    'AI_CHAT_PARALLEL_TOOLS_UNSUPPORTED'
                );
            }
            if(message.role!=='assistant'&&calls.length){
                throw chatError(
                    'Only assistant records may contain structural tool calls.',
                    'AI_CHAT_INVALID_TOOL_CALL'
                );
            }
            if(message.role==='tool'){
                if(
                    !restoredPendingToolCall
                    ||typeof message.tool_call_id!=='string'
                    ||message.tool_call_id!==restoredPendingToolCall.id
                ){
                    throw chatError(
                        'Saved chat contains a tool result that does not match its pending structural tool call.',
                        'AI_CHAT_INVALID_TOOL_MESSAGE'
                    );
                }
                restoredPendingToolCall=null;
            }else{
                if(restoredPendingToolCall){
                    throw chatError(
                        'Saved chat continues before its pending structural tool result.',
                        'AI_CHAT_TOOL_RESULT_REQUIRED'
                    );
                }
                if(calls.length){
                    restoredPendingToolCall=calls[0];
                }
            }
            const name=message.role==='user'
                ?host.name
                :message.role==='tool'
                ?'Tool'
                :host.aiName;
            const item=createTranscriptMessage(message.role,message.content,name,{
                timestamp:message.timestamp,
                toolCalls:calls,
            });
            fragment.append(item);
            rendered.push(item);
        }
        setPendingStructuralToolCall(restoredPendingToolCall);
        chatOutput.replaceChildren(fragment);
        scrollTranscriptToBottom();
        return rendered;
    }

    async function bindSession(options={}){
        if(destroyed){
            throw chatError(
                'The chat component has been destroyed and cannot bind a session.',
                chatErrorCodes.destroyed
            );
        }
        if(!isPlainRecord(options)){
            throw new TypeError('Chat session binding options must be a plain object.');
        }
        const unsupported=Object.keys(options).find(
            key=>!['ai','session','sessionOptions'].includes(key)
        );
        if(unsupported){
            throw new TypeError(`Unsupported chat session binding option: ${unsupported}.`);
        }
        if(sessionBindingPending||boundChatSession){
            throw chatError(
                'This chat component already has a session binding.',
                chatErrorCodes.sessionAlreadyBound
            );
        }
        const ai=options.ai??null;
        const suppliedSession=options.session??null;
        const sessionOptions=options.sessionOptions??{};
        if((ai===null)===(suppliedSession===null)){
            throw new TypeError('Specify exactly one of ai or session when binding chat.');
        }
        if(!isPlainRecord(sessionOptions)){
            throw new TypeError('sessionOptions must be a plain object.');
        }
        if(suppliedSession!==null&&Object.keys(sessionOptions).length>0){
            throw new TypeError('sessionOptions cannot be used with an existing session.');
        }
        if(suppliedSession!==null&&!compatibleChatSession(suppliedSession)){
            throw new TypeError('session must expose ready(), history(), and send().');
        }

        const operationId=nextChatOperationId('session-binding');
        const generation=++sessionBindingGeneration;
        sessionBindingPending=true;
        setSessionStatus('binding','Opening chat session…');
        try{
            const session=suppliedSession??await createPersistentAIChatSession({
                ...sessionOptions,
                ai
            });
            await session.ready();
            const history=typeof session.transcript==='function'
                ?await session.transcript()
                :await session.history();
            if(destroyed||generation!==sessionBindingGeneration){
                throw chatError(
                    'The chat component was destroyed before session binding completed.',
                    chatErrorCodes.destroyed
                );
            }
            renderSessionHistory(history);
            boundChatSession=session;
            boundChatAI=ai??session.ai??null;
            host.session=session;
            setSessionStatus(
                pendingStructuralToolMessage?'tool':'ready',
                pendingStructuralToolMessage||'Chat ready.'
            );
            applyAIAvailability(host.aiAvailability);
            sessionBindingPending=false;
            const detail={
                chat:host,
                session,
                ai:boundChatAI,
                history,
                pendingTool:pendingStructuralToolSummary()
            };
            dispatchChatEvent(
                'chat-session-bound',
                detail,
                {
                    bubbles:true,
                    composed:true,
                    operationId,
                    publicDetail:{
                        ...detail,
                        reason:chatReasons.sessionBindingCompleted
                    }
                }
            );
            return session;
        }catch(error){
            if(!destroyed&&generation===sessionBindingGeneration){
                const internalProtocolFailure=internalStructuralToolFailure(error);
                console.error('Arcane saved chat could not be opened.',error);
                const message=internalProtocolFailure
                    ?'This saved chat could not be opened.'
                    :visibleErrorMessage(error,'The chat session could not be opened.');
                setSessionStatus('error',message);
                dispatchChatEvent(
                    'chat-session-error',
                    {phase:'binding',error,options},
                    {
                        bubbles:true,
                        composed:true,
                        operationId,
                        publicDetail:{
                            phase:'binding',
                            options,
                            reason:chatReasons.sessionBindingRejected,
                            ...publicErrorFields(
                                error,
                                chatErrorCodes.sessionBindingRejected
                            )
                        }
                    }
                );
            }
            throw error;
        }finally{
            if(generation===sessionBindingGeneration){
                sessionBindingPending=false;
            }
        }
    }

    function isAbortSignal(value){
        return value!==null
            &&typeof value==='object'
            &&typeof value.aborted==='boolean'
            &&typeof value.addEventListener==='function'
            &&typeof value.removeEventListener==='function';
    }

    function createChatSubmissionAbort(reason,message){
        const error=new Error(message);
        error.name='AbortError';
        error.code=chatErrorCodes.messageSubmissionAborted;
        error.reason=reason;
        return error;
    }

    function createChatSubmissionOwnership(callerSignal=null){
        if(callerSignal!==null&&callerSignal!==undefined&&!isAbortSignal(callerSignal)){
            throw new TypeError('Chat submission signal must be an AbortSignal.');
        }
        const controller=new AbortController();
        const subscriptions=[];
        let released=false;

        function releaseChatSubmissionOwnership(){
            if(released){
                return false;
            }
            released=true;
            for(const {signal,listener} of subscriptions.splice(0)){
                signal.removeEventListener('abort',listener);
            }
            activeSubmissionOwnerships.delete(ownership);
            return true;
        }

        function abortChatSubmission(reason){
            if(!controller.signal.aborted){
                controller.abort(reason);
            }
            releaseChatSubmissionOwnership();
            return true;
        }

        const ownership={
            signal:controller.signal,
            abort:abortChatSubmission,
            release:releaseChatSubmissionOwnership
        };
        activeSubmissionOwnerships.add(ownership);

        function followAbortSignal(signal,fallbackReason){
            if(!signal||controller.signal.aborted){
                return;
            }
            if(signal.aborted){
                abortChatSubmission(signal.reason??fallbackReason);
                return;
            }
            function forwardChatSubmissionAbort(){
                abortChatSubmission(signal.reason??fallbackReason);
            }
            subscriptions.push({signal,listener:forwardChatSubmissionAbort});
            signal.addEventListener('abort',forwardChatSubmissionAbort,{once:true});
        }

        try{
            followAbortSignal(
                aiRuntimeStateAbortController.signal,
                createChatSubmissionAbort(
                    chatReasons.componentDestroyed,
                    'The chat component was destroyed before message submission settled.'
                )
            );
            followAbortSignal(
                callerSignal,
                createChatSubmissionAbort(
                    chatReasons.callerSignalAborted,
                    'The caller canceled the chat message submission.'
                )
            );
        }catch(error){
            releaseChatSubmissionOwnership();
            throw error;
        }
        return ownership;
    }

    host.sendMessage=host.sendMessage||async function(text=''){

    }

    function setMessageProgress(
        id='',
        {
            label='Working',
            current=0,
            total=0,
            failed=0,
            indeterminate=false,
            status=''
        }={}
    ){
        const messageId=String(id);
        const normalizedTotal=Number.isFinite(Number(total))
            ?Math.max(0,Math.floor(Number(total)))
            :0;
        const normalizedCurrent=Number.isFinite(Number(current))
            ?Math.min(normalizedTotal,Math.max(0,Math.floor(Number(current))))
            :0;
        const normalizedFailed=Number.isFinite(Number(failed))
            ?Math.max(0,Math.floor(Number(failed)))
            :0;
        const message=messageId
            ?[...chatOutput.children].find(
                candidate=>candidate.id===`message-${messageId}`
            )||null
            :null;
        const thinking=message?.querySelector('.thinking');

        if(!thinking){
            return false;
        }

        let progress=thinking.querySelector('.message_progress_content');
        let labelElement;
        let countElement;
        let fill;

        if(!progress){
            const ownerDocument=thinking.ownerDocument;
            progress=ownerDocument.createElement('span');
            progress.className='message_progress_content';
            labelElement=ownerDocument.createElement('span');
            labelElement.className='message_progress_text';
            countElement=ownerDocument.createElement('span');
            countElement.className='message_progress_count';
            const labelRow=ownerDocument.createElement('span');
            labelRow.className='message_progress_label';
            labelRow.append(labelElement,countElement);
            const track=ownerDocument.createElement('span');
            track.className='message_progress_track';
            fill=ownerDocument.createElement('span');
            fill.className='message_progress_fill';
            track.append(fill);
            progress.append(labelRow,track);
            thinking.replaceChildren(progress);
            thinking.classList.add('message_progress');
        }else{
            labelElement=progress.querySelector('.message_progress_text');
            countElement=progress.querySelector('.message_progress_count');
            fill=progress.querySelector('.message_progress_fill');
        }

        const isIndeterminate=indeterminate===true;
        const warningLabel=normalizedFailed>0
            ?` · ${normalizedFailed} warning${normalizedFailed===1?'':'s'}`
            :'';
        const visibleLabel=visibleProgressText(label,'Working','label');
        const visibleStatus=visibleProgressText(status,'Streaming','status');
        const progressStatus=isIndeterminate
            ?`${visibleStatus}${warningLabel}`
            :`${normalizedCurrent} of ${normalizedTotal}${warningLabel}`;
        const percent=normalizedTotal>0
            ?normalizedCurrent/normalizedTotal*100
            :0;

        labelElement.textContent=visibleLabel;
        countElement.textContent=progressStatus;
        progress.classList.toggle('indeterminate',isIndeterminate);
        fill.style.width=isIndeterminate?'32%':`${percent}%`;
        progress.setAttribute('role','progressbar');
        progress.setAttribute('aria-label',visibleLabel);
        if(isIndeterminate){
            progress.removeAttribute('aria-valuemin');
            progress.removeAttribute('aria-valuemax');
            progress.removeAttribute('aria-valuenow');
        }else{
            progress.setAttribute('aria-valuemin','0');
            progress.setAttribute('aria-valuemax',String(normalizedTotal));
            progress.setAttribute('aria-valuenow',String(normalizedCurrent));
        }
        progress.setAttribute(
            'aria-valuetext',
            `${visibleLabel} ${progressStatus}`
        );
        scrollTranscriptToBottom();
        return true;
    }

    function setAIAvailability(input={}){
        const availability={
            llm:hasSelectedAIRuntimeRole('llm')
                ?latestAIRuntimeRoles.llm.state==='ready'
                :Object.prototype.hasOwnProperty.call(input,'llm')
                ?Boolean(input.llm)
                :host.aiAvailability.llm,
            stt:latestAIRuntimeRoles
                ?latestAIRuntimeRoles.stt.state==='ready'
                :host.aiAvailability.stt,
            tts:latestAIRuntimeRoles
                ?latestAIRuntimeRoles.tts.state==='ready'
                :host.aiAvailability.tts
        };

        applyAIAvailability(availability);
        return {...availability};
    }

    function hasSelectedAIRuntimeRole(role){
        const record=latestAIRuntimeRoles?.[role];
        return typeof record?.providerId==='string'
            &&record.providerId.length>0
            &&typeof record?.modelId==='string'
            &&record.modelId.length>0;
    }

    function applyAIAvailability(availability){
        host.aiAvailability={...availability};
        send.disabled=host.conversationComplete
            ||!availability.llm
            ||sessionMessagePending
            ||Boolean(pendingStructuralToolMessage);
        send.title=pendingStructuralToolMessage
            ?pendingStructuralToolMessage
            :availability.llm
            ?'Send message'
            :'The selected language model service is unavailable.';
        send.setAttribute('aria-label',send.title);
    }

    function createAIActivationController({
        host,
        panel,
        title,
        status,
        progress,
        button,
        publish=dispatchChatEvent,
        createOperationId=nextChatOperationId,
        readErrorFields=publicErrorFields,
        reasons=chatReasons,
        errorCodes=chatErrorCodes
    }){
        let role=null;
        let requestPending=false;
        let requestError='';
        let requestGeneration=0;
        let destroyed=false;

        function cancellation(error){
            return error?.name==='AbortError'
                ||['ARCANE_AI_REQUEST_ABORTED','AI_CHAT_ABORTED'].includes(error?.code);
        }

        function selected(){
            return typeof role?.providerId==='string'
                &&role.providerId.length>0
                &&typeof role?.modelId==='string'
                &&role.modelId.length>0;
        }

        function modelDisplayName(){
            const configured=typeof host.modelName==='string'
                ?host.modelName.trim()
                :'';
            return configured||role?.modelId||'the selected language model';
        }

    function byteProgressUnit(value){
        const unit=String(value??'')
            .trim()
            .toLowerCase()
            .replace(/[\s_-]+/g,'');
        return unit.includes('byte')
            ||unit.includes('octet')
            ||/^(?:[kmgtpe]?i?b)(?:(?:\/|per)?(?:s|sec|second))?$/u.test(unit);
        }

        function determinateProgress(){
            const total=Number(role?.progress?.total);
            const completed=Number(role?.progress?.completed);
            const unit=typeof role?.progress?.unit==='string'&&role.progress.unit
                ?role.progress.unit
                :'items';
            if(
                byteProgressUnit(unit)
                ||!Number.isFinite(total)
                ||total<=0
                ||!Number.isFinite(completed)
            ){
                return null;
            }
            return {
                completed:Math.max(0,completed),
                total,
                unit
            };
        }

        function progressMessage(){
            const measured=determinateProgress();
            const phase=typeof role?.progress?.phase==='string'&&role.progress.phase
                ?role.progress.phase
                :'loading';
            const parts=[
                `Loading ${modelDisplayName()} through the Arcane SDK`,
                phase
            ];
            if(measured){
                parts.push(`${measured.completed} of ${measured.total} ${measured.unit}`);
            }
            parts.push('The first activation can take several minutes; keep this tab open');
            return parts.join(' · ');
        }

        function renderProgress(){
            const visible=requestPending||role?.state==='loading';
            progress.hidden=!visible;
            if(!visible){
                progress.removeAttribute('value');
                progress.removeAttribute('max');
                return;
            }
            const measured=determinateProgress();
            if(!measured){
                progress.removeAttribute('value');
                progress.removeAttribute('max');
                return;
            }
            progress.max=measured.total;
            progress.value=Math.min(measured.completed,measured.total);
        }

        function render(){
            if(destroyed){
                panel.hidden=true;
                return;
            }
            const visible=selected()&&role.state!=='ready';
            panel.hidden=!visible;
            panel.setAttribute(
                'aria-busy',
                String(requestPending||['loading','unloading'].includes(role?.state))
            );
            renderProgress();
            if(!visible){
                return;
            }
            if(requestPending){
                title.textContent='Requesting language model activation';
                status.textContent='Waiting for the selected language model runtime.';
                button.textContent='Requesting…';
                button.disabled=true;
                return;
            }
            if(role.state==='loading'){
                title.textContent=`Loading ${modelDisplayName()}`;
                status.textContent=progressMessage();
                button.textContent='Cancel activation';
                button.disabled=false;
                return;
            }
            if(role.state==='unloading'){
                title.textContent='Canceling language model load';
                status.textContent='Waiting for the selected language model runtime to stop.';
                button.textContent='Canceling…';
                button.disabled=true;
                return;
            }
            if(role.state==='error'||requestError){
                title.textContent='Language model activation failed';
                status.textContent=requestError||visibleErrorMessage(
                    role.error,
                    'The selected language model could not start.'
                );
                button.textContent='Try again';
                button.disabled=false;
                return;
            }
            if(role.state==='unloaded'){
                title.textContent='Language model not active';
                status.textContent='Start the selected language model to enable chat.';
                button.textContent='Start language model';
                button.disabled=false;
                return;
            }
            title.textContent='Language model unavailable';
            status.textContent='The selected language model cannot be activated in this state.';
            button.textContent='Unavailable';
            button.disabled=true;
        }

        async function request(action){
            if(destroyed||requestPending||!selected()){
                return false;
            }
            const permitted=action==='load'
                ?['unloaded','error'].includes(role.state)
                :action==='unload'&&role.state==='loading';
            if(!permitted){
                return false;
            }
            requestError='';
            const intent={role:'llm',action,reason:'user'};
            const request={intent,state:role};
            const operationId=typeof role?.operationId==='string'&&role.operationId
                ?role.operationId
                :createOperationId('llm-activation');
            const generation=++requestGeneration;
            const accepted=publish(
                'chat-ai-activation-request',
                request,
                {
                    bubbles:true,
                    composed:true,
                    cancelable:true,
                    operationId,
                    publicDetail:request
                }
            );
            if(!accepted||destroyed||generation!==requestGeneration){
                render();
                return false;
            }
            requestPending=true;
            render();
            try{
                await host.requestAIActivation(intent);
                if(destroyed||generation!==requestGeneration){
                    return false;
                }
                return true;
            }catch(error){
                if(destroyed||generation!==requestGeneration){
                    return false;
                }
                if(action==='load'
                    &&cancellation(error)
                    &&['unloaded','unloading'].includes(role?.state)){
                    return false;
                }
                const message=visibleErrorMessage(
                    error,
                    `The language model ${action} request failed.`
                );
                requestError=message;
                console.error('Arcane language model activation request failed.',error);
                publish(
                    'chat-ai-activation-error',
                    {request,error,message},
                    {
                        bubbles:true,
                        composed:true,
                        operationId,
                        publicDetail:{request,error,message,
                            ...readErrorFields(
                                error,
                                errorCodes.languageModelActivationRejected
                            )
                        }
                    }
                );
                return false;
            }finally{
                if(!destroyed&&generation===requestGeneration){
                    requestPending=false;
                    render();
                }
            }
        }

        function activateSelectedAI(){
            const action=role?.state==='loading'?'unload':'load';
            void request(action);
        }

        function synchronize(nextRole){
            if(destroyed){
                return;
            }
            if(
                nextRole?.state==='error'
                &&nextRole.error
                &&nextRole.error!==role?.error
            ){
                console.error('Arcane language model runtime failed.',nextRole.error);
            }
            if(role?.state!==nextRole.state
                ||role?.providerId!==nextRole.providerId
                ||role?.modelId!==nextRole.modelId
                ||role?.operationId!==nextRole.operationId){
                requestGeneration+=1;
                requestError='';
                requestPending=false;
            }
            role=nextRole;
            render();
        }

        function destroy(){
            if(destroyed){
                return;
            }
            destroyed=true;
            requestGeneration+=1;
            requestPending=false;
            button.removeEventListener('click',activateSelectedAI);
            panel.hidden=true;
        }

        button.addEventListener('click',activateSelectedAI);
        return {request,synchronize,destroy};
    }

    function synchronizeAIRuntimeState(snapshot){
        latestAIRuntimeRoles=snapshot.roles;
        aiActivationController.synchronize(snapshot.roles.llm);
        applyAIAvailability({
            llm:snapshot.roles.llm.state==='ready',
            stt:snapshot.roles.stt.state==='ready',
            tts:snapshot.roles.tts.state==='ready'
        });
    }

    function formatConversationTime(milliseconds=0){
        const totalSeconds=Math.max(0,Math.floor(milliseconds/1000));
        const hours=Math.floor(totalSeconds/3600);
        const minutes=Math.floor((totalSeconds%3600)/60);
        const seconds=totalSeconds%60;
        return hours>0
            ?`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`
            :`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    }

    function bindConversationTimebox(controller){
        const requiredMethods=[
            'snapshot',
            'start',
            'subscribe'
        ];
        if(
            !controller
            ||requiredMethods.some(function missingConversationTimeboxMethod(name){
                return typeof controller[name]!=='function';
            })
            ||typeof controller.limitReachedMessage!=='string'
        ){
            throw new TypeError('A compatible conversation timebox controller is required.');
        }
        if(conversationTimeboxController===controller){
            return controller;
        }
        conversationTimeboxUnsubscribe?.();
        conversationTimeboxController=controller;
        lastQueuedTimeboxRevision=null;
        clearConversationTimeboxError();
        conversationTimeboxPanel.hidden=false;
        conversationTimeboxStatus.textContent='Starting the elapsed timer.';
        conversationTimeboxUnsubscribe=controller.subscribe(
            function renderBoundConversationTimebox(state,event){
                renderConversationTimebox(state,event);
            }
        );
        try{
            controller.start();
        }catch(error){
            console.error('Arcane conversation timebox could not start.',error);
            conversationTimeboxStatus.textContent='The elapsed timer could not start.';
            conversationTimeboxPanel.dataset.error='true';
            conversationTimeboxUnsubscribe?.();
            conversationTimeboxUnsubscribe=null;
            conversationTimeboxController=null;
            throw error;
        }
        return controller;
    }

    function clearConversationTimeboxError(){
        conversationTimeboxError='';
        conversationTimeboxPanel.removeAttribute('data-error');
    }

    function setConversationTimeboxError(message){
        conversationTimeboxError=message;
        conversationTimeboxPanel.dataset.error='true';
        if(conversationTimeboxStatus.textContent!==message){
            conversationTimeboxStatus.textContent=message;
        }
    }

    function renderConversationTimebox(state={},event={}){
        if(event.type==='change'){
            clearConversationTimeboxError();
        }
        const countsDown=state.status==='armed'||state.status==='due';
        const displayMilliseconds=countsDown
            ?state.remainingMs??0
            :state.elapsedMs||0;
        conversationTimeboxElapsed.value=formatConversationTime(displayMilliseconds);
        conversationTimeboxElapsed.textContent=conversationTimeboxElapsed.value;
        conversationTimeboxPanel.dataset.state=state.status||'idle';
        let statusMessage='Starting the elapsed timer.';
        let timerLabel=`Conversation elapsed time ${conversationTimeboxElapsed.value}.`;
        if(state.status==='armed'){
            statusMessage=`Check-in set for ${formatConversationTime(state.durationMilliseconds)} from the latest setting.`;
            timerLabel=`Time remaining until the conversation check-in: ${conversationTimeboxElapsed.value}.`;
        }else if(state.status==='due'){
            statusMessage='The time check is due. Asking whether to end or continue.';
            timerLabel='The conversation time check is due.';
        }else if(state.status==='disposed'){
            statusMessage='The elapsed timer has stopped.';
            timerLabel=`Conversation timer stopped at ${conversationTimeboxElapsed.value}.`;
        }else if(state.status==='unlimited'){
            statusMessage='No time limit set. Elapsed time will keep running.';
        }
        conversationTimeboxElapsed.setAttribute('aria-label',timerLabel);
        if(conversationTimeboxError){
            statusMessage=conversationTimeboxError;
        }
        if(conversationTimeboxStatus.textContent!==statusMessage){
            conversationTimeboxStatus.textContent=statusMessage;
        }

        if(state.status==='due'&&lastQueuedTimeboxRevision!==state.revision){
            const dueRevision=state.revision;
            const dueController=conversationTimeboxController;
            lastQueuedTimeboxRevision=dueRevision;
            void queueConversationTimeboxMessage(
                conversationTimeboxController.limitReachedMessage,
                {
                    source:'conversation-timebox-limit',
                    synthetic:true,
                    preserveDraft:true,
                    timeboxRevision:dueRevision
                },
                function conversationTimeboxRevisionIsStillDue(){
                    const current=dueController?.snapshot();
                    return conversationTimeboxController===dueController
                        &&current?.status==='due'
                        &&current.revision===dueRevision;
                }
            );
        }
    }

    function queueConversationTimeboxMessage(message,context,guard){
        const operationId=typeof context?.operationId==='string'&&context.operationId
            ?context.operationId
            :nextChatOperationId('conversation-timebox');
        const deliveryContext={...context,operationId};
        const prior=programmaticSubmissionQueue.catch(
            function ignorePriorProgrammaticSubmissionFailure(){
                return false;
            }
        );
        const queued=prior.then(
            async function dispatchConversationTimeboxMessage(){
                if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                    return false;
                }
                if(typeof guard==='function'&&!guard()){
                    return false;
                }
                let lastError;
                let attemptedSubmissionGeneration=null;
                for(
                    let attempt=0;
                    attempt<conversationTimeboxRetryDelays.length;
                    attempt++
                ){
                    const retryDelay=conversationTimeboxRetryDelays[attempt];
                    if(retryDelay>0&&!(await waitForConversationTimeboxRetry(retryDelay))){
                        return false;
                    }
                    await hostSubmissionBarrier.waitForIdle();
                    if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                        return false;
                    }
                    if(typeof guard==='function'&&!guard()){
                        return false;
                    }
                    if(
                        attemptedSubmissionGeneration!==null
                        &&attemptedSubmissionGeneration!==hostSubmissionGeneration
                    ){
                        return false;
                    }
                    try{
                        const delivery=submitMessage(
                            message,
                            {
                                ...deliveryContext,
                                retry:attempt>0,
                                reuseVisibleMessage:attempt>0
                            }
                        );
                        attemptedSubmissionGeneration=hostSubmissionGeneration;
                        const delivered=await delivery;
                        if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                            return false;
                        }
                        if(typeof guard==='function'&&!guard()){
                            return false;
                        }
                        return requireConversationTimeboxDelivery(delivered);
                    }catch(error){
                        if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                            return false;
                        }
                        lastError=error;
                    }
                }
                throw lastError;
            }
        );
        programmaticSubmissionQueue=queued.then(
            function finishConversationTimeboxSubmission(result){
                if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                    return false;
                }
                if(typeof guard==='function'&&!guard()){
                    return false;
                }
                if(result!==false){
                    clearConversationTimeboxError();
                    const current=conversationTimeboxController?.snapshot();
                    if(current){
                        renderConversationTimebox(current,{type:'delivery'});
                    }
                }
                return result;
            },
            function reportConversationTimeboxSubmissionFailure(error){
                if(destroyed||aiRuntimeStateAbortController.signal.aborted){
                    return false;
                }
                if(typeof guard==='function'&&!guard()){
                    return false;
                }
                setConversationTimeboxError(
                    'The time check could not reach the AI.'
                );
                dispatchChatEvent(
                    'conversation-timebox-error',
                    {error,context:{...deliveryContext}},
                    {
                        bubbles:true,
                        composed:true,
                        operationId,
                        publicDetail:{
                            source:deliveryContext.source||'conversation-timebox',
                            reason:chatReasons.conversationTimeboxDeliveryRejected,
                            ...publicErrorFields(
                                error,
                                chatErrorCodes.conversationTimeboxDeliveryRejected
                            )
                        }
                    }
                );
                console.error('The conversation timebox message could not be sent.',error);
                return false;
            }
        );
        return programmaticSubmissionQueue;
    }

    function waitForConversationTimeboxRetry(delayMilliseconds){
        const signal=aiRuntimeStateAbortController.signal;
        if(signal.aborted){
            return Promise.resolve(false);
        }
        return new Promise(function scheduleConversationTimeboxRetry(resolve){
            let settled=false;
            let timer=null;
            function finishRetryWait(completed){
                if(settled){
                    return;
                }
                settled=true;
                if(timer!==null){
                    clearTimeout(timer);
                }
                signal.removeEventListener('abort',cancelRetryWait);
                resolve(completed);
            }
            function cancelRetryWait(){
                finishRetryWait(false);
            }
            timer=setTimeout(function completeRetryWait(){
                finishRetryWait(true);
            },delayMilliseconds);
            signal.addEventListener('abort',cancelRetryWait,{once:true});
            if(signal.aborted){
                cancelRetryWait();
            }
        });
    }

    async function streamMessage(text='', id='', isThinking){
        if(typeof text!=='string'){
            if(text instanceof Error){
                console.error('Arcane chat stream delivered an Error as content.',text);
                throw text;
            }
            const error=new TypeError(
                'Arcane chat stream content must be text.',
                {cause:text}
            );
            error.code='ARCANE_CHAT_STREAM_CONTENT_INVALID';
            console.error('Arcane chat stream delivered invalid content.',error);
            throw error;
        }
        if(!id){
            console.warn('Streaming messages require ids, none specified.')
            return false;
        }

        let message=[...chatOutput.children].find(
            candidate=>candidate.id===`message-${id}`
        )||null;
        
        if(!message){
            await receivedMessage(host.aiName,isThinking?'':text,id);
            if(!isThinking){
                return false;
            }
            message=[...chatOutput.children].find(
                candidate=>candidate.id===`message-${id}`
            )||null;
            if(!message){
                return false;
            }
        }

        let target=message.querySelector('.markdown');

        let thinkingHTML=message.querySelector('.thinking');
        
        if(isThinking && !thinkingHTML){
            thinkingHTML=message.ownerDocument.createElement('span');
            thinkingHTML.className='thinking';
            message.insertBefore(
                thinkingHTML,
                message.querySelector('.message_timestamp')
            );
        }

        if(isThinking){
            if(thinkingHTML.classList.contains('message_progress')){
                thinkingHTML.replaceChildren();
                thinkingHTML.classList.remove('message_progress');
            }
            thinkingHTML.append(
                message.ownerDocument.createTextNode(String(text))
            );
            scrollTranscriptToBottom();
            return true;
        }

        const clearThinking=thinkingHTML;
        
        //console.table(arguments);
        if(
            !isThinking
            &&text
            &&host.aiAvailability.tts
            &&speech.muted===false
        ){
            const aiRuntime=boundChatAI??globalThis.ai;
            if(typeof aiRuntime?.streamTTS==='function'){
                void Promise.resolve(aiRuntime.streamTTS(text)).catch(
                    reportTTSError
                );
            }else{
                reportTTSError(
                    new Error('The ready speech provider has no synthesis adapter.')
                );
            }
        }
        
        if(clearThinking){
            thinkingHTML.remove();
        }
        
        target.raw ? target.raw+=text : target.raw=text;

        target.innerHTML=new MD(target.raw).rendered;
        
        scrollTranscriptToBottom();
    }
