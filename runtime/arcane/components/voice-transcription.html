<link rel="stylesheet" href="./arcane/css/layout.css">
<style>
    :host{
        display:block;
        height:100%;
        min-height:0;
    }

    .voice-transcription{
        display:grid;
        gap:1em;
        grid-template-rows:auto minmax(12em,1fr) auto auto;
        height:100%;
        min-height:0;
    }

    .transcript{
        background:var(--background);
        border:1px solid var(--border-color);
        border-radius:.5em;
        overflow:auto;
        padding:1em;
    }

    .transcript:empty::before{
        content:attr(data-empty-label);
        opacity:.55;
    }

    .controls{
        display:flex;
        flex-wrap:wrap;
        gap:.5em;
    }

    .controls button{
        margin:0;
    }

    .controls[data-simple='true'] #start{
        flex:1 1 100%;
        min-height:4rem;
        font-size:1.25em;
    }

    .voice-transcription[data-simple='true']{
        grid-template-rows:auto auto auto minmax(12em,1fr);
    }

    [hidden]{
        display:none!important;
    }

    .recording{
        color:var(--danger-color);
    }

    .description,
    .status {
        margin: 0;
        overflow-wrap: anywhere;
    }

    .transcription-feedback {
        min-width: 0;
    }

    .stt-activation-progress {
        display: block;
        width: 100%;
        height: .6rem;
        margin-block-start: .7rem;
        accent-color: var(--arcane-action, var(--primary-color));
    }

    .stt-activation-progress[hidden] {
        display: none;
    }
</style>

<section class="voice-transcription">
    <p id="description" class="description" part="description"></p>
    <section id="transcript" class="transcript" part="transcript"></section>
    <div class="transcription-feedback">
        <p id="status" class="status" part="status" role="status" aria-live="polite"></p>
        <progress
            id="sttActivationProgress"
            class="stt-activation-progress"
            aria-label="Transcription model activation progress"
            hidden
        ></progress>
    </div>
    <section class="controls" part="controls">
        <button id="start" part="primary-action" type="button" disabled></button>
        <button id="sttActivation" type="button" hidden disabled>Start transcription</button>
        <button id="stop" part="stop-action" type="button" disabled></button>
        <button id="retry" part="retry-action" type="button" hidden></button>
        <button id="cancel" part="cancel-action" type="button" hidden></button>
        <button id="complete" part="complete-action" type="button" disabled></button>
    </section>
</section>

<script type="module">
    const {default:Is}=await import('strong-type');
    const is=new Is(false);

    const {arcaneLogging}=await import('arcane-os/logging');

    const completeValue=(value)=>value;
    const {
        createArcaneEventSource,
        projectArcaneDOMEvent
    }=await import('arcane-os/event-manager');

    const host=this;
    const events=createArcaneEventSource(
        host,
        {
            source:'arcane.component.voice-transcription',
            eventTypes:[
                'voice-transcription-ready',
                'voice-transcription-state',
                'voice-transcription-segment',
                'voice-transcription-empty',
                'voice-transcription-error',
                'voice-transcription-change',
                'voice-transcription-complete',
                'speech-transcription-complete',
                'speech-transcription-cancelled',
                'speech-stt-activation-request',
                'speech-stt-activation-error'
            ]
        }
    );
    const [
        {default:MD},
        {appendTranscription,createSTTActivationController,normalizeVoiceOptions},
        {requestAIRuntimeIntent,subscribeAIRuntimeState},
        {default:ContinuousVoiceCapture}
    ]=await Promise.all([
        import('../modules/MD.js'),
        import('../modules/ComponentContracts.js'),
        import('../modules/AIRuntimeState.js'),
        import('../modules/ContinuousVoiceCapture.js')
    ]);
    const description=host.shadowRoot.querySelector('#description');
    const transcriptElement=host.shadowRoot.querySelector('#transcript');
    const status=host.shadowRoot.querySelector('#status');
    const startButton=host.shadowRoot.querySelector('#start');
    const sttActivationButton=host.shadowRoot.querySelector('#sttActivation');
    const sttActivationProgress = host.shadowRoot.querySelector('#sttActivationProgress');
    const stopButton=host.shadowRoot.querySelector('#stop');
    const retryButton=host.shadowRoot.querySelector('#retry');
    const cancelButton=host.shadowRoot.querySelector('#cancel');
    const controlsElement=host.shadowRoot.querySelector('.controls');
    const feedbackElement=host.shadowRoot.querySelector('.transcription-feedback');
    const completeButton=host.shadowRoot.querySelector('#complete');
    const runtimeStateAbortController=new AbortController();

    let chunks=[];
    let mediaStream=null;
    let recorder=null;
    let state='idle';
    let stateMessage='';
    let sttRole=unavailableRole('stt');
    let transcript='';
    let sessionGeneration=0;
    let transcriptionAbortController=null;
    let eventOperationSequence=0;
    let voiceOperationId=null;
    let destroyed=false;
    let continuousSession=null;
    let completionAbortController=null;
    let options=normalizeVoiceOptions(optionsFromDataset());

    function nextVoiceOperationId(kind){
        eventOperationSequence+=1;
        return `${events.descriptor.instanceId}:${kind}:${eventOperationSequence}`;
    }

    function currentVoiceOperationId(kind='transcription'){
        voiceOperationId=voiceOperationId||nextVoiceOperationId(kind);
        return voiceOperationId;
    }

    function canonicalSTTCancellationReason(reason){
        if(reason==='runtime-unready'){
            return 'stt-role-unready';
        }
        if(reason==='stt-provider-request-cancelled'){
            return 'stt-provider-transcription-cancelled';
        }
        return String(reason||'stt-transcription-cancelled');
    }

    function dispatchVoiceEvent(
        type,
        compatibilityDetail={},
        {
            publicDetail={},
            operationId=null,
            beginOperation=null,
            bubbles=false,
            composed=false,
            cancelable=false
        }={}
    ){
        if(destroyed&&type!=='speech-transcription-cancelled'){
            return false;
        }
        if(beginOperation!==null){
            voiceOperationId=nextVoiceOperationId(beginOperation);
        }
        const publication=events.dispatch(
            type,
            compatibilityDetail,
            {
                publicDetail,
                operationId:operationId||currentVoiceOperationId(),
                cancelable
            }
        );
        if(!publication.accepted){
            return false;
        }
        return projectArcaneDOMEvent(
            host,
            publication.occurrence,
            {
                bubbles,
                composed,
                cancelable
            }
        );
    }

    host.clear=clear;
    host.completeTranscription=completeStream;
    host.configure=configure;
    host.destroy=destroy;
    host.reset=clear;
    host.startRecording=startRecording;
    host.stopRecording=stopRecording;
    host.retryTranscription=retryTranscription;
    host.cancelRecording=cancelRecording;
    host.requestSTTActivation=host.requestSTTActivation
        ||function requestSTTActivation(intent){
            return requestAIRuntimeIntent(intent);
        };

    Object.defineProperties(
        host,
        {
            options:{get:getOptions,set:configure},
            state:{get:()=>state},
            value:{get:()=>transcript,set:setValue}
        }
    );

    const lifecycleListenerOptions=completeValue(
        {signal:runtimeStateAbortController.signal}
    );
    startButton.addEventListener('click',handlePrimaryClick,lifecycleListenerOptions);
    stopButton.addEventListener('click',stopRecording,lifecycleListenerOptions);
    retryButton.addEventListener('click',retryTranscription,lifecycleListenerOptions);
    cancelButton.addEventListener('click',cancelRecording,lifecycleListenerOptions);
    completeButton.addEventListener('click',completeStream,lifecycleListenerOptions);
    window.addEventListener(
        'pagehide',
        handlePageHide,
        {signal:runtimeStateAbortController.signal}
    );
    window.addEventListener(
        'pageshow',
        handlePageShow,
        {signal:runtimeStateAbortController.signal}
    );

    const sttActivationController=createSTTActivationController(
        {
            host,
            button:sttActivationButton,
            progress: sttActivationProgress,
            onChange:renderState,
            eventSource:events
        }
    );

    function unavailableRole(role){
        return completeValue(
            {
                role,
                state:'unavailable',
                providerId:null,
                modelId:null,
                localOnly:null,
                loaded:false,
                busy:false,
                operationId:null,
                progress:null,
                error:null
            }
        );
    }

    function canStartVoiceRecording(role,workflowState,componentDestroyed){
        return !componentDestroyed
            &&role?.state==='ready'
            &&!role.busy
            &&['idle','error'].includes(workflowState);
    }

    function optionsFromDataset(){
        const dataset=host.dataset||{};
        const mapped={};
        const fields=[
            'completeLabel',
            'description',
            'emptyLabel',
            'startLabel',
            'stopLabel',
            'transcriptionLabel'
        ];
        for(const field of fields){
            if(dataset[field]!==undefined){
                mapped[field]=dataset[field];
            }
        }
        if(dataset.persist!==undefined){
            mapped.persist=dataset.persist!=='false';
        }
        return mapped;
    }

    function configure(input={}){
        if(destroyed){
            return getOptions();
        }
        const setInitial=Object.prototype.hasOwnProperty.call(input||{},'initialValue');
        const nextOptions=normalizeVoiceOptions(input,options);
        if(!setInitial){
            if(supersedeForConfigurationReplacement()){
                reportSTTCancellation(
                    'configuration-replaced',
                    'Transcription configuration replaced.'
                );
            }
        }
        options=nextOptions;
        renderOptions();
        if(setInitial){
            setValue(options.initialValue);
        }else{
            renderState();
        }
        return getOptions();
    }

    function handlePrimaryClick(){
        if(options.controls==='simple'&&continuousSession?.listening){
            return stopRecording();
        }
        return startRecording();
    }

    function isCurrentContinuousSession(session){
        return !destroyed&&continuousSession===session
            &&session.generation===sessionGeneration
            &&!session.controller.signal.aborted;
    }

    async function startContinuousRecording(){
        if(!canStartVoiceRecording(sttRole,state,destroyed)
            ||continuousSession?.queue.length){
            return false;
        }
        releaseContinuousSession();
        const session={
            generation:++sessionGeneration,
            controller:new AbortController(),
            requestController:null,
            capture:null,
            captureState:'starting',
            listening:true,
            flushing:false,
            processing:'idle',
            queue:[],
            failure:null,
            captureError:null,
            worker:null,
            waiters:[]
        };
        continuousSession=session;
        setState('starting',options.messages.requesting,{beginOperation:'transcription'});
        try{
            if(!isCurrentContinuousSession(session)||!session.listening){
                return false;
            }
            session.capture=new ContinuousVoiceCapture({
                ...options.capture,
                onSegment:function capturedSegment(clip){
                    if(!isCurrentContinuousSession(session)){
                        return;
                    }
                    session.queue.push({...clip,stage:'transcribe',segment:null});
                    processContinuousQueue(session);
                },
                onState:function captureStateChanged(nextState){
                    if(!isCurrentContinuousSession(session)){
                        return;
                    }
                    session.captureState=nextState;
                    if(nextState==='stopped'||nextState==='interrupted'){
                        session.listening=false;
                    }
                    renderContinuousState(session);
                },
                onError:function captureFailed(error){
                    if(!isCurrentContinuousSession(session)){
                        return;
                    }
                    session.captureError=error;
                    session.captureState='interrupted';
                    session.listening=false;
                    reportContinuousError(session,'capture',error);
                    settleContinuousDrain(session);
                }
            });
            const started=await session.capture.start({
                mediaConstraints:options.mediaConstraints,
                signal:session.controller.signal
            });
            if(!isCurrentContinuousSession(session)){
                session.capture.cancel();
                return false;
            }
            if(!started){
                session.listening=false;
                if(!session.captureError){
                    session.captureState='stopped';
                }
            }
            renderContinuousState(session);
            settleContinuousDrain(session);
            return started;
        }catch(error){
            if(!isCurrentContinuousSession(session)){
                return false;
            }
            session.listening=false;
            session.captureError=error;
            session.captureState='interrupted';
            session.capture?.cancel();
            reportContinuousError(session,'capture',error);
            settleContinuousDrain(session);
            return false;
        }
    }

    function continuousDetails(session){
        return {
            capture:session.captureState,
            processing:session.processing,
            queued:session.queue.length,
            errorPhase:session.failure?.phase||(session.captureError?'capture':null),
            error:session.failure?.error||session.captureError||null
        };
    }

    function renderContinuousState(session){
        if(!isCurrentContinuousSession(session)){
            return;
        }
        const messages=[];
        if(session.captureError){
            messages.push(options.messages.interrupted);
        }else if(session.listening){
            messages.push(session.captureState==='starting'
                ?options.messages.requesting:options.messages.listening);
        }else if(session.flushing||session.queue.length){
            messages.push(options.messages.draining);
        }
        const processingMessages={
            transcribing:options.messages.transcribing,
            saving:options.messages.saving,
            waiting:options.messages.waiting
        };
        if(session.failure){
            messages.push(session.failure.phase==='save'
                ?options.messages.saveError:options.messages.transcribeError);
        }else if(processingMessages[session.processing]){
            messages.push(processingMessages[session.processing]);
        }
        const nextState=session.listening
            ?(session.captureState==='starting'?'starting':'recording')
            :session.failure||session.captureError?'error'
            :session.flushing||session.queue.length?'transcribing':'idle';
        setState(nextState,messages.join(' ')||options.messages.ready);
    }

    function reportContinuousError(session,phase,error){
        arcaneLogging.error(`Continuous voice ${phase} failed:`,error);
        renderContinuousState(session);
        if(!isCurrentContinuousSession(session)){
            return;
        }
        const detail={phase,error,sequence:session.queue[0]?.sequence??null};
        dispatchVoiceEvent('voice-transcription-error',detail,{
            bubbles:true,composed:true,publicDetail:detail
        });
    }

    function waitForContinuousOperation(result,signal){
        return new Promise(function observeContinuousOperation(resolve,reject){
            function aborted(){
                reject(signal.reason||new DOMException('Transcription canceled.','AbortError'));
            }
            if(signal.aborted){
                aborted();
            }else{
                signal.addEventListener('abort',aborted,{once:true});
            }
            Promise.resolve(result).then(function completed(value){
                signal.removeEventListener('abort',aborted);
                resolve(value);
            },function failed(error){
                signal.removeEventListener('abort',aborted);
                reject(error);
            });
        });
    }

    function processContinuousQueue(session){
        if(!isCurrentContinuousSession(session)||session.worker||session.failure
            ||!session.queue.length){
            return;
        }
        // One ordered transcription/save consumer; microphone capture never waits for it.
        const work=Promise.resolve().then(function beginOrderedDrain(){
            return drainContinuousQueue(session);
        });
        session.worker=work;
        work.then(function queueSettled(){
            if(session.worker===work){
                session.worker=null;
            }
            if(!isCurrentContinuousSession(session)){
                return;
            }
            renderContinuousState(session);
            settleContinuousDrain(session);
            if(session.queue.length&&!session.failure
                &&sttRole.state==='ready'&&!sttRole.busy){
                processContinuousQueue(session);
            }
        },function unexpectedQueueFailure(error){
            if(session.worker===work){
                session.worker=null;
            }
            if(isCurrentContinuousSession(session)){
                session.failure={phase:session.queue[0]?.stage==='save'?'save':'transcribe',error};
                session.processing='error';
                reportContinuousError(session,session.failure.phase,error);
                settleContinuousDrain(session);
            }
        });
    }

    async function drainContinuousQueue(session){
        while(isCurrentContinuousSession(session)&&session.queue.length&&!session.failure){
            const clip=session.queue[0];
            if(clip.stage==='transcribe'&&(sttRole.state!=='ready'||sttRole.busy)){
                session.processing='waiting';
                renderContinuousState(session);
                return;
            }
            const controller=new AbortController();
            session.requestController=controller;
            try{
                if(clip.stage==='transcribe'){
                    session.processing='transcribing';
                    renderContinuousState(session);
                    if(!isCurrentContinuousSession(session)||controller.signal.aborted){
                        return;
                    }
                    const file=new File([clip.audio],`segment-${clip.sequence}.wav`,{type:clip.audio.type});
                    const result=await waitForContinuousOperation(transcribeAudio(file,{
                        audio:clip.audio,mimeType:clip.audio.type,transcript,
                        sequence:clip.sequence,signal:controller.signal
                    },controller.signal),controller.signal);
                    if(!isCurrentContinuousSession(session)){
                        return;
                    }
                    if(controller.signal.aborted){
                        throw controller.signal.reason||new DOMException('Transcription canceled.','AbortError');
                    }
                    if(!is.string(result)){
                        throw new TypeError('Transcription must return the complete text as a string.');
                    }
                    clip.segment=result;
                    if(result.length===0){
                        session.queue.shift();
                        const detail={sequence:clip.sequence,transcript};
                        dispatchVoiceEvent('voice-transcription-empty',detail,{
                            bubbles:true,composed:true,publicDetail:detail
                        });
                        continue;
                    }
                    clip.transcript=appendTranscription(transcript,result,options.separator);
                    clip.stage='save';
                    transcript=clip.transcript;
                    renderTranscript();
                }
                if(options.persist){
                    const save=options.onSave||(is.function(host.save)?host.save.bind(host):null);
                    if(!save){
                        throw new Error('Transcription saving is not configured.');
                    }
                    session.processing='saving';
                    renderContinuousState(session);
                    if(!isCurrentContinuousSession(session)||controller.signal.aborted){
                        return;
                    }
                    const result=await waitForContinuousOperation(save({
                        transcript:clip.transcript,segment:clip.segment,
                        sequence:clip.sequence,signal:controller.signal
                    }),controller.signal);
                    if(result===false){
                        throw new Error('The transcription save was not accepted.');
                    }
                }
                if(!isCurrentContinuousSession(session)){
                    return;
                }
                if(controller.signal.aborted){
                    throw controller.signal.reason||new DOMException('Transcription canceled.','AbortError');
                }
                session.queue.shift();
                const detail={text:clip.segment,transcript:clip.transcript,sequence:clip.sequence};
                dispatchVoiceEvent('speech-transcription-complete',detail,{
                    bubbles:true,composed:true,publicDetail:detail
                });
                if(!isCurrentContinuousSession(session)){
                    return;
                }
                dispatchVoiceEvent('voice-transcription-segment',detail,{
                    bubbles:true,composed:true,publicDetail:detail
                });
            }catch(error){
                if(!isCurrentContinuousSession(session)){
                    return;
                }
                session.failure={phase:clip.stage==='save'?'save':'transcribe',error};
                session.processing='error';
                reportContinuousError(session,session.failure.phase,error);
                return;
            }finally{
                if(session.requestController===controller){
                    session.requestController=null;
                }
            }
        }
        session.processing='idle';
    }

    function settleContinuousDrain(session){
        if(session.listening||session.flushing||session.worker){
            return;
        }
        if(session.queue.length&&!session.failure){
            return;
        }
        const success=isCurrentContinuousSession(session)
            &&!session.failure&&!session.captureError;
        for(const resolve of session.waiters.splice(0)){
            resolve(success);
        }
    }

    function continuousDrain(session){
        return new Promise(function awaitContinuousDrain(resolve){
            if(!isCurrentContinuousSession(session)){
                resolve(false);
                return;
            }
            session.waiters.push(resolve);
            settleContinuousDrain(session);
        });
    }

    async function stopContinuousRecording(session){
        if(!isCurrentContinuousSession(session)){
            return false;
        }
        if((completionAbortController||state==='complete')
            &&!session.listening&&!session.flushing&&!session.queue.length){
            return true;
        }
        if(session.listening){
            session.listening=false;
            session.flushing=true;
            session.captureState='stopped';
            // stop() releases microphone tracks before waiting for its final worklet message.
            const stopping=session.capture?.stop();
            renderContinuousState(session);
            try{
                await stopping;
            }catch(error){
                if(isCurrentContinuousSession(session)){
                    session.captureError=error;
                    reportContinuousError(session,'capture',error);
                }
            }finally{
                session.flushing=false;
            }
        }
        if(!isCurrentContinuousSession(session)){
            return false;
        }
        processContinuousQueue(session);
        renderContinuousState(session);
        return continuousDrain(session);
    }

    function retryTranscription(){
        const session=continuousSession;
        if(!session||!isCurrentContinuousSession(session)||!session.failure){
            return false;
        }
        session.failure=null;
        session.processing='idle';
        processContinuousQueue(session);
        renderContinuousState(session);
        return true;
    }

    function releaseContinuousSession(){
        const session=continuousSession;
        if(!session){
            return false;
        }
        continuousSession=null;
        session.controller.abort();
        session.requestController?.abort();
        session.capture?.cancel();
        session.queue=[];
        for(const resolve of session.waiters.splice(0)){
            resolve(false);
        }
        return true;
    }

    function cancelRecording(){
        if(destroyed){
            return false;
        }
        const hadContinuous=releaseContinuousSession();
        completionAbortController?.abort();
        completionAbortController=null;
        if(hadContinuous){
            sessionGeneration+=1;
            reportSTTCancellation('user-cancelled',options.messages.cancelled);
            return true;
        }
        return cancelSTTOperation('user-cancelled');
    }

    async function startRecording(){
        if(options.capture.mode==='continuous'){
            return startContinuousRecording();
        }
        if(!canStartVoiceRecording(sttRole,state,destroyed)){
            return false;
        }
        if(
            is.undefined(globalThis.MediaRecorder)
            ||!navigator.mediaDevices?.getUserMedia
        ){
            setState('error',options.messages.unsupported);
            return false;
        }

        const generation=++sessionGeneration;
        chunks=[];
        setState('starting',options.messages.requesting,{
            beginOperation:'transcription'
        });
        if(!recordingStartIsCurrent(generation,'starting')){
            return rejectRecordingStart(generation);
        }
        try{
            const stream=await navigator.mediaDevices.getUserMedia(
                options.mediaConstraints
            );
            if(!recordingStartIsCurrent(generation,'starting')){
                return rejectRecordingStart(generation,stream);
            }
            mediaStream=stream;
            const activeRecorder=createRecorder(mediaStream);
            recorder=activeRecorder;
            activeRecorder.addEventListener('dataavailable',collectAudio);
            activeRecorder.addEventListener('stop',finishRecording,{once:true});
            activeRecorder.addEventListener('error',recordingError,{once:true});
            for(const track of mediaStream.getAudioTracks()){
                track.addEventListener('ended',recordingInterrupted,{once:true});
            }
            activeRecorder.start();
            if(!recordingStartIsCurrent(generation,'starting')
                ||recorder!==activeRecorder){
                return rejectAssignedRecordingStart(generation,stream);
            }
            setState('recording',options.messages.recording);
            if(!recordingStartIsCurrent(generation,'recording')
                ||recorder!==activeRecorder){
                return rejectAssignedRecordingStart(generation,stream);
            }
            return true;
        }catch(error){
            if(generation!==sessionGeneration||destroyed){
                return false;
            }
            releaseMicrophone();
            arcaneLogging.error('Unable to start recording:',error);
            setState('error',options.messages.startError);
            return false;
        }
    }

    function recordingStartIsCurrent(generation,expectedState){
        return isCurrentVoiceOperation(generation,expectedState)
            &&sttRole.state==='ready'
            &&!sttRole.busy;
    }

    function isCurrentVoiceOperation(generation,expectedState){
        return !destroyed
            &&generation===sessionGeneration
            &&state===expectedState;
    }

    function rejectRecordingStart(generation,stream=null){
        if(mediaStream===stream){
            releaseMicrophone();
        }else{
            stopMediaStream(stream);
        }
        if(generation===sessionGeneration
            &&!destroyed
            &&['starting','recording'].includes(state)){
            setState('idle',options.messages.ready);
        }
        return false;
    }

    function rejectAssignedRecordingStart(generation,stream){
        return mediaStream===stream
            ?rejectRecordingStart(generation,stream)
            :false;
    }

    function createRecorder(stream){
        for(const mimeType of options.mimeTypes){
            if(MediaRecorder.isTypeSupported?.(mimeType)){
                return new MediaRecorder(stream,{mimeType});
            }
        }
        return new MediaRecorder(stream);
    }

    function collectAudio(event){
        if(event.data?.size){
            chunks.push(event.data);
        }
    }

    function stopRecording(){
        if(continuousSession){
            return stopContinuousRecording(continuousSession);
        }
        if(destroyed||state!=='recording'||recorder?.state!=='recording'){
            return false;
        }
        const generation=sessionGeneration;
        const activeRecorder=recorder;
        setState('transcribing',options.messages.transcribing);
        if(!isCurrentVoiceOperation(generation,'transcribing')
            ||recorder!==activeRecorder
            ||activeRecorder.state!=='recording'){
            return false;
        }
        activeRecorder.stop();
        return isCurrentVoiceOperation(generation,'transcribing');
    }

    async function finishRecording(){
        const generation=sessionGeneration;
        if(!isCurrentVoiceOperation(generation,'transcribing')){
            return false;
        }
        const mimeType=recorder?.mimeType||chunks[0]?.type||'audio/webm';
        const audio=new Blob(chunks,{type:mimeType});
        let controller=null;
        releaseMicrophone();
        if(!audio.size){
            setState('error',options.messages.emptyAudio);
            return false;
        }
        if(sttRole.state!=='ready'||sttRole.busy){
            reportSTTCancellation(
                sttRole.busy?'stt-role-busy':'runtime-unready',
                sttRole.busy
                    ?'Transcription stopped because the selected service is busy.'
                    :'Transcription stopped because the selected service became unavailable.'
            );
            return false;
        }

        try{
            controller=new AbortController();
            transcriptionAbortController?.abort();
            transcriptionAbortController=controller;
            const file=new File(
                [audio],
                `audio.${fileExtension(mimeType)}`,
                {type:mimeType}
            );
            const result=await transcribeAudio(
                file,
                {
                    audio,
                    mimeType,
                    transcript,
                    signal:controller.signal
                },
                controller.signal
            );
            releaseTranscriptionController(controller);
            if(controller.signal.aborted
                ||generation!==sessionGeneration
                ||sttRole.state!=='ready'
                ||sttRole.busy
                ||destroyed){
                return false;
            }
            const segment=is.string(result)?result:'';
            if(segment.length===0){
                setState('idle',options.messages.noSpeech);
                return false;
            }

            transcript=appendTranscription(
                transcript,
                segment,
                options.separator
            );
            renderTranscript();

            if(options.persist){
                const save=options.onSave||(
                    is.function(host.save)?host.save.bind(host):null
                );
                if(!save){
                    setState('error',options.messages.saveError);
                    return false;
                }
                setState('saving',options.messages.saving);
                if(!isCurrentVoiceOperation(generation,'saving')){
                    return false;
                }
                try{
                    await save({transcript,segment});
                }catch(error){
                    if(!isCurrentVoiceOperation(generation,'saving')){
                        return false;
                    }
                    arcaneLogging.error('Unable to save transcription:',error);
                    setState('error',options.messages.saveError);
                    return false;
                }
            }

            const successState=options.persist?'saving':'transcribing';
            const detail={text:segment,transcript};
            return reportTranscriptionSuccess(
                generation,
                successState,
                detail,
                options.persist
                    ?options.messages.saved
                    :options.messages.transcribed,
                currentVoiceOperationId()
            );
        }catch(error){
            if(generation!==sessionGeneration||destroyed){
                return false;
            }
            if(isTranscriptionCancellation(error,controller)){
                releaseTranscriptionController(controller);
                reportSTTCancellation(
                    'stt-provider-request-cancelled',
                    options.messages.cancelled
                );
                return false;
            }
            arcaneLogging.error('Unable to transcribe recording:',error);
            setState('error',options.messages.transcribeError);
            return false;
        }finally{
            releaseTranscriptionController(controller);
        }
    }

    function reportTranscriptionSuccess(
        generation,
        expectedState,
        detail,
        message,
        operationId=null
    ){
        if(!isCurrentVoiceOperation(generation,expectedState)){
            return false;
        }
        dispatchVoiceEvent(
            'speech-transcription-complete',
            detail,
            {
                bubbles:true,
                composed:true,
                operationId,
                publicDetail:{
                    text:detail.text,
                    transcript:detail.transcript
                }
            }
        );
        if(!isCurrentVoiceOperation(generation,expectedState)){
            return false;
        }
        dispatchVoiceEvent(
            'voice-transcription-segment',
            detail,
            {
                bubbles:true,
                composed:true,
                operationId,
                publicDetail:{
                    text:detail.text,
                    transcript:detail.transcript
                }
            }
        );
        if(!isCurrentVoiceOperation(generation,expectedState)){
            return false;
        }
        setState('idle',message);
        return isCurrentVoiceOperation(generation,'idle');
    }

    function releaseTranscriptionController(controller){
        if(transcriptionAbortController!==controller){
            return false;
        }
        transcriptionAbortController=null;
        return true;
    }

    async function transcribeAudio(file,context,signal){
        if(options.transcribe){
            return options.transcribe(file,context);
        }
        if(!is.function(globalThis.ai?.fetchSTT)){
            await import('../modules/AI.js');
        }
        if(!is.function(globalThis.ai?.fetchSTT)){
            const error=new Error('Speech transcription is not configured.');
            error.code='ARCANE_VOICE_TRANSCRIPTION_STT_RUNTIME_METHOD_UNAVAILABLE';
            throw error;
        }
        return globalThis.ai.fetchSTT(file,signal);
    }

    function isTranscriptionCancellation(error,controller){
        return controller?.signal.aborted
            ||error?.name==='AbortError'
            ||[
                'ARCANE_AI_REQUEST_ABORTED',
                'ARCANE_AI_OPERATION_SUPERSEDED'
            ].includes(error?.code);
    }

    function fileExtension(mimeType=''){
        if(mimeType.includes('mp4')){
            return 'm4a';
        }
        if(mimeType.includes('ogg')){
            return 'ogg';
        }
        return 'webm';
    }

    function recordingInterrupted(){
        if(state==='recording'){
            setState('transcribing',options.messages.recordingEnded);
            if(recorder?.state==='recording'){
                recorder.stop();
            }
        }
    }

    function recordingError(event){
        setState('error',options.messages.interrupted);
        releaseMicrophone();
        arcaneLogging.error('Audio recorder error:',event.error||event);
    }

    async function completeStream(){
        if(destroyed||completionAbortController||state==='complete'){
            return false;
        }
        const session=continuousSession;
        if(!session&&(transcript.length===0||!['idle','error'].includes(state))){
            return false;
        }
        const generation=sessionGeneration;
        const completionController=new AbortController();
        // Reserve completion before stopping capture: drain callbacks may reenter.
        completionAbortController=completionController;
        try{
            if(session){
                await stopContinuousRecording(session);
                if(!isCurrentContinuousSession(session)||session.queue.length){
                    return false;
                }
            }
            if(destroyed||completionController.signal.aborted
                ||completionAbortController!==completionController
                ||generation!==sessionGeneration||transcript.length===0
                ||!['idle','error'].includes(state)){
                return false;
            }
            const completionTranscript=transcript;
            const complete=options.onComplete||(
                is.function(host.complete)?host.complete.bind(host):null
            );
            setState('completing',options.messages.completing,{
                beginOperation:'completion'
            });
            if(!isCurrentVoiceOperation(generation,'completing')){
                return false;
            }
            try{
                if(complete){
                    const input={transcript:completionTranscript};
                    if(session){
                        input.signal=completionController.signal;
                    }
                    const result=await waitForContinuousOperation(
                        complete(input),completionController.signal
                    );
                    if(result===false&&session){
                        throw new Error('Transcription completion was not accepted.');
                    }
                }
                if(!isCurrentVoiceOperation(generation,'completing')){
                    return false;
                }
                dispatchVoiceEvent(
                    'voice-transcription-complete',
                    {transcript:completionTranscript},
                    {
                        bubbles:true,
                        composed:true,
                        publicDetail:{
                            transcript:completionTranscript
                        }
                    }
                );
                if(!isCurrentVoiceOperation(generation,'completing')){
                    return false;
                }
                setState('complete',options.messages.complete);
                return isCurrentVoiceOperation(generation,'complete');
            }catch(error){
                if(!isCurrentVoiceOperation(generation,'completing')){
                    return false;
                }
                arcaneLogging.error('Unable to complete transcription:',error);
                setState('error',options.messages.completeError);
                return false;
            }
        }finally{
            if(completionAbortController===completionController){
                completionAbortController=null;
            }
        }
    }

    function supersedeForTranscriptReplacement(){
        if(releaseContinuousSession()){
            sessionGeneration+=1;
            completionAbortController?.abort();
            completionAbortController=null;
            return true;
        }
        const hadActiveOperation=[
            'starting',
            'transcribing',
            'saving',
            'completing'
        ].includes(state)||Boolean(transcriptionAbortController);
        if(!hadActiveOperation){
            return false;
        }
        sessionGeneration+=1;
        completionAbortController?.abort();
        completionAbortController=null;
        transcriptionAbortController?.abort();
        transcriptionAbortController=null;
        releaseMicrophone();
        return true;
    }

    function supersedeForConfigurationReplacement(){
        if(releaseContinuousSession()){
            sessionGeneration+=1;
            completionAbortController?.abort();
            completionAbortController=null;
            return true;
        }
        const hadActiveOperation=[
            'starting',
            'recording',
            'transcribing',
            'saving',
            'completing'
        ].includes(state)||Boolean(transcriptionAbortController);
        if(!hadActiveOperation){
            return false;
        }
        sessionGeneration+=1;
        completionAbortController?.abort();
        completionAbortController=null;
        transcriptionAbortController?.abort();
        transcriptionAbortController=null;
        releaseMicrophone();
        return true;
    }

    function setValue(value=''){
        if(destroyed){
            return transcript;
        }
        const operationSuperseded=
            supersedeForTranscriptReplacement();
        transcript=`${value??''}`;
        renderTranscript();
        if(operationSuperseded){
            reportSTTCancellation(
                'transcript-replaced',
                options.messages.transcriptReplaced
            );
        }else if(state!=='recording'){
            setState('idle',options.messages.ready);
        }
        dispatchVoiceEvent(
            'voice-transcription-change',
            {transcript},
            {
                beginOperation:'transcript-change',
                bubbles:true,
                composed:true,
                publicDetail:{
                    transcript
                }
            }
        );
        return transcript;
    }

    function clear(){
        if(destroyed||!['complete','error','idle'].includes(state)
            ||continuousSession?.queue.length){
            return false;
        }
        releaseContinuousSession();
        transcript='';
        renderTranscript();
        setState('idle',options.messages.ready);
        return true;
    }

    function renderTranscript(){
        transcriptElement.innerHTML=new MD(transcript).safeRendered;
        transcriptElement.querySelectorAll('a').forEach(
            link=>{
                link.target='_blank';
                link.removeAttribute('rel');
            }
        );
    }

    function renderOptions(){
        description.innerText=options.labels.description;
        transcriptElement.setAttribute(
            'aria-label',
            options.labels.transcription
        );
        transcriptElement.dataset.emptyLabel=options.labels.empty;
        startButton.innerText=options.labels.start;
        stopButton.innerText=options.labels.stop;
        completeButton.innerText=options.labels.complete;
        retryButton.innerText=options.labels.retry;
        cancelButton.innerText=options.labels.cancel;
        completeButton.hidden=!options.showComplete;
        controlsElement.dataset.simple=String(options.controls==='simple');
        host.shadowRoot.querySelector('.voice-transcription').dataset.simple=
            String(options.controls==='simple');
        if(options.controls==='simple'){
            description.after(controlsElement,feedbackElement,transcriptElement);
        }else{
            description.after(transcriptElement,feedbackElement,controlsElement);
        }
    }

    function releaseMicrophone(){
        const stream=mediaStream;
        recorder?.removeEventListener('dataavailable',collectAudio);
        recorder?.removeEventListener('stop',finishRecording);
        recorder?.removeEventListener('error',recordingError);
        if(recorder?.state==='recording'){
            recorder.stop();
        }
        mediaStream=null;
        recorder=null;
        chunks=[];
        stopMediaStream(stream);
    }

    function stopMediaStream(stream){
        const tracks=stream?.getTracks?.()||[];
        for(const track of tracks){
            track.removeEventListener('ended',recordingInterrupted);
            track.stop();
        }
    }

    function setState(nextState,message='',{beginOperation=null}={}){
        if(destroyed){
            return false;
        }
        if(beginOperation!==null){
            voiceOperationId=nextVoiceOperationId(beginOperation);
        }
        state=nextState;
        stateMessage=message||nextState;
        renderState();
        return true;
    }

    function synchronizeAIRuntimeState(snapshot){
        const previousRole=sttRole;
        sttRole=snapshot.roles.stt;
        if(sttRole.state==='error'&&previousRole.state!=='error'){
            arcaneLogging.error('Arcane transcription runtime failed.',sttRole.error);
        }
        sttActivationController.synchronize(sttRole);
        if(continuousSession){
            const session=continuousSession;
            if(['completing','complete'].includes(state)){
                renderState();
                return;
            }
            if(session.processing==='transcribing'
                &&(sttRole.state!=='ready'
                    ||previousRole.providerId!==sttRole.providerId
                    ||previousRole.modelId!==sttRole.modelId)){
                session.requestController?.abort();
            }
            processContinuousQueue(session);
            renderContinuousState(session);
            return;
        }
        if(previousRole.state==='ready'&&sttRole.state!=='ready'){
            if(cancelSTTOperation('runtime-unready')){
                return;
            }
        }
        renderState();
    }

    function cancelSTTOperation(reason){
        if(releaseContinuousSession()){
            sessionGeneration+=1;
            completionAbortController?.abort();
            completionAbortController=null;
            reportSTTCancellation(reason,options.messages.cancelled);
            return true;
        }
        const hadActiveOperation=['starting','recording','transcribing'].includes(state)
            ||Boolean(mediaStream)
            ||Boolean(recorder)
            ||Boolean(transcriptionAbortController);
        if(!hadActiveOperation){
            return false;
        }
        sessionGeneration+=1;
        transcriptionAbortController?.abort();
        transcriptionAbortController=null;
        releaseMicrophone();
        reportSTTCancellation(
            reason,
            'Transcription stopped because the selected service became unavailable.'
        );
        return true;
    }

    function reportSTTCancellation(reason,message,operationId=null){
        state='idle';
        stateMessage=message;
        dispatchVoiceEvent(
            'speech-transcription-cancelled',
            completeValue({reason}),
            {
                bubbles:true,
                composed:true,
                operationId:operationId||currentVoiceOperationId(),
                publicDetail:{reason:canonicalSTTCancellationReason(reason)}
            }
        );
        if(!destroyed){
            renderState();
        }
    }

    function renderState(){
        status.innerText=runtimeStatusMessage();
        status.classList.toggle('recording',state==='recording');
        status.setAttribute(
            'aria-busy',
            String(
                !destroyed
                &&(
                    sttActivationController.pending
                    ||['loading','unloading'].includes(sttRole.state)
                    ||sttRole.busy
                    ||['starting','transcribing','saving','completing'].includes(state)
                )
            )
        );
        const session=continuousSession;
        const continuousListening=Boolean(session?.listening);
        const simpleStop=options.controls==='simple'&&continuousListening;
        startButton.disabled=simpleStop?destroyed
            :!canStartVoiceRecording(sttRole,state,destroyed)||Boolean(session?.queue.length);
        startButton.innerText=simpleStop?options.labels.stop:options.labels.start;
        startButton.title=simpleStop?options.labels.stop:recordingButtonTitle();
        startButton.setAttribute('aria-label',startButton.title);
        startButton.setAttribute('aria-pressed',String(continuousListening));
        stopButton.hidden=options.controls==='simple'&&options.capture.mode==='continuous';
        stopButton.disabled=destroyed||(session?!continuousListening:state!=='recording');
        retryButton.hidden=!session?.failure;
        retryButton.disabled=destroyed;
        cancelButton.hidden=!session||session.listening
            ||(!session.flushing&&!session.queue.length&&!completionAbortController);
        cancelButton.disabled=destroyed;
        completeButton.disabled=destroyed
            ||transcript.length===0
            ||!['idle','error'].includes(state)
            ||Boolean(session?.queue.length||session?.flushing||session?.listening);
        sttActivationButton.hidden=destroyed||!sttActivationController.visible;
        sttActivationButton.disabled=destroyed
            ||sttActivationController.pending
            ||sttRole.state==='unloading'
            ||sttActivationController.action===null;
        sttActivationButton.textContent=sttActivationController.label;
        sttActivationButton.title=sttActivationController.title;
        sttActivationButton.setAttribute('aria-label',sttActivationButton.title);
        sttActivationButton.setAttribute(
            'aria-busy',
            String(
                sttActivationController.pending
                ||['loading','unloading'].includes(sttRole.state)
            )
        );
        dispatchVoiceEvent(
            'voice-transcription-state',
            completeValue(
                {
                    message:status.innerText,
                    state,
                    stt:sttRole,
                    ...(session?continuousDetails(session):{})
                }
            ),
            {
                bubbles:true,
                composed:true,
                publicDetail:{message:status.innerText,state,stt:sttRole,
                    ...(session?continuousDetails(session):{})}
            }
        );
    }

    function recordingButtonTitle(){
        if(destroyed||sttRole.state==='disposed'){
            return 'Transcription is unavailable.';
        }
        if(sttRole.state==='loading'){
            return 'The selected transcription service is loading.';
        }
        if(sttRole.state==='error'){
            return visibleErrorMessage(
                sttRole.error,
                'The selected transcription service reported an error.'
            );
        }
        if(sttRole.state!=='ready'){
            return 'The selected transcription service is unavailable.';
        }
        if(sttRole.busy){
            return 'The selected transcription service is busy.';
        }
        return options.labels.start;
    }

    function runtimeStatusMessage(){
        if(destroyed){
            return 'Transcription unavailable.';
        }
        if(continuousSession){
            return stateMessage;
        }
        return sttRole.state==='ready'
            &&!sttRole.busy
            &&!sttActivationController.pending
            &&!sttActivationController.error
                ?stateMessage
                :sttActivationController.status;
    }

    function visibleErrorMessage(error,fallback){
        try{
            if(error?.userSafe===true){
                const message=is.string(error.userMessage)
                    ?error.userMessage
                    :error.message;
                if(is.string(message)&&message.trim()){
                    return message;
                }
            }
        }catch{}
        return fallback;
    }

    function getOptions(){
        return {
            ...options,
            labels:{...options.labels},
            messages:{...options.messages},
            mediaConstraints:{...options.mediaConstraints},
            capture:{...options.capture},
            mimeTypes:options.mimeTypes.slice()
        };
    }

    function handlePageHide(event){
        if(event.persisted===true){
            if(continuousSession?.listening){
                stopContinuousRecording(continuousSession).catch(function pageCaptureStopFailed(error){
                    arcaneLogging.error('Unable to finish captured speech before page caching:',error);
                });
            }
            return;
        }
        destroy();
    }

    function handlePageShow(event){
        if(event.persisted!==true||destroyed){
            return;
        }
        restoreFromPageCache();
    }

    function restoreFromPageCache(){
        renderState();
    }

    function destroy(){
        if(destroyed){
            return true;
        }
        destroyed=true;
        completionAbortController?.abort();
        completionAbortController=null;
        runtimeStateAbortController.abort();
        sttActivationController.destroy();
        window.removeEventListener('pagehide',handlePageHide);
        window.removeEventListener('pageshow',handlePageShow);
        if(!cancelSTTOperation('component-destroyed')){
            sessionGeneration++;
        }
        state='idle';
        stateMessage='Transcription unavailable.';
        host.ready=false;
        renderState();
        events.dispose();
        return true;
    }

    renderOptions();
    transcript=options.initialValue;
    renderTranscript();
    setState('idle',options.messages.ready);
    if(!destroyed){
        subscribeAIRuntimeState(
            synchronizeAIRuntimeState,
            {signal:runtimeStateAbortController.signal}
        );
    }
    if(!destroyed){
        host.ready=true;
        dispatchVoiceEvent(
            'voice-transcription-ready',
            {},
            {
                beginOperation:'ready',
                bubbles:true,
                composed:true,
                publicDetail:{ready:true}
            }
        );
    }
</script>
