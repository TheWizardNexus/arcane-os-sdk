<link rel="stylesheet" href="./arcane/css/layout.css?v=3">
<style>
    :host {
        --arcane-speech-padding-block-end: .85rem;
        --arcane-speech-padding-block-start: .65rem;
        --arcane-speech-padding-inline: .75rem;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) max-content;
        align-items: center;
        gap: var(--arcane-space-3, .75rem);
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        padding:
            var(--arcane-speech-padding-block-start)
            var(--arcane-speech-padding-inline)
            var(--arcane-speech-padding-block-end);
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-radius-large, 1rem);
        background: var(--arcane-surface-raised, var(--modal-background));
        box-shadow: var(--arcane-shadow-small, 0 .25rem .8rem var(--shadow-color));
    }

    button {
        width: auto;
        min-height: 2.65rem;
        margin: 0;
        padding: .6rem .9rem;
        border: 1px solid var(--arcane-border, var(--border-color));
        border-radius: var(--arcane-radius-medium, .8rem);
        font: inherit;
        font-weight: 700;
        touch-action: none;
        user-select: none;
    }

    button:focus-visible {
        outline: .2rem solid var(--arcane-focus, var(--focus-color));
        outline-offset: .18rem;
    }

    button:disabled {
        cursor: not-allowed;
        opacity: .55;
    }

    #recordButton {
        grid-column: 1;
        width: 5rem;
        height: 5rem;
        min-height: 5rem;
        padding: .45rem .45rem .65rem;
        border: .28rem solid var(--arcane-border, var(--border-color));
        border-radius: 50%;
        background: var(--arcane-action, var(--primary-color));
        color: var(--arcane-action-text, var(--button-text-color, var(--text-color)));
        box-shadow:
            0 0 0 .22rem var(--arcane-surface-raised, var(--modal-background)),
            0 0 0 .34rem var(--arcane-border, var(--border-color)),
            var(--arcane-shadow-small, 0 .35rem .9rem var(--shadow-color));
        font-size: .82rem;
        line-height: 1.05;
        text-align: center;
    }

    #sttActivationButton {
        grid-column: 1;
        max-width: 8rem;
        background: var(--arcane-action, var(--primary-color));
        color: var(--arcane-action-text, var(--button-text-color, var(--text-color)));
    }

    #recordButton:active,
    #recordButton.pressed {
        opacity: .82;
        transform: scale(.94);
    }

    #stopButton {
        display: none;
    }

    .speech_status {
        grid-column: 2;
        min-width: 0;
        margin: 0;
        color: var(--arcane-muted, var(--text-color));
        font-size: .86rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
    }

    .speech_status[data-tone="error"] {
        color: var(--arcane-danger, var(--danger-color));
    }

    #muteButton {
        grid-column: 3;
        justify-self: end;
        float: none;
        background: var(--arcane-secondary, var(--secondary-color));
        color: var(--arcane-secondary-text, var(--text-color));
    }

    @media (max-width: 44rem) {
        :host {
            grid-template-columns: auto minmax(0, 1fr) auto;
        }

        #recordButton,
        #sttActivationButton {
            grid-row: 1 / span 2;
        }

        .speech_status {
            grid-row: 2;
            grid-column: 2 / span 2;
        }

        #muteButton {
            grid-row: 1;
            grid-column: 3;
        }
    }
</style>

<p class="hidden">Will auto send after X seconds of silence set in code.</p>
<button id="recordButton" type="button" aria-label="Transcription unavailable" disabled>Hold to talk</button>
<button id="sttActivationButton" type="button" hidden disabled>Start transcription</button>
<button id="stopButton" type="button" class="hidden" disabled>Send</button>
<p id="speechStatus" class="speech_status" role="status" aria-live="polite"></p>
<button id="muteButton" type="button" class="mute" aria-pressed="true" aria-label="Voice unavailable" disabled>Voice unavailable</button>

<script type="module">
    const completeValue = (value) => value;
    const {
        createArcaneEventSource,
        projectArcaneDOMEvent
    } = await import('arcane-os/event-manager');

    void import('../modules/DBLS.js').catch(
        function reportDBLSImportFailure(error) {
            console.error('The shared database runtime could not load.');
        }
    );
    const aiModuleImport = import('../modules/AI.js');
    const {
        requestAIRuntimeIntent,
        subscribeAIRuntimeState
    } = await import('../modules/AIRuntimeState.js');
    const {
        createSTTActivationController
    } = await import('../modules/ComponentContracts.js');

    const host = this;
    const events = createArcaneEventSource(
        host,
        {
            source: 'arcane.component.speech',
            eventTypes: [
                'speech-ready',
                'speech-transcription-complete',
                'speech-transcription-error',
                'speech-transcription-cancelled',
                'speech-microphone-unavailable',
                'speech-stt-activation-request',
                'speech-stt-activation-error',
                'speech-tts-lifecycle-error',
                'speech-synthesis-error'
            ]
        }
    );
    const shadowRoot = host.shadowRoot;
    const recordButton = shadowRoot.querySelector('#recordButton');
    const sttActivationButton = shadowRoot.querySelector('#sttActivationButton');
    const stopButton = shadowRoot.querySelector('#stopButton');
    const muteButton = shadowRoot.querySelector('#muteButton');
    const speechStatus = shadowRoot.querySelector('#speechStatus');
    const silenceDuration = 0;
    const runtimeStateAbortController = new AbortController();

    let sttRole = unavailableRole('stt');
    let ttsRole = unavailableRole('tts');
    let microphonePermissionStatus = null;
    let microphonePermissionListener = null;
    let captureSession = null;
    let recordingRequested = false;
    let recordingGeneration = 0;
    let transcriptionGeneration = 0;
    let transcriptionActive = false;
    let transcriptionAbortController = null;
    let silenceTimer = null;
    let activePointerId = null;
    let keyboardRecording = false;
    let localStatus = null;
    let pendingTTSIntent = null;
    let activeTTSIntent = null;
    let pendingUnmute = false;
    let ttsIntentGeneration = 0;
    let eventOperationSequence = 0;
    let transcriptionOperationId = null;
    let ttsOperationId = null;
    let destroyed = false;

    function nextSpeechOperationId(kind) {
        eventOperationSequence += 1;
        return `${events.descriptor.instanceId}:${kind}:${eventOperationSequence}`;
    }

    function dispatchSpeechEvent(
        type,
        compatibilityDetail = {},
        {
            publicDetail = {},
            operationId = null,
            bubbles = false,
            composed = false,
            cancelable = false
        } = {}
    ) {
        if (destroyed && type !== 'speech-transcription-cancelled') {
            return false;
        }
        const publication = events.dispatch(
            type,
            compatibilityDetail,
            {
                publicDetail,
                operationId,
                cancelable
            }
        );
        if (!publication.accepted) {
            return false;
        }
        return projectArcaneDOMEvent(
            host,
            publication.occurrence,
            {
                bubbles,
                composed,
                cancelable
            }
        );
    }

    function publicSpeechErrorFields(error, boundaryCode) {
        let causeCode = '';
        let message = '';
        try {
            causeCode = typeof error?.code === 'string'
                ? error.code
                : '';
            message = typeof error?.message === 'string'
                ? error.message
                : '';
        } catch {}
        return completeValue(
            {
                error,
                code: boundaryCode,
                ...(causeCode && causeCode !== boundaryCode
                    ? { causeCode }
                    : {}),
                ...(message ? { message } : {})
            }
        );
    }

    function microphoneFailureReason(error) {
        if (error?.name === 'NotFoundError') {
            return 'microphone-input-missing';
        }
        if (error?.name === 'NotReadableError') {
            return 'microphone-input-unavailable';
        }
        if (['NotAllowedError', 'SecurityError'].includes(error?.name)) {
            return 'microphone-capture-denied';
        }
        return 'microphone-capture-rejected';
    }

    function canonicalSTTCancellationReason(reason) {
        if (reason === 'runtime-unready') {
            return 'stt-role-unready';
        }
        if (reason === 'stt-provider-request-cancelled') {
            return 'stt-provider-transcription-cancelled';
        }
        return String(reason || 'stt-transcription-cancelled');
    }

    const initialMutedWasHydrated = typeof host.initialMuted === 'boolean';
    host.initialMuted = initialMutedWasHydrated ? host.initialMuted : true;
    host.muted = true;
    host.configure = configure;
    host.destroy = destroy;
    host.reportTTSError = reportTTSError;
    host.requestSTTActivation = host.requestSTTActivation
        || function requestSTTActivation(intent) {
            return requestAIRuntimeIntent(intent);
        };
    host.setAvailability = setAvailability;
    host.setMuted = setMuted;
    host.availability = {
        microphone: Boolean(
            navigator.mediaDevices?.getUserMedia
            && globalThis.MediaRecorder
        ),
        stt: false,
        tts: false
    };
    const sttActivationController = createSTTActivationController(
        {
            host,
            button: sttActivationButton,
            onChange: renderSTTActivationState,
            eventSource: events
        }
    );

    const lifecycleListenerOptions = completeValue(
        { signal: runtimeStateAbortController.signal }
    );
    recordButton.addEventListener('pointerdown', handleRecordPointerDown, lifecycleListenerOptions);
    recordButton.addEventListener('pointerup', handleRecordPointerUp, lifecycleListenerOptions);
    recordButton.addEventListener('pointercancel', handleRecordPointerCancel, lifecycleListenerOptions);
    recordButton.addEventListener('lostpointercapture', handleLostPointerCapture, lifecycleListenerOptions);
    recordButton.addEventListener('keydown', handleRecordKeyDown, lifecycleListenerOptions);
    recordButton.addEventListener('keyup', handleRecordKeyUp, lifecycleListenerOptions);
    recordButton.addEventListener('blur', handleRecordBlur, lifecycleListenerOptions);
    stopButton.addEventListener('click', stop, lifecycleListenerOptions);
    muteButton.addEventListener('click', muteToggle, lifecycleListenerOptions);
    window.addEventListener(
        'pagehide',
        destroy,
        { once: true, signal: runtimeStateAbortController.signal }
    );

    subscribeAIRuntimeState(
        synchronizeAIRuntimeState,
        {
            signal: runtimeStateAbortController.signal
        }
    );
    if (!host.initialMuted) {
        applyConfiguredMutedState(false);
    }
    synchronizeAIMutedState();
    renderControls();
    renderStatus();
    void observeMicrophonePermission();
    void aiModuleImport.then(
        function synchronizeMutedStateAfterAIImport() {
            if (!destroyed) {
                synchronizeAIMutedState();
            }
        },
        function reportAIModuleImportFailure(error) {
            if (destroyed) {
                return;
            }
            console.error('The shared AI runtime could not load.');
        }
    );

    host.componentReady = true;
    dispatchSpeechEvent(
        'speech-ready',
        { speech: host },
        {
            bubbles: true,
            composed: true,
            publicDetail: { ready: true }
        }
    );

    function unavailableRole(role) {
        return completeValue(
            {
                role,
                state: 'unavailable',
                providerId: null,
                modelId: null,
                localOnly: null,
                loaded: false,
                busy: false,
                operationId: null,
                progress: null,
                error: null
            }
        );
    }

    function selectedRole(role) {
        return typeof role?.providerId === 'string'
            && role.providerId.length > 0
            && typeof role?.modelId === 'string'
            && role.modelId.length > 0;
    }

    function configure(options = {}) {
        if (destroyed) {
            return host;
        }
        if (Object.prototype.hasOwnProperty.call(options, 'initialMuted')) {
            const configuredMuted = typeof options.initialMuted === 'boolean'
                ? options.initialMuted
                : true;
            host.initialMuted = configuredMuted;
            applyConfiguredMutedState(configuredMuted);
        }

        if (
            Object.prototype.hasOwnProperty.call(options, 'stt')
            || Object.prototype.hasOwnProperty.call(options, 'tts')
            || Object.prototype.hasOwnProperty.call(options, 'microphone')
        ) {
            setAvailability(options);
        }

        return host;
    }

    function setAvailability(input = {}) {
        if (destroyed) {
            return { ...host.availability };
        }
        // Compatibility-only explicit adapter report. Canonical consumers use
        // the sticky AIRuntimeState role records instead of this wrapper.
        const previousSTTRole = sttRole;
        const previousTTSRole = ttsRole;
        const microphoneWasAvailable = host.availability.microphone;

        if (Object.prototype.hasOwnProperty.call(input, 'microphone')) {
            host.availability.microphone = Boolean(input.microphone);
        }
        if (Object.prototype.hasOwnProperty.call(input, 'stt')
            && !Boolean(input.stt)
            && !selectedRole(sttRole)) {
            sttRole = unavailableRole('stt');
        }
        if (Object.prototype.hasOwnProperty.call(input, 'tts')
            && !Boolean(input.tts)
            && !selectedRole(ttsRole)) {
            ttsRole = unavailableRole('tts');
        }

        if (microphoneWasAvailable && !host.availability.microphone) {
            cancelSTTOperation('microphone-unavailable');
        }
        if (
            !microphoneWasAvailable
            && host.availability.microphone
            && localStatus?.owner === 'microphone'
        ) {
            localStatus = null;
        }
        applyRoleTransitions(previousSTTRole, previousTTSRole);
        return { ...host.availability };
    }

    function setMuted(muted) {
        if (destroyed) {
            return host;
        }
        if (typeof muted !== 'boolean') {
            throw new TypeError('muted must be boolean');
        }

        if (muted) {
            requestUserMute();
        } else {
            requestUserUnmute();
        }
        return host;
    }

    function applyConfiguredMutedState(muted) {
        if (muted) {
            requestUserMute();
        } else {
            pendingUnmute = true;
            host.muted = true;
            if (!settleSuccessfulUnmute()) {
                synchronizeAIMutedState();
                continuePendingUnmute();
            }
        }
        renderControls();
        renderStatus();
    }

    function synchronizeAIRuntimeState(snapshot) {
        const previousSTTRole = sttRole;
        const previousTTSRole = ttsRole;
        sttRole = snapshot.roles.stt;
        ttsRole = snapshot.roles.tts;
        if (sttRole.state === 'error' && previousSTTRole.state !== 'error') {
            console.error('Arcane transcription runtime failed.', sttRole.error);
        }
        if (ttsRole.state === 'error' && previousTTSRole.state !== 'error') {
            console.error('Arcane voice runtime failed.', ttsRole.error);
        }
        clearSettledTTSIntent();
        applyRoleTransitions(previousSTTRole, previousTTSRole);
    }

    function applyRoleTransitions(previousSTTRole, previousTTSRole) {
        sttActivationController.synchronize(sttRole);
        const sttBecameUnready = previousSTTRole.state === 'ready'
            && sttRole.state !== 'ready';
        const ttsBecameUnready = previousTTSRole.state === 'ready'
            && ttsRole.state !== 'ready';

        host.availability.stt = sttRole.state === 'ready';
        host.availability.tts = ttsRole.state === 'ready';

        if (sttBecameUnready) {
            cancelSTTOperation('runtime-unready');
        }
        if (ttsBecameUnready) {
            pendingUnmute = false;
            host.muted = true;
            stopTTSPlayback();
        }
        if (ttsRole.state === 'error' && (pendingUnmute || !host.muted)) {
            pendingUnmute = false;
            host.muted = true;
            stopTTSPlayback();
        }

        settleSuccessfulUnmute();
        continuePendingUnmute();

        synchronizeAIMutedState();
        renderControls();
        renderStatus();
    }

    function renderSTTActivationState() {
        renderControls();
        renderStatus();
    }

    function clearSettledTTSIntent() {
        if (!pendingTTSIntent) {
            return;
        }

        if (
            pendingTTSIntent === 'load'
            && ['loading', 'ready', 'error'].includes(ttsRole.state)
        ) {
            pendingTTSIntent = null;
        } else if (
            pendingTTSIntent === 'unload'
            && ['unloading', 'unloaded', 'unavailable', 'error', 'disposed'].includes(ttsRole.state)
        ) {
            pendingTTSIntent = null;
        }
    }

    function renderControls() {
        const transcriptionReady = sttRole.state === 'ready';
        const microphoneReady = host.availability.microphone
            && typeof globalThis.MediaRecorder === 'function'
            && typeof navigator.mediaDevices?.getUserMedia === 'function';
        const activationVisible = sttActivationController.visible;
        recordButton.hidden = activationVisible;
        recordButton.disabled = !transcriptionReady
            || !microphoneReady
            || sttRole.busy
            || transcriptionActive
            || destroyed;
        stopButton.disabled = destroyed
            || !transcriptionReady
            || sttRole.busy
            || captureSession?.recorder.state !== 'recording';
        recordButton.title = transcriptionButtonTitle();
        recordButton.setAttribute('aria-label', recordButton.title);
        recordButton.setAttribute(
            'aria-pressed',
            String(recordingRequested || Boolean(captureSession))
        );
        sttActivationButton.hidden = !activationVisible;
        sttActivationButton.disabled = destroyed
            || sttActivationController.pending
            || sttRole.state === 'unloading'
            || sttActivationController.action === null;
        sttActivationButton.textContent = sttActivationController.label;
        sttActivationButton.title = sttActivationController.title;
        sttActivationButton.setAttribute(
            'aria-label',
            sttActivationButton.title
        );
        sttActivationButton.setAttribute(
            'aria-busy',
            String(
                sttActivationController.pending
                || ['loading', 'unloading'].includes(sttRole.state)
            )
        );
        renderTTSControl();
    }

    function transcriptionButtonTitle() {
        if (destroyed || sttRole.state === 'disposed') {
            return 'Transcription is unavailable.';
        }
        if (sttRole.state === 'loading') {
            return 'The selected transcription service is loading.';
        }
        if (sttRole.state === 'error') {
            return visibleErrorMessage(
                sttRole.error,
                'The selected transcription service reported an error.'
            );
        }
        if (sttRole.state !== 'ready') {
            return 'The selected transcription service is unavailable.';
        }
        if (!host.availability.microphone) {
            return 'Microphone access is unavailable. Text chat is still available.';
        }
        if (sttRole.busy || transcriptionActive) {
            return 'The selected transcription service is busy.';
        }
        return 'Hold to talk';
    }

    function renderTTSControl() {
        const providerSelected = typeof ttsRole.providerId === 'string'
            && ttsRole.providerId.length > 0
            && typeof ttsRole.modelId === 'string'
            && ttsRole.modelId.length > 0;
        let disabled = destroyed;
        let label = host.muted ? 'Unmute' : 'Mute';
        let description = label === 'Unmute' ? 'Unmute AI voice' : 'Mute AI voice';

        if (pendingTTSIntent === 'unload') {
            disabled = true;
            label = 'Releasing voice…';
            description = 'The selected voice is being released.';
        } else if (ttsRole.state === 'unavailable' || ttsRole.state === 'disposed') {
            disabled = true;
            label = 'Voice unavailable';
            description = 'The selected speech service is unavailable.';
        } else if (ttsRole.state === 'unloading') {
            disabled = true;
            label = 'Releasing voice…';
            description = 'The selected voice is being released.';
        } else if (ttsRole.state === 'loading') {
            disabled = !providerSelected;
            label = providerSelected ? 'Cancel voice load' : 'Voice unavailable';
            description = providerSelected
                ? 'Cancel loading the selected voice.'
                : 'The selected speech service is unavailable.';
        } else if (ttsRole.state === 'unloaded') {
            disabled = !providerSelected;
            if (pendingTTSIntent === 'load') {
                label = 'Cancel voice load';
                description = 'Cancel loading the selected voice.';
            }
        } else if (ttsRole.state === 'error') {
            disabled = !providerSelected;
            label = providerSelected ? 'Retry voice' : 'Voice unavailable';
            description = providerSelected
                ? 'Retry loading the selected voice.'
                : 'The selected speech service is unavailable.';
        }

        muteButton.disabled = disabled;
        muteButton.textContent = label;
        muteButton.title = description;
        muteButton.setAttribute('aria-label', description);
        muteButton.setAttribute('aria-pressed', String(host.muted));
    }

    function renderStatus() {
        const messages = [];
        let tone = '';

        if (localStatus?.message) {
            messages.push(localStatus.message);
            tone = localStatus.tone;
        } else {
            messages.push(describeSTTRole());
        }
        messages.push(describeTTSRole());
        if (sttRole.state === 'error' || ttsRole.state === 'error') {
            tone = 'error';
        }

        speechStatus.textContent = messages.filter(Boolean).join(' ');
        speechStatus.dataset.tone = tone;
        speechStatus.setAttribute(
            'aria-busy',
            String(
                sttRole.state === 'loading'
                || sttRole.state === 'unloading'
                || ttsRole.state === 'loading'
                || sttRole.busy
                || ttsRole.busy
                || sttActivationController.pending
                || transcriptionActive
            )
        );
    }

    function describeSTTRole() {
        if (sttRole.state === 'ready' && !host.availability.microphone) {
            return 'Microphone unavailable.';
        }
        return sttActivationController.status;
    }

    function describeTTSRole() {
        if (pendingTTSIntent === 'load' && ttsRole.state === 'unloaded') {
            return 'Voice load requested; Cancel is available.';
        }
        if (pendingTTSIntent === 'unload') {
            return 'Voice release requested.';
        }
        if (ttsRole.state === 'loading') {
            return `Voice ${formatRoleProgress(ttsRole.progress, 'loading')}; Cancel is available.`;
        }
        if (ttsRole.state === 'unloading') {
            return `Voice ${formatRoleProgress(ttsRole.progress, 'releasing')}.`;
        }
        if (ttsRole.state === 'ready') {
            if (host.muted) {
                return 'Voice ready and muted.';
            }
            return ttsRole.busy ? 'Voice speaking.' : 'Voice ready.';
        }
        if (ttsRole.state === 'unloaded') {
            return host.muted ? 'Voice unloaded.' : 'Voice selected and waiting to load.';
        }
        if (ttsRole.state === 'error') {
            return `Voice error: ${visibleErrorMessage(ttsRole.error, 'Unknown error')}.`;
        }
        if (ttsRole.state === 'disposed') {
            return 'Voice disposed.';
        }
        return 'Voice unavailable.';
    }

    function formatRoleProgress(progress, fallback) {
        if (!progress) {
            return fallback;
        }
        return progress.phase;
    }

    function visibleErrorMessage(error, fallback) {
        try {
            if (error?.userSafe === true) {
                const message = typeof error.userMessage === 'string'
                    ? error.userMessage
                    : error.message;
                if (typeof message === 'string' && message.trim()) {
                    return message;
                }
            }
        } catch {}
        return fallback;
    }

    async function observeMicrophonePermission() {
        if (!navigator.permissions?.query || !navigator.mediaDevices?.getUserMedia) {
            return;
        }

        try {
            const permissionStatus = await navigator.permissions.query(
                { name: 'microphone' }
            );
            if (destroyed) {
                return;
            }
            microphonePermissionStatus = permissionStatus;
            microphonePermissionListener = synchronizeMicrophonePermission;
            microphonePermissionStatus.addEventListener?.(
                'change',
                microphonePermissionListener,
                { signal: runtimeStateAbortController.signal }
            );
            synchronizeMicrophonePermission();
        } catch (error) {
            // Some supported browsers do not expose microphone permission
            // state. getUserMedia remains the authoritative admission check.
        }
    }

    function synchronizeMicrophonePermission() {
        if (destroyed) {
            return;
        }
        setAvailability(
            {
                microphone: microphonePermissionStatus?.state !== 'denied'
            }
        );
    }

    function handleRecordPointerDown(event) {
        if (recordButton.disabled || event.button !== 0 || activePointerId !== null) {
            return;
        }

        event.preventDefault();
        activePointerId = event.pointerId;
        recordButton.setPointerCapture?.(event.pointerId);
        recordButton.classList.add('pressed');
        void record();
    }

    function handleRecordPointerUp(event) {
        if (event.pointerId !== activePointerId) {
            return;
        }

        event.preventDefault();
        releaseActivePointer(event.pointerId);
        stop();
    }

    function handleRecordPointerCancel(event) {
        if (event.pointerId !== activePointerId) {
            return;
        }

        releaseActivePointer(event.pointerId);
        stop();
    }

    function handleLostPointerCapture(event) {
        if (event.pointerId !== activePointerId) {
            return;
        }

        activePointerId = null;
        recordButton.classList.remove('pressed');
        stop();
    }

    function releaseActivePointer(pointerId) {
        activePointerId = null;
        if (recordButton.hasPointerCapture?.(pointerId)) {
            recordButton.releasePointerCapture(pointerId);
        }
        recordButton.classList.remove('pressed');
    }

    function handleRecordKeyDown(event) {
        if (
            recordButton.disabled
            || event.repeat
            || keyboardRecording
            || ![' ', 'Enter'].includes(event.key)
        ) {
            return;
        }

        event.preventDefault();
        keyboardRecording = true;
        recordButton.classList.add('pressed');
        void record();
    }

    function handleRecordKeyUp(event) {
        if (!keyboardRecording || ![' ', 'Enter'].includes(event.key)) {
            return;
        }

        event.preventDefault();
        keyboardRecording = false;
        recordButton.classList.remove('pressed');
        stop();
    }

    function handleRecordBlur() {
        if (!keyboardRecording) {
            return;
        }

        keyboardRecording = false;
        recordButton.classList.remove('pressed');
        stop();
    }

    function muteToggle() {
        if (pendingTTSIntent === 'load' || ttsRole.state === 'loading') {
            requestUserMute();
            return;
        }

        if (host.muted) {
            void requestUserUnmute();
        } else {
            requestUserMute();
        }
    }

    function requestUserMute() {
        if (destroyed) {
            return false;
        }
        if (host.muted && activeTTSIntent?.action === 'unload') {
            return false;
        }
        const wasMuted = host.muted;
        pendingUnmute = false;
        const shouldUnload = !wasMuted
            || pendingTTSIntent === 'load'
            || ['loading', 'ready', 'error'].includes(ttsRole.state);
        host.muted = true;
        stopTTSPlayback();
        if (shouldUnload) {
            void requestTTSIntent('unload', 'user');
        }
        renderControls();
        renderStatus();
    }

    async function requestUserUnmute() {
        if (destroyed) {
            return false;
        }
        if (!host.muted && ttsRole.state === 'ready') {
            return true;
        }
        if (activeTTSIntent?.action === 'load') {
            return false;
        }
        if (
            pendingUnmute
            && (pendingTTSIntent === 'load' || ttsRole.state === 'loading')
        ) {
            return false;
        }
        const providerSelected = typeof ttsRole.providerId === 'string'
            && ttsRole.providerId.length > 0
            && typeof ttsRole.modelId === 'string'
            && ttsRole.modelId.length > 0;
        const canRequestLoad = ttsRole.state === 'ready'
            || (
                providerSelected
                && ['unloaded', 'loading', 'error'].includes(ttsRole.state)
            );
        if (!canRequestLoad) {
            host.muted = true;
            stopTTSPlayback();
            reportTTSLifecycleError(
                new Error('No selected speech provider is available to load.'),
                'load'
            );
            return false;
        }

        pendingUnmute = true;
        const requested = await requestTTSIntent('load', 'user');
        if (!requested || destroyed) {
            pendingUnmute = false;
            host.muted = true;
            stopTTSPlayback();
            renderControls();
            renderStatus();
            return false;
        }
        settleSuccessfulUnmute();
        renderControls();
        renderStatus();
        return host.muted === false;
    }

    function settleSuccessfulUnmute() {
        if (!pendingUnmute || ttsRole.state !== 'ready' || destroyed) {
            return false;
        }
        pendingUnmute = false;
        pendingTTSIntent = null;
        host.muted = false;
        synchronizeAIMutedState();
        resumeTTSPlayback();
        return true;
    }

    function continuePendingUnmute() {
        if (!pendingUnmute || destroyed || !selectedRole(ttsRole)) {
            return false;
        }
        if (
            pendingTTSIntent === 'load'
            || activeTTSIntent?.action === 'load'
            || ttsRole.state === 'loading'
        ) {
            return false;
        }
        if (ttsRole.state !== 'unloaded') {
            return false;
        }

        void requestUserUnmute();
        return true;
    }

    async function requestTTSIntent(action, reason) {
        if (destroyed) {
            return false;
        }
        if (activeTTSIntent?.action === action) {
            return false;
        }
        const generation = ++ttsIntentGeneration;
        const operationId = nextSpeechOperationId(`tts-${action}`);
        const intent = completeValue({ action, generation, operationId });
        activeTTSIntent = intent;
        ttsOperationId = operationId;
        pendingTTSIntent = action === 'load' && ttsRole.state === 'ready'
            ? null
            : action;
        let lifecycle;
        try {
            if (typeof globalThis.ai?.setSpeechMuted === 'function') {
                lifecycle = globalThis.ai.setSpeechMuted(action === 'unload');
            } else {
                lifecycle = requestAIRuntimeIntent(
                    {
                        role: 'tts',
                        action,
                        reason
                    }
                );
            }
            await lifecycle;
        } catch (error) {
            if (destroyed || generation !== ttsIntentGeneration) {
                return false;
            }
            pendingTTSIntent = null;
            if (action === 'load') {
                pendingUnmute = false;
                host.muted = true;
                stopTTSPlayback();
            }
            reportTTSLifecycleError(error, action, operationId);
            return false;
        } finally {
            if (activeTTSIntent === intent) {
                activeTTSIntent = null;
            }
        }
        if (destroyed || generation !== ttsIntentGeneration) {
            return false;
        }
        if (action === 'load') {
            settleSuccessfulUnmute();
        }
        return true;
    }

    function reportTTSLifecycleError(error, action, operationId = null) {
        if (destroyed) {
            return false;
        }
        const message = visibleErrorMessage(
            error,
            `The voice ${action} request failed.`
        );
        localStatus = {
            message,
            tone: 'error'
        };
        const errorFields = publicSpeechErrorFields(
            error,
            `ARCANE_SPEECH_TTS_${action.toUpperCase()}_REJECTED`
        );
        const reason = `tts-${action}-rejected`;
        console.error(`Arcane voice ${action} request failed.`, error);
        dispatchSpeechEvent(
            'speech-tts-lifecycle-error',
            {
                action,
                ...errorFields,
                error,
                message,
                reason
            },
            {
                bubbles: true,
                composed: true,
                operationId: operationId || ttsOperationId
                    || nextSpeechOperationId(`tts-${action}`),
                publicDetail: {
                    action,
                    ...errorFields,
                    reason
                }
            }
        );
        renderControls();
        renderStatus();
        return false;
    }

    function reportTTSError(error, boundary = 'synthesis') {
        if (destroyed) {
            return false;
        }
        const failures = {
            synthesis: {
                code: 'ARCANE_SPEECH_TTS_SYNTHESIS_REQUEST_REJECTED',
                message: 'Speech synthesis failed.',
                reason: 'tts-synthesis-rejected'
            },
            decode: {
                code: 'ARCANE_SPEECH_TTS_DECODE_REJECTED',
                message: 'Speech audio could not be decoded.',
                reason: 'tts-decode-rejected'
            },
            'playback-start': {
                code: 'ARCANE_SPEECH_TTS_PLAYBACK_START_REJECTED',
                message: 'Speech playback could not start.',
                reason: 'tts-playback-start-rejected'
            },
            'playback-resume': {
                code: 'ARCANE_SPEECH_TTS_PLAYBACK_RESUME_REJECTED',
                message: 'Speech playback could not resume.',
                reason: 'tts-playback-resume-rejected'
            }
        };
        const normalizedBoundary = Object.hasOwn(failures, boundary)
            ? boundary
            : 'synthesis';
        const failure = failures[normalizedBoundary];
        const message = visibleErrorMessage(error, failure.message);
        host.muted = true;
        stopTTSPlayback();
        localStatus = {
            message,
            tone: 'error'
        };
        const errorFields = publicSpeechErrorFields(error, failure.code);
        console.error(`Arcane ${normalizedBoundary} speech operation failed.`, error);
        dispatchSpeechEvent(
            'speech-synthesis-error',
            {
                boundary: normalizedBoundary,
                ...errorFields,
                error,
                message,
                reason: failure.reason
            },
            {
                bubbles: true,
                composed: true,
                operationId: nextSpeechOperationId(`tts-${normalizedBoundary}`),
                publicDetail: {
                    boundary: normalizedBoundary,
                    ...errorFields,
                    reason: failure.reason
                }
            }
        );
        renderControls();
        renderStatus();
        return false;
    }

    function stopTTSPlayback() {
        const aiRuntime = globalThis.ai;
        if (!aiRuntime) {
            return;
        }

        aiRuntime.muted = true;
        aiRuntime.stopAudio?.();
    }

    function synchronizeAIMutedState() {
        const aiRuntime = globalThis.ai;
        if (!aiRuntime) {
            return;
        }

        aiRuntime.muted = host.muted || ttsRole.state !== 'ready';
    }

    function resumeTTSPlayback() {
        const aiRuntime = globalThis.ai;
        if (!aiRuntime || typeof aiRuntime.resumeAudio !== 'function') {
            return;
        }

        void Promise.resolve(aiRuntime.resumeAudio()).catch(
            function reportTTSResumeFailure(error) {
                reportTTSError(error, 'playback-resume');
            }
        );
    }

    async function transcribe(transcription = '') {
        const operationId = transcriptionOperationId
            || nextSpeechOperationId('transcription');
        const accepted = dispatchSpeechEvent(
            'speech-transcription-complete',
            { text: transcription },
            {
                operationId,
                publicDetail: {
                    text: transcription
                }
            }
        );
        transcriptionOperationId = null;
        return accepted;
    }

    async function record() {
        if (
            destroyed
            || sttRole.state !== 'ready'
            || sttRole.busy
            || !host.availability.microphone
            || typeof globalThis.MediaRecorder !== 'function'
            || typeof navigator.mediaDevices?.getUserMedia !== 'function'
            || recordingRequested
            || captureSession
            || transcriptionActive
        ) {
            resetRecordPress();
            return false;
        }

        const generation = ++recordingGeneration;
        transcriptionOperationId = nextSpeechOperationId('transcription');
        recordingRequested = true;
        localStatus = {
            message: 'Recording. Release to transcribe.',
            tone: ''
        };
        renderControls();
        renderStatus();

        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (error) {
            recordingRequested = false;
            resetRecordPress();
            if (
                ['NotAllowedError', 'NotFoundError', 'NotReadableError', 'SecurityError']
                    .includes(error?.name)
            ) {
                localStatus = {
                    message: 'Microphone access is unavailable. Text chat is still available.',
                    tone: 'error',
                    owner: 'microphone'
                };
                if (microphonePermissionStatus?.state === 'denied') {
                    setAvailability({ microphone: false });
                }
                dispatchSpeechEvent(
                    'speech-microphone-unavailable',
                    { reason: error.name },
                    {
                        bubbles: true,
                        composed: true,
                        operationId: transcriptionOperationId,
                        publicDetail: {
                            ...publicSpeechErrorFields(
                                error,
                                'ARCANE_SPEECH_MICROPHONE_CAPTURE_REJECTED'
                            ),
                            reason: microphoneFailureReason(error)
                        }
                    }
                );
                transcriptionOperationId = null;
            } else {
                reportTranscriptionError(error);
            }
            renderControls();
            renderStatus();
            return false;
        }

        if (
            !recordingRequested
            || generation !== recordingGeneration
            || sttRole.state !== 'ready'
            || sttRole.busy
            || destroyed
        ) {
            stopMediaStream(stream);
            resetRecordPress();
            return false;
        }

        let session = null;
        try {
            const recorder = new MediaRecorder(stream);
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);

            // ScriptProcessor remains the visible compatibility capture path
            // in this increment. AudioWorklet needs its own reviewed protocol.
            const processor = audioContext.createScriptProcessor(4096, 1, 1);
            session = {
                generation,
                recorder,
                stream,
                audioContext,
                source,
                processor,
                chunks: [],
                cancelled: false,
                released: false
            };

            captureSession = session;
            source.connect(processor);
            processor.connect(audioContext.destination);
            processor.onaudioprocess = function handleAudioProcess(event) {
                const input = event.inputBuffer.getChannelData(0);
                const isSilent = input.every(
                    function isSilentSample(sample) {
                        return Math.abs(sample) < .05;
                    }
                );

                if (isSilent && silenceDuration) {
                    if (!silenceTimer) {
                        silenceTimer = setTimeout(stopAfterSilence, silenceDuration);
                    }
                } else {
                    clearSilenceTimer();
                }
            };
            recorder.ondataavailable = function collectAudioChunk(event) {
                session.chunks.push(event.data);
            };
            recorder.onstop = function handleRecorderStop() {
                void finalizeCapture(session);
            };
            recorder.start();
            return true;
        } catch (error) {
            recordingRequested = false;
            if (session) {
                session.cancelled = true;
                releaseCaptureSession(session);
                if (captureSession === session) {
                    captureSession = null;
                }
            } else {
                stopMediaStream(stream);
            }
            resetRecordPress();
            reportTranscriptionError(error);
            return false;
        }
    }

    function stopAfterSilence() {
        clearSilenceTimer();
        stop();
    }

    function clearSilenceTimer() {
        if (silenceTimer !== null) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
        }
    }

    function stop() {
        recordingRequested = false;
        clearSilenceTimer();
        if (captureSession?.recorder.state !== 'inactive') {
            captureSession.recorder.stop();
        }
        return true;
    }

    async function finalizeCapture(session) {
        releaseCaptureSession(session);
        if (captureSession === session) {
            captureSession = null;
        }
        recordingRequested = false;
        resetRecordPress();

        if (
            session.cancelled
            || session.generation !== recordingGeneration
            || sttRole.state !== 'ready'
            || sttRole.busy
            || destroyed
        ) {
            renderControls();
            renderStatus();
            return false;
        }

        const audioBlob = new Blob(
            session.chunks,
            { type: 'audio/webm; codecs=opus' }
        );
        const audioFile = new File(
            [audioBlob],
            'audio.webm',
            { type: 'audio/webm' }
        );
        return transcribeAudio(audioFile);
    }

    async function transcribeAudio(audioFile) {
        const generation = ++transcriptionGeneration;
        transcriptionOperationId = transcriptionOperationId
            || nextSpeechOperationId('transcription');
        const controller = new AbortController();
        transcriptionAbortController?.abort();
        transcriptionAbortController = controller;
        transcriptionActive = true;
        localStatus = {
            message: 'Transcribing speech.',
            tone: ''
        };
        renderControls();
        renderStatus();

        try {
            const aiRuntime = globalThis.ai;
            if (sttRole.state !== 'ready' || sttRole.busy) {
                reportTranscriptionCancellation(
                    sttRole.busy ? 'stt-role-busy' : 'runtime-unready',
                    sttRole.busy
                        ? 'Transcription stopped because the selected service is busy.'
                        : 'Transcription stopped because the selected service became unavailable.'
                );
                return false;
            }
            if (typeof aiRuntime?.fetchSTT !== 'function') {
                const error = new Error('The selected transcription service is unavailable.');
                error.code = 'ARCANE_SPEECH_STT_RUNTIME_METHOD_UNAVAILABLE';
                throw error;
            }

            const transcription = await aiRuntime.fetchSTT(
                audioFile,
                undefined,
                controller.signal
            );
            if (
                generation !== transcriptionGeneration
                || sttRole.state !== 'ready'
                || destroyed
            ) {
                return false;
            }
            if (typeof transcription !== 'string') {
                throw new TypeError('The selected transcription service returned invalid text.');
            }

            localStatus = null;
            await transcribe(transcription);
            return true;
        } catch (error) {
            if (generation === transcriptionGeneration && !destroyed) {
                if (isTranscriptionCancellation(error, controller)) {
                    reportTranscriptionCancellation(
                        'stt-provider-request-cancelled',
                        'The selected transcription request was cancelled.'
                    );
                } else {
                    reportTranscriptionError(error);
                }
            }
            return false;
        } finally {
            if (transcriptionAbortController === controller) {
                transcriptionAbortController = null;
            }
            if (generation === transcriptionGeneration) {
                transcriptionActive = false;
                renderControls();
                renderStatus();
            }
        }
    }

    function reportTranscriptionError(error) {
        const message = visibleErrorMessage(
            error,
            'Speech transcription failed.'
        );
        localStatus = {
            message: `Transcription failed: ${message}`,
            tone: 'error'
        };
        const operationId = transcriptionOperationId
            || nextSpeechOperationId('transcription');
        const errorFields = publicSpeechErrorFields(
            error,
            'ARCANE_SPEECH_STT_TRANSCRIPTION_REQUEST_REJECTED'
        );
        const reason = 'stt-transcription-rejected';
        console.error('Arcane speech transcription failed.', error);
        dispatchSpeechEvent(
            'speech-transcription-error',
            {
                ...errorFields,
                error,
                message,
                reason
            },
            {
                bubbles: true,
                composed: true,
                operationId,
                publicDetail: {
                    ...errorFields,
                    reason
                }
            }
        );
        transcriptionOperationId = null;
        renderControls();
        renderStatus();
    }

    function isTranscriptionCancellation(error, controller) {
        return controller.signal.aborted
            || error?.name === 'AbortError'
            || [
                'ARCANE_AI_REQUEST_ABORTED',
                'ARCANE_AI_OPERATION_SUPERSEDED'
            ].includes(error?.code);
    }

    function reportTranscriptionCancellation(reason, message) {
        const operationId = transcriptionOperationId
            || nextSpeechOperationId('transcription');
        localStatus = {
            message,
            tone: ''
        };
        const accepted = dispatchSpeechEvent(
            'speech-transcription-cancelled',
            { reason },
            {
                bubbles: true,
                composed: true,
                operationId,
                publicDetail: {
                    reason: canonicalSTTCancellationReason(reason)
                }
            }
        );
        transcriptionOperationId = null;
        if (!destroyed) {
            renderControls();
            renderStatus();
        }
        return accepted;
    }

    function cancelSTTOperation(reason) {
        const hadActiveOperation = recordingRequested
            || Boolean(captureSession)
            || transcriptionActive;
        recordingGeneration += 1;
        transcriptionGeneration += 1;
        transcriptionAbortController?.abort();
        transcriptionAbortController = null;
        recordingRequested = false;
        transcriptionActive = false;
        clearSilenceTimer();
        resetRecordPress();

        if (captureSession) {
            captureSession.cancelled = true;
            if (captureSession.recorder.state !== 'inactive') {
                captureSession.recorder.stop();
            } else {
                releaseCaptureSession(captureSession);
                captureSession = null;
            }
        }

        if (hadActiveOperation) {
            reportTranscriptionCancellation(
                String(reason || 'stt-transcription-cancelled'),
                reason === 'component-destroyed'
                    ? 'Transcription stopped because the speech component was destroyed.'
                    : 'Transcription stopped because the selected service became unavailable.'
            );
        }
        transcriptionOperationId = null;
    }

    function releaseCaptureSession(session) {
        if (session.released) {
            return;
        }

        session.released = true;
        session.processor.onaudioprocess = null;
        session.processor.disconnect?.();
        session.source.disconnect?.();
        stopMediaStream(session.stream);
        if (session.audioContext.state !== 'closed') {
            void session.audioContext.close().catch(
                function reportAudioContextCloseFailure(error) {
                    console.warn('The microphone audio context could not close.');
                }
            );
        }
    }

    function stopMediaStream(stream) {
        stream?.getTracks().forEach(
            function stopMediaTrack(track) {
                track.stop();
            }
        );
    }

    function resetRecordPress() {
        recordButton.classList.remove('pressed');
        activePointerId = null;
        keyboardRecording = false;
    }

    function destroy() {
        if (destroyed) {
            return;
        }

        destroyed = true;
        runtimeStateAbortController.abort();
        sttActivationController.destroy();
        window.removeEventListener('pagehide', destroy);
        microphonePermissionStatus?.removeEventListener?.(
            'change',
            microphonePermissionListener
        );
        cancelSTTOperation('component-destroyed');
        stopTTSPlayback();
        events.dispose();
        host.componentReady = false;
        renderControls();
        renderStatus();
    }
</script>
