<link rel="stylesheet" href="./arcane/css/layout.css?v=3">
<link rel="stylesheet" href="./arcane/css/theme.css?v=1">
<link rel="stylesheet" href="./arcane/css/primitives.css?v=1">

<style>
    :host{
        color:var(--text-color);
        display:block;
        min-width:0;
    }

    [hidden]{
        display:none !important;
    }

    .markdown-document{
        min-width:0;
    }

    .document-state{
        background:var(--secondary-color);
        border:1px solid var(--border-color);
        border-radius:.5rem;
        color:var(--muted-text-color);
        margin:0;
        padding:1rem;
    }

    .document-state[data-state="error"]{
        border-inline-start:.3rem solid var(--danger-color);
        color:var(--text-color);
    }

    .table-of-contents{
        background:var(--secondary-color);
        border:1px solid var(--border-color);
        border-radius:.5rem;
        margin-block:0 1.5rem;
        padding:1rem 1.25rem;
    }

    .table-of-contents h2{
        font-size:1rem;
        margin:0 0 .6rem;
    }

    .table-of-contents ol{
        margin:0;
        padding-inline-start:1.5rem;
    }

    .table-of-contents li+li{
        margin-block-start:.35rem;
    }

    .table-of-contents li[data-level="3"]{
        margin-inline-start:1rem;
    }

    .table-of-contents li[data-level="4"],
    .table-of-contents li[data-level="5"],
    .table-of-contents li[data-level="6"]{
        margin-inline-start:2rem;
    }

    .document-content{
        line-height:1.65;
        min-width:0;
        overflow-wrap:break-word;
    }

    .document-content:focus{
        outline:none;
    }

    .document-content :where(h1,h2,h3,h4,h5,h6){
        line-height:1.25;
        scroll-margin-block-start:1rem;
    }

    .document-content :where(h1,h2,h3,h4,h5,h6):focus{
        border-radius:.25rem;
        outline:3px solid var(--focus-color);
        outline-offset:.2rem;
    }

    .document-content a,
    .table-of-contents a{
        color:var(--focus-color);
        text-decoration-thickness:.08em;
        text-underline-offset:.15em;
    }

    .document-content a:focus-visible,
    .table-of-contents a:focus-visible{
        border-radius:.2rem;
        outline:3px solid var(--focus-color);
        outline-offset:.2rem;
    }

    .document-content blockquote{
        border-inline-start:.25rem solid var(--border-color);
        color:var(--muted-text-color);
        margin-inline:0;
        padding-inline-start:1rem;
    }

    .document-content :where(code,kbd){
        background:var(--secondary-color);
        border-radius:.25rem;
        font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        padding:.08em .3em;
    }

    .document-content pre{
        background:var(--secondary-color);
        border:1px solid var(--border-color);
        border-radius:.5rem;
        overflow:auto;
        padding:1rem;
    }

    .document-content pre code{
        background:transparent;
        padding:0;
    }

    .document-content img{
        block-size:auto;
        border-radius:.35rem;
        max-inline-size:100%;
    }

    .document-content table{
        border-collapse:collapse;
        display:block;
        inline-size:100%;
        max-inline-size:100%;
        overflow-x:auto;
        overscroll-behavior-inline:contain;
    }

    .document-content table :where(code,kbd){
        overflow-wrap:normal;
        white-space:normal;
        word-break:normal;
    }

    .document-content table:focus-visible{
        outline:3px solid var(--focus-color);
        outline-offset:.2rem;
    }

    .document-content :where(th,td){
        border:1px solid var(--border-color);
        padding:.5rem;
        text-align:start;
        vertical-align:top;
    }

    .document-content th{
        background:var(--secondary-color);
    }

    @media (forced-colors:active){
        .document-state,
        .table-of-contents,
        .document-content pre,
        .document-content :where(th,td){
            border-color:CanvasText;
        }

        .document-content :where(h1,h2,h3,h4,h5,h6):focus,
        .document-content a:focus-visible,
        .document-content table:focus-visible,
        .table-of-contents a:focus-visible{
            outline-color:Highlight;
        }
    }
</style>

<section id="document" class="markdown-document" part="container" aria-busy="false">
    <p
        id="status"
        class="document-state"
        part="status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        tabindex="-1"
    ></p>

    <nav
        id="tableOfContents"
        class="table-of-contents"
        part="table-of-contents"
        aria-labelledby="tableOfContentsTitle"
        hidden
    >
        <h2 id="tableOfContentsTitle"></h2>
        <ol id="tableOfContentsList"></ol>
    </nav>

    <article
        id="content"
        class="document-content"
        part="content"
        tabindex="-1"
        hidden
    ></article>
</section>

<script type="module">
    const {arcaneLogging}=await import('arcane-os/logging');

    const host=this;
    host.ready=false;

    const {default:MD}=await import('../modules/MD.js?v=2');
    const {createArcaneEventSource,projectArcaneDOMEvent}=await import('arcane-os/event-manager');
    const events=createArcaneEventSource(host,{source:'arcane.component.markdown-document',eventTypes:['markdown-document-state','markdown-document-empty','markdown-document-error','markdown-document-loading','markdown-document-rendered','markdown-document-navigate','markdown-document-ready']});
    const lifecycleController=new AbortController();

    const documentElement=host.shadowRoot.querySelector('#document');
    const statusElement=host.shadowRoot.querySelector('#status');
    const tableOfContentsElement=host.shadowRoot.querySelector('#tableOfContents');
    const tableOfContentsTitle=host.shadowRoot.querySelector('#tableOfContentsTitle');
    const tableOfContentsList=host.shadowRoot.querySelector('#tableOfContentsList');
    const contentElement=host.shadowRoot.querySelector('#content');

    // BEGIN MARKDOWN_DOCUMENT_POLICY
    function markdownDocumentDecodeFragment(value=''){
        try{
            return decodeURIComponent(String(value||''));
        }catch{
            return String(value||'');
        }
    }

    function markdownDocumentSourceURL(value='',baseURL=''){
        const fallback=baseURL||document.baseURI;
        try{
            return new URL(String(value||fallback),fallback).href;
        }catch{
            return '';
        }
    }

    function markdownDocumentLinkPolicy(value='',sourceURL=''){
        const input=String(value??'');
        if(!input){
            return null;
        }

        if(input.startsWith('#')){
            const fragment=markdownDocumentDecodeFragment(input.substring(1));
            if(!fragment){
                return null;
            }
            return {
                external:false,
                fragment,
                href:input,
                kind:'fragment',
                targetURL:new URL(input,sourceURL).href
            };
        }

        try{
            const url=new URL(input,sourceURL);
            const sameOrigin=url.origin===new URL(sourceURL).origin;
            const markdown=sameOrigin&&/\.(?:md|markdown)$/i.test(url.pathname);
            return {
                external:!sameOrigin,
                fragment:markdownDocumentDecodeFragment(url.hash.substring(1)),
                href:url.href,
                kind:markdown?'markdown':'link',
                targetURL:url.href
            };
        }catch{
            return null;
        }
    }

    function markdownDocumentAssetURL(value='',sourceURL=''){
        const input=String(value??'');
        if(!input){
            return '';
        }
        try{
            return new URL(input,sourceURL).href;
        }catch{
            return '';
        }
    }

    function markdownDocumentHeadingBase(value=''){
        const identifier=String(value||'')
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g,'')
            .toLowerCase()
            .replace(/&/g,' and ')
            .replace(/[^a-z0-9]+/g,'-')
            .replace(/^-+|-+$/g,'');
        return identifier||'section';
    }

    function markdownDocumentNextHeadingIdentifier(value='',usedIdentifiers=new Set()){
        const base=markdownDocumentHeadingBase(value);
        let candidate=base;
        let suffix=2;
        while(usedIdentifiers.has(candidate)){
            candidate=`${base}-${suffix++}`;
        }
        usedIdentifiers.add(candidate);
        return candidate;
    }
    // END MARKDOWN_DOCUMENT_POLICY

    const pageOrigin=globalThis.location?.origin||new URL(document.baseURI).origin;
    const defaultSourceURL=markdownDocumentSourceURL(
        document.baseURI,
        document.baseURI,
        pageOrigin
    );
    const defaultOptions={
        labels:{
            content:'Document content',
            empty:'No document content is available.',
            error:'Unable to display this document.',
            loading:'Loading document…',
            tableOfContents:'On this page'
        },
        onNavigate:null,
        showTableOfContents:true,
        sourceURL:defaultSourceURL
    };

    let currentMarkdown='';
    let currentSourceURL=defaultSourceURL;
    let loadSequence=0;
    let options=normalizeOptions(optionsFromDataset(),defaultOptions);
    let state='empty';
    let tableOfContents=[];
    let operationSequence=0;
    let loadController=null;
    let destroyed=false;

    host.clear=clear;
    host.configure=configure;
    host.destroy=destroy;
    host.fail=fail;
    host.focus=focusDocument;
    host.focusFragment=focusFragment;
    host.load=load;
    host.render=render;

    Object.defineProperties(
        host,
        {
            options:{configurable:true,get:getOptions,set:configure},
            sourceURL:{configurable:true,get:()=>currentSourceURL,set:setSourceURL},
            state:{configurable:true,get:()=>state},
            tableOfContents:{configurable:true,get:()=>tableOfContents.map(entry=>({...entry}))},
            value:{configurable:true,get:()=>currentMarkdown,set:value=>render(value)}
        }
    );

    documentElement.addEventListener('click',handleNavigation,{signal:lifecycleController.signal});

    function optionsFromDataset(){
        const configured={};
        if(host.dataset.sourceUrl!==undefined){
            configured.sourceURL=host.dataset.sourceUrl;
        }
        if(host.dataset.showTableOfContents!==undefined){
            configured.showTableOfContents=host.dataset.showTableOfContents!=='false';
        }
        return configured;
    }

    function normalizeOptions(input={},previous=defaultOptions){
        if(!input||typeof input!=='object'||Array.isArray(input)){
            throw new TypeError('Markdown document options must be an object.');
        }

        const labelInput=input.labels===undefined?{}:input.labels;
        if(!labelInput||typeof labelInput!=='object'||Array.isArray(labelInput)){
            throw new TypeError('Markdown document labels must be an object.');
        }

        const labels={...previous.labels};
        for(const name of ['content','empty','error','loading','tableOfContents']){
            if(labelInput[name]!==undefined){
                if(typeof labelInput[name]!=='string'||!labelInput[name].trim()){
                    throw new TypeError(`Markdown document labels.${name} must be a nonempty string.`);
                }
                labels[name]=labelInput[name].trim();
            }
        }

        const sourceInput=input.sourceURL??input.sourceUrl??previous.sourceURL;
        const sourceURL=markdownDocumentSourceURL(
            sourceInput,
            previous.sourceURL||document.baseURI,
            pageOrigin
        );
        if(!sourceURL){
            throw new TypeError('Markdown document sourceURL must resolve to a valid URL.');
        }

        const onNavigate=input.onNavigate===undefined
            ?previous.onNavigate
            :input.onNavigate;
        if(onNavigate!==null&&typeof onNavigate!=='function'){
            throw new TypeError('Markdown document onNavigate must be a function or null.');
        }

        const showTableOfContents=input.showTableOfContents===undefined
            ?previous.showTableOfContents
            :input.showTableOfContents;
        if(typeof showTableOfContents!=='boolean'){
            throw new TypeError('Markdown document showTableOfContents must be boolean.');
        }

        return {
            labels,
            onNavigate,
            showTableOfContents,
            sourceURL
        };
    }

    function getOptions(){
        return {
            labels:{...options.labels},
            onNavigate:options.onNavigate,
            showTableOfContents:options.showTableOfContents,
            sourceURL:options.sourceURL
        };
    }

    function configure(input={}){
        if(destroyed){
            return false;
        }
        const priorSourceURL=options.sourceURL;
        const normalized=normalizeOptions(input,options);
        const wasLoading=state==='loading';
        supersedeLoad('markdown-configuration-replaced');
        options=normalized;
        renderLabels();

        if(!currentMarkdown){
            currentSourceURL=options.sourceURL;
            if(wasLoading){
                transition(
                    'empty',
                    {reason:'markdown-configuration-replaced'},
                    `${events.descriptor.instanceId}:configure:${++operationSequence}`
                );
            }else{
                updateStateDOM();
            }
        }else if(priorSourceURL!==options.sourceURL){
            render(currentMarkdown,{sourceURL:options.sourceURL});
        }else if(wasLoading){
            render(currentMarkdown,{sourceURL:options.sourceURL});
        }else{
            buildTableOfContents(tableOfContents);
            updateStateDOM();
        }

        return getOptions();
    }

    function renderLabels(){
        contentElement.setAttribute('aria-label',options.labels.content);
        tableOfContentsTitle.textContent=options.labels.tableOfContents;
        updateStateDOM();
    }

    function sourceURLFrom(input={},fallback=options.sourceURL){
        if(!input||typeof input!=='object'||Array.isArray(input)){
            throw new TypeError('Markdown document render options must be an object.');
        }
        const candidate=input.sourceURL??input.sourceUrl??fallback;
        const result=markdownDocumentSourceURL(
            candidate,
            fallback||document.baseURI,
            pageOrigin
        );
        if(!result){
            throw new TypeError('Markdown document sourceURL must resolve to a same-origin HTTP(S) URL.');
        }
        return result;
    }

    function setSourceURL(value=''){
        if(destroyed){
            return false;
        }
        const normalized=normalizeOptions({sourceURL:value},options);
        const wasLoading=state==='loading';
        supersedeLoad('markdown-source-replaced');
        options=normalized;
        if(currentMarkdown){
            render(currentMarkdown,{sourceURL:options.sourceURL});
        }else{
            currentSourceURL=options.sourceURL;
            if(wasLoading){
                transition(
                    'empty',
                    {reason:'markdown-source-replaced'},
                    `${events.descriptor.instanceId}:source:${++operationSequence}`
                );
            }else{
                updateStateDOM();
            }
        }
        return currentSourceURL;
    }

    async function load(source='',loadOptions={}){
        if(destroyed){
            return false;
        }
        supersedeLoad('markdown-load-replaced');
        const controller=new AbortController();
        loadController=controller;
        const sequence=loadSequence;
        const operationId=`${events.descriptor.instanceId}:load:${++operationSequence}`;
        let sourceURL;
        try{
            sourceURL=sourceURLFrom(loadOptions,currentSourceURL||options.sourceURL);
        }catch(error){
            if(sequence===loadSequence){
                showError(error,operationId);
            }
            if(loadController===controller){
                loadController=null;
            }
            return false;
        }

        currentSourceURL=sourceURL;
        transition('loading',{},operationId);

        try{
            const pending=typeof source==='function'
                ?source({sourceURL,signal:controller.signal,operationId})
                :source;
            const result=await pending;
            if(destroyed||sequence!==loadSequence){
                return false;
            }

            if(
                result
                &&typeof result==='object'
                &&!Array.isArray(result)
            ){
                sourceURL=sourceURLFrom(
                    result,
                    sourceURL
                );
                return renderMarkdown(result.markdown??result.value??'',sourceURL,operationId);
            }
            return renderMarkdown(result??'',sourceURL,operationId);
        }catch(error){
            if(!destroyed&&sequence===loadSequence&&!controller.signal.aborted){
                showError(error,operationId);
            }
            return false;
        }finally{
            if(loadController===controller){
                loadController=null;
            }
        }
    }

    function render(markdown='',renderOptions={}){
        if(destroyed){
            return false;
        }
        supersedeLoad('markdown-content-replaced');
        const operationId=`${events.descriptor.instanceId}:render:${++operationSequence}`;
        try{
            const sourceURL=sourceURLFrom(
                renderOptions,
                currentSourceURL||options.sourceURL
            );
            return renderMarkdown(markdown,sourceURL,operationId);
        }catch(error){
            showError(error,operationId);
            return false;
        }
    }

    function renderMarkdown(markdown='',sourceURL=options.sourceURL,operationId=null){
        if(typeof markdown!=='string'){
            throw new TypeError('Markdown document content must be a string.');
        }

        currentMarkdown=markdown;
        currentSourceURL=sourceURL;
        contentElement.replaceChildren();
        tableOfContents=[];
        tableOfContentsList.replaceChildren();

        if(!markdown.trim()){
            transition('empty',{},operationId);
            return true;
        }

        // MD.safeRendered owns Markdown rendering. The detached template keeps
        // source-relative links and images coherent before insertion.
        const safeRendered=new MD(markdown).safeRendered;
        const fragment=renderedMarkdownFragment(safeRendered,sourceURL);
        const meaningful=Boolean(
            fragment.textContent?.trim()
            ||fragment.querySelector('img,hr,table')
        );
        if(!meaningful){
            transition('empty',{},operationId);
            return true;
        }

        tableOfContents=decorateHeadings(fragment);
        decorateTables(fragment);
        contentElement.replaceChildren(fragment);
        buildTableOfContents(tableOfContents);
        transition(
            'ready',
            {
                characters:markdown.length,
                headings:tableOfContents.map(entry=>({...entry}))
            },
            operationId
        );
        return true;
    }

    function renderedMarkdownFragment(html='',sourceURL=options.sourceURL){
        const template=document.createElement('template');
        template.innerHTML=html;

        for(const link of template.content.querySelectorAll('a[href]')){
            const originalHref=link.getAttribute('href')||'';
            const policy=markdownDocumentLinkPolicy(originalHref,sourceURL,pageOrigin);
            if(!policy){
                continue;
            }
            link.setAttribute('href',policy.href);
            link.dataset.markdownKind=policy.kind;
            link.dataset.markdownOriginalHref=originalHref;
            link.dataset.markdownTargetUrl=policy.targetURL;
            link.dataset.markdownFragment=policy.fragment;
        }

        for(const image of template.content.querySelectorAll('img[src]')){
            const resolved=markdownDocumentAssetURL(
                image.getAttribute('src')||'',
                sourceURL,
                pageOrigin
            );
            if(resolved){
                image.setAttribute('src',resolved);
            }
            image.alt=image.getAttribute('alt')||'';
        }

        return template.content;
    }

    function decorateHeadings(fragment){
        const usedHeadingIds=new Set();
        return Array.from(fragment.querySelectorAll('h1,h2,h3,h4,h5,h6'))
            .map(
                heading=>{
                    const text=heading.textContent.trim()||'Untitled section';
                    const id=markdownDocumentNextHeadingIdentifier(
                        text,
                        usedHeadingIds
                    );
                    const level=Number(heading.tagName.slice(1));
                    heading.id=id;
                    heading.tabIndex=-1;
                    return {id,level,text};
                }
            );
    }

    function decorateTables(fragment){
        Array.from(fragment.querySelectorAll('table')).forEach(
            (table,index)=>{
                const headers=Array.from(table.querySelectorAll('thead th'));
                headers.forEach(header=>{
                    header.scope='col';
                });
                const headingText=headers
                    .map(header=>header.textContent.trim())
                    .filter(Boolean)
                    .join(', ');
                const prefix=`Data table ${index+1}`;
                const label=headingText?`${prefix}: ${headingText}`:prefix;

                table.tabIndex=0;
                table.setAttribute('aria-label',label);
            }
        );
    }

    function buildTableOfContents(entries=[]){
        const fragment=document.createDocumentFragment();
        for(const entry of entries){
            const item=document.createElement('li');
            const link=document.createElement('a');
            const href=`#${encodeURIComponent(entry.id)}`;
            const targetURL=new URL(href,currentSourceURL).href;

            item.dataset.level=String(entry.level);
            link.href=href;
            link.textContent=entry.text;
            link.dataset.markdownKind='fragment';
            link.dataset.markdownOriginalHref=href;
            link.dataset.markdownTargetUrl=targetURL;
            link.dataset.markdownFragment=entry.id;
            item.append(link);
            fragment.append(item);
        }
        tableOfContentsList.replaceChildren(fragment);
    }

    function clear(){
        if(destroyed){
            return false;
        }
        supersedeLoad('markdown-content-cleared');
        const operationId=`${events.descriptor.instanceId}:clear:${++operationSequence}`;
        currentMarkdown='';
        currentSourceURL=options.sourceURL;
        contentElement.replaceChildren();
        tableOfContents=[];
        tableOfContentsList.replaceChildren();
        transition('empty',{},operationId);
        return true;
    }

    function fail(error){
        if(destroyed){
            return false;
        }
        supersedeLoad('markdown-failure-presented');
        return showError(error,`${events.descriptor.instanceId}:fail:${++operationSequence}`);
    }

    function showError(error,operationId=null){
        currentMarkdown='';
        contentElement.replaceChildren();
        tableOfContents=[];
        tableOfContentsList.replaceChildren();
        const message=error instanceof Error
            ?error.message
            :String(error||options.labels.error);
        const code=String(error?.code||'ARCANE_MARKDOWN_DOCUMENT_RENDER_FAILED');
        const reason=String(error?.reason||'markdown-document-render-failed');
        transition('error',{message,code,reason},operationId);
        return false;
    }

    function transition(nextState,detail={},operationId=null){
        if(destroyed){
            return null;
        }
        state=nextState;
        updateStateDOM();

        const eventDetail={
            ...detail,
            sourceURL:currentSourceURL,
            state
        };
        const publicDetail={
            characters:Number(detail.characters||currentMarkdown.length||0),
            headingCount:Array.isArray(detail.headings)?detail.headings.length:tableOfContents.length,
            state
        };
        if(detail.code){
            publicDetail.code=String(detail.code);
        }
        if(detail.reason){
            publicDetail.reason=String(detail.reason);
        }
        const statePublication=events.dispatch('markdown-document-state',eventDetail,{publicDetail,operationId});
        projectArcaneDOMEvent(host,statePublication.occurrence,{bubbles:true,composed:true});

        const stateEvent={
            empty:'markdown-document-empty',
            error:'markdown-document-error',
            loading:'markdown-document-loading',
            ready:'markdown-document-rendered'
        }[state];
        if(stateEvent){
            const exactPublication=events.dispatch(stateEvent,eventDetail,{publicDetail,operationId});
            projectArcaneDOMEvent(host,exactPublication.occurrence,{bubbles:true,composed:true});
        }
        return eventDetail;
    }

    function updateStateDOM(){
        const readyState=state==='ready';
        const loadingState=state==='loading';
        documentElement.setAttribute('aria-busy',String(loadingState));
        host.setAttribute('aria-busy',String(loadingState));
        host.dataset.state=state;
        statusElement.dataset.state=state;
        statusElement.hidden=readyState;
        contentElement.hidden=!readyState;
        tableOfContentsElement.hidden=(
            !readyState
            ||!options.showTableOfContents
            ||tableOfContents.length===0
        );

        statusElement.textContent={
            empty:options.labels.empty,
            error:options.labels.error,
            loading:options.labels.loading,
            ready:''
        }[state]||'';
    }

    function focusDocument(){
        if(destroyed){
            return false;
        }
        if(state==='ready'){
            const heading=contentElement.querySelector('h1,h2,h3,h4,h5,h6');
            (heading||contentElement).focus({preventScroll:true});
            return true;
        }
        statusElement.focus({preventScroll:true});
        return false;
    }

    function handleNavigation(event){
        if(destroyed||event.defaultPrevented||event.button!==0){
            return;
        }
        const link=event.composedPath().find(
            node=>node?.tagName==='A'&&documentElement.contains(node)
        );
        if(!link||!link.hasAttribute('href')){
            return;
        }

        const detail={
            fragment:link.dataset.markdownFragment||'',
            href:link.dataset.markdownOriginalHref||link.getAttribute('href'),
            kind:link.dataset.markdownKind||'link',
            sourceURL:currentSourceURL,
            targetURL:link.dataset.markdownTargetUrl||link.href
        };
        operationSequence+=1;
        const operationId=`${events.descriptor.instanceId}:navigate:${operationSequence}`;
        const publication=events.dispatch('markdown-document-navigate',detail,{
            operationId,
            publicDetail:{kind:detail.kind,hasFragment:Boolean(detail.fragment)},
            cancelable:true
        });
        const continueNavigation=publication.accepted&&projectArcaneDOMEvent(host,publication.occurrence,{bubbles:true,composed:true,cancelable:true});

        if(detail.kind==='fragment'||detail.kind==='markdown'){
            event.preventDefault();
        }
        if(!continueNavigation){
            event.preventDefault();
            return;
        }

        if(detail.kind==='fragment'){
            focusFragment(detail.fragment);
        }else if(detail.kind==='markdown'&&options.onNavigate){
            Promise.resolve(options.onNavigate(detail,{signal:lifecycleController.signal,operationId})).catch(
                error=>{
                    if(!destroyed){
                        arcaneLogging.error('Markdown document navigation callback failed.',error);
                    }
                }
            );
        }
    }

    function focusFragment(fragment=''){
        if(destroyed){
            return false;
        }
        const decoded=markdownDocumentDecodeFragment(fragment);
        const generatedIdentifier=markdownDocumentHeadingBase(decoded);
        const target=Array.from(contentElement.querySelectorAll('[id]')).find(
            element=>element.id===decoded||element.id===generatedIdentifier
        );
        if(!target){
            return false;
        }
        target.focus({preventScroll:true});
        target.scrollIntoView({block:'start'});
        return true;
    }

    function supersedeLoad(reason){
        loadSequence+=1;
        loadController?.abort(reason);
        loadController=null;
    }

    function destroy(){
        if(destroyed){
            return false;
        }
        destroyed=true;
        supersedeLoad('markdown-document-destroyed');
        lifecycleController.abort('markdown-document-destroyed');
        currentMarkdown='';
        tableOfContents=[];
        contentElement.replaceChildren();
        tableOfContentsList.replaceChildren();
        events.dispose();
        host.ready=false;
        return true;
    }

    renderLabels();
    host.ready=true;
    transition('empty');
    const readyPublication=events.dispatch('markdown-document-ready',{component:host,state},{publicDetail:{ready:true,state}});
    projectArcaneDOMEvent(host,readyPublication.occurrence,{bubbles:true,composed:true});
</script>
