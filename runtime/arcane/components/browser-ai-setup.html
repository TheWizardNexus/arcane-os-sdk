<link rel="stylesheet" href="./arcane/css/primitives.css?v=1">
<style>
    :host{display:block;min-width:0}
    .flag-choice {
        margin-block: var(--arcane-space-2);
    }

    .flag-choice h4 {
        margin-block: var(--arcane-space-1);
    }

    p,
    button,
    a {
        overflow-wrap: anywhere;
    }

    button {
        white-space: normal;
    }

    .arcane-help:empty {
        display: none;
    }

    .gpu-status {
        box-sizing: border-box;
        max-width: 100%;
        line-height: 1.4;
        white-space: normal;
        overflow-wrap: anywhere;
    }

    .gpu-status[data-status="unknown"] {
        background: var(--arcane-action);
        border-color: var(--arcane-action);
        color: var(--arcane-action-text);
    }

    summary:focus-visible {
        outline: .18em solid var(--arcane-focus);
        outline-offset: .18em;
    }
</style>

<section class="arcane-card" aria-labelledby="setupTitle">
    <header class="arcane-card__header">
        <h2 id="setupTitle" class="arcane-section-heading">Browser AI acceleration</h2>
    </header>
    <div class="arcane-card__body">
        <h3>NPU</h3>
        <p id="webnnAvailability" role="status" aria-live="polite"></p>
        <div id="npuSetup">
            <p id="browserInstructions"></p>
            <div id="flagAddresses"></div>
        </div>
        <h3>GPU</h3>
        <p><span id="gpuAvailability" class="arcane-badge gpu-status" role="status" aria-live="polite"></span></p>
        <p id="gpuAdapterName" class="arcane-help"></p>
        <div id="gpuSetup" hidden>
            <p>“Force High Performance GPU” prefers your faster GPU.</p>
            <button id="copyGpuAddress" class="arcane-button arcane-button--secondary" type="button">Copy GPU flag address</button>
        </div>
        <p>Paste a copied address into your browser's address bar. Enable the flag, save your work, and relaunch.</p>
        <details>
            <summary>Setup help</summary>
            <p><a href="https://onnxruntime.ai/docs/tutorials/web/ep-webnn.html">WebNN setup documentation</a></p>
        </details>
        <p id="copyStatus" class="arcane-help" role="status" aria-live="polite"></p>
    </div>
    <footer class="arcane-card__footer">
        <button id="refreshAvailability" class="arcane-button arcane-button--secondary" type="button">Refresh</button>
        <p id="setupStatus" class="arcane-help" role="status" aria-live="polite"></p>
    </footer>
</section>

<script type="module">
    const host=this;
    const root=host.shadowRoot;
    host.ready=false;

    const {
        getBrowserDeviceSettings,
        detectBrowserGpu,
        WEBNN_BROWSER_SETTINGS
    } = await import('../sdk/ai/browser-device-settings.mjs');
    const {arcaneLogging}=await import('arcane-os/logging');
    const {createArcaneEventSource,projectArcaneDOMEvent}=await import('arcane-os/event-manager');
    const events=createArcaneEventSource(host,{
        source:'arcane.component.browser-ai-setup',
        eventTypes:['browser-ai-setup-ready']
    });
    const lifecycleController=new AbortController();
    const status=root.querySelector('#setupStatus');
    const copyStatus=root.querySelector('#copyStatus');
    const gpuAvailability=root.querySelector('#gpuAvailability');
    const gpuAdapterName=root.querySelector('#gpuAdapterName');
    const refreshButton = root.querySelector('#refreshAvailability');
    const copyGpuButton=root.querySelector('#copyGpuAddress');
    const copyButtons=[copyGpuButton];
    const choices=[];
    let copyTask=null;
    let copyingAddress = null;
    let gpuTask=null;
    let destroyed=false;

    host.refresh=refresh;
    host.checkGpu=checkGpu;
    host.open=open;
    host.destroy=destroy;

    function refresh() {
        if (destroyed) return false;
        const settings = getBrowserDeviceSettings();
        root.querySelector('#webnnAvailability').textContent = settings.webnnAvailable
            ? 'WebNN available.'
            : 'WebNN unavailable.';
        const unknownBrowser = settings.browserId === 'unknown';
        root.querySelector('#browserInstructions').textContent = settings.webnnFlagsURL || unknownBrowser
            ? '“Enables WebNN API” allows NPU use when supported.'
            : 'See Setup help for this browser.';
        for (const choice of choices) {
            choice.row.hidden = !unknownBrowser && choice.target.url !== settings.webnnFlagsURL;
            choice.heading.hidden = !unknownBrowser;
        }
        renderGpuGuidance(settings);
        return settings;
    }

    function renderGpuGuidance(settings = getBrowserDeviceSettings()) {
        root.querySelector('#gpuSetup').hidden = !settings.highPerformanceGpu;
    }

    function checkGpu() {
        if (destroyed) return Promise.resolve(false);
        if (gpuTask) return gpuTask;
        gpuAvailability.textContent = 'Detecting GPU...';
        gpuAvailability.dataset.status = 'pending';
        gpuAdapterName.textContent = '';
        refreshButton.disabled = true;
        gpuTask = detect().finally(
            function finishGpuDetection() {
                gpuTask = null;
                if (!destroyed) refreshButton.disabled = false;
            }
        );
        return gpuTask;

        async function detect() {
            try {
                const result = await detectBrowserGpu();
                if (destroyed) return false;
                if (!result.available) {
                    gpuAvailability.textContent = 'GPU unavailable.';
                    gpuAvailability.dataset.status = 'warning';
                } else if (result.performanceStatus === 'discrete') {
                    gpuAvailability.textContent = 'Already using the performance GPU.';
                    gpuAvailability.dataset.status = 'success';
                } else if (result.performanceStatus === 'integrated') {
                    gpuAvailability.textContent = 'Integrated GPU available.';
                    gpuAvailability.dataset.status = 'warning';
                } else if (result.performanceStatus === 'fallback') {
                    gpuAvailability.textContent = 'Software adapter available.';
                    gpuAvailability.dataset.status = 'warning';
                } else {
                    gpuAvailability.textContent = 'GPU available.';
                    gpuAvailability.dataset.status = 'unknown';
                }
                gpuAdapterName.textContent = result.available ? result.name : '';
                return result;
            } catch (error) {
                if (!destroyed) {
                    gpuAvailability.textContent = 'GPU detection failed. Select Refresh to retry.';
                    gpuAvailability.dataset.status = 'error';
                    arcaneLogging.error('Unable to detect the browser GPU adapter.', error);
                }
                return false;
            }
        }
    }

    function open(browserId) {
        if (destroyed) return Promise.resolve(false);
        const current = refresh();
        const selectedId = browserId ?? current.browserId;
        const target = WEBNN_BROWSER_SETTINGS.find(
            function matchSetupBrowser(browser) {
                return browser.browserId === selectedId;
            }
        );
        if (!target) {
            status.textContent = current.browserId === 'unknown'
                ? 'Choose Chrome or Edge to copy its NPU flag address.'
                : 'No NPU flag address for this browser.';
            return Promise.resolve(false);
        }
        return copyAddress(target.url);
    }

    function copyAddress(address) {
        if (destroyed) return Promise.resolve(false);
        if (copyTask) return copyingAddress === address ? copyTask : Promise.resolve(false);
        copyStatus.textContent = 'Copying address...';
        for (const button of copyButtons) {
            button.disabled = true;
        }
        copyingAddress = address;
        copyTask = writeAddress().finally(
            function finishAddressCopy() {
                copyTask = null;
                copyingAddress = null;
                if (!destroyed) {
                    for (const button of copyButtons) {
                        button.disabled = false;
                    }
                }
            }
        );
        return copyTask;

        async function writeAddress() {
            try {
                await globalThis.navigator.clipboard.writeText(address);
                if (destroyed) return false;
                copyStatus.textContent = 'Address copied. Paste it into your browser\'s address bar.';
                return true;
            } catch (error) {
                if (!destroyed) {
                    copyStatus.textContent = `Copy failed. Paste this address into your browser's address bar: ${address}`;
                    arcaneLogging.error('Unable to copy the browser flags address.', error);
                }
                return false;
            }
        }
    }

    const addressList = root.querySelector('#flagAddresses');
    for (const target of WEBNN_BROWSER_SETTINGS) {
        const row = document.createElement('section');
        const heading = document.createElement('h4');
        const copyButton = document.createElement('button');
        row.className = 'flag-choice';
        heading.textContent = target.name;
        copyButton.type = 'button';
        copyButton.className = 'arcane-button arcane-button--secondary';
        copyButton.textContent = 'Copy NPU flag address';
        copyButton.setAttribute('aria-label', `Copy NPU flag address for ${target.name}`);
        copyButton.addEventListener(
            'click',
            function copySelectedBrowserAddress() {
                return copyAddress(target.url);
            },
            {signal: lifecycleController.signal}
        );
        row.append(heading, copyButton);
        addressList.append(row);
        choices.push(
            {row, heading, target}
        );
        copyButtons.push(copyButton);
    }

    copyGpuButton.addEventListener('click',function copyGpuFlagsAddress(){
        const target=getBrowserDeviceSettings().highPerformanceGpu;
        if(target)return copyAddress(target.url);
    },{signal:lifecycleController.signal});
    refreshButton.addEventListener(
        'click',
        function refreshBrowserAvailability() {
            refresh();
            status.textContent = '';
            return checkGpu();
        },
        {signal: lifecycleController.signal}
    );
    host.ownerDocument.defaultView.addEventListener('pagehide',function disposeBeforePageUnload(event){
        if(!event.persisted)destroy();
    },{
        signal:lifecycleController.signal
    });

    function destroy(){
        if(destroyed)return false;
        destroyed=true;
        host.ready=false;
        lifecycleController.abort('browser-ai-setup-destroyed');
        events.dispose();
        return true;
    }

    refresh();
    checkGpu();
    host.ready=true;
    const publication=events.dispatch('browser-ai-setup-ready',{}, {
        publicDetail:{ready:true}
    });
    projectArcaneDOMEvent(host,publication.occurrence);
</script>
