name: Publish npm package

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: arcane-sdk-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected npm version
    if: github.repository == 'TheWizardNexus/arcane-os-sdk' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.pack.outputs.version }}
      channel: ${{ steps.publication.outputs.channel }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the npm publication toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          architecture: x64
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install declared dependencies
        run: npm ci --ignore-scripts
      - name: Pack the selected version
        id: pack
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/arcane-sdk-npm-release
        run: node tools/build-npm-release.mjs --output "$RELEASE_OUTPUT"
      - name: Resolve version and channel
        id: publication
        shell: bash
        run: node tools/npm-registry-publication.mjs preflight --tarball "${{ steps.pack.outputs.tarball }}"
      - name: Publish the selected tarball
        if: steps.publication.outputs['needs-publish'] == 'true'
        shell: bash
        run: npm publish "${{ steps.pack.outputs.tarball }}" --ignore-scripts --access public --tag "${{ steps.publication.outputs.channel }}"

  verify_registry:
    name: Verify npm version and channel
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out registry verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the npm verification toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          architecture: x64
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify registry visibility
        shell: bash
        run: node tools/npm-registry-publication.mjs verify --version "${{ needs.publish.outputs.version }}" --channel "${{ needs.publish.outputs.channel }}" --max-wait-ms 900000
