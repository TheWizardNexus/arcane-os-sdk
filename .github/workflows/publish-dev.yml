name: Publish development package

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish npm dev tag
    if: github.repository == 'TheWizardNexus/arcane-os-sdk' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Assert the authorized repository and ref
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "TheWizardNexus/arcane-os-sdk"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Authenticate the exact development check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "Reusing successful main Check run ${run_id} for ${GITHUB_SHA}."
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use a trusted-publishing compatible npm
        run: npm install --global npm@11.16.0
      - name: Require an unpublished development version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import packageDocument from './package.json' with {type:'json'};

          if(!/-dev(?:\.|$)/.test(packageDocument.version)){
              throw new Error(`Refusing to publish non-development version ${packageDocument.version}.`);
          }

          try{
              execFileSync('npm',['view',`${packageDocument.name}@${packageDocument.version}`,'version'],{
                  encoding:'utf8',
                  stdio:['ignore','pipe','pipe']
              });
          }catch(error){
              const diagnostics=`${error.stdout??''}\n${error.stderr??''}`;
              if(error.status===1&&/(?:E404|404 Not Found)/.test(diagnostics)){
                  process.exit(0);
              }
              throw error;
          }

          throw new Error(`${packageDocument.name}@${packageDocument.version} is already published.`);
          NODE
      - name: Publish with npm trusted publishing
        run: npm publish --ignore-scripts --access public --tag dev
