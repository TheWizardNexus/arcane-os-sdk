name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      check_run_id:
        description: Successful Check workflow run containing the selected npm package
        required: true
        type: string
      artifact_id:
        description: Exact npm package artifact from the selected Check run
        required: true
        type: string
      version:
        description: Exact numeric package version in the selected Check artifact
        required: true
        type: string

permissions: {}

concurrency:
  group: arcane-sdk-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected npm version
    if: github.repository == 'TheWizardNexus/arcane-os-sdk' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.selected.outputs.version }}
      channel: ${{ steps.publication.outputs.channel }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the npm publication toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          architecture: x64
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download the selected Check package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/arcane-sdk-npm-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.check_run_id }}
      - name: Select the checked tarball
        id: selected
        shell: bash
        env:
          RELEASE_INPUT: ${{ runner.temp }}/arcane-sdk-npm-release
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          tarball="$RELEASE_INPUT/arcane-os-$SELECTED_VERSION.tgz"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$SELECTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve version and channel
        id: publication
        shell: bash
        run: node tools/npm-registry-publication.mjs preflight --tarball "${{ steps.selected.outputs.tarball }}"
      - name: Publish the selected tarball
        if: steps.publication.outputs['needs-publish'] == 'true'
        shell: bash
        run: npm publish "${{ steps.selected.outputs.tarball }}" --ignore-scripts --access public --tag "${{ steps.publication.outputs.channel }}"

  verify_registry:
    name: Verify npm version and channel
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out registry verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the npm verification toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          architecture: x64
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify registry visibility
        shell: bash
        run: node tools/npm-registry-publication.mjs verify --version "${{ needs.publish.outputs.version }}" --channel "${{ needs.publish.outputs.channel }}" --max-wait-ms 900000
