name: Deploy SDK site to GitHub Pages

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy checked main site
    if: >-
      github.repository == 'TheWizardNexus/arcane-os-sdk' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'TheWizardNexus/arcane-os-sdk' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the newest successful main check
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_sha="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')"
          [[ "$checked_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "checked_sha=$checked_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying the newest successful main Check at ${checked_sha}."

      - name: Check out the exact checked source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.check.outputs.checked_sha }}
          persist-credentials: false

      - name: Authenticate the checked main revision
        shell: bash
        env:
          CHECKED_SHA: ${{ steps.check.outputs.checked_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TheWizardNexus/arcane-os-sdk"
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate site artifact
        shell: bash
        run: |
          test -f site/index.html
          test -f site/reference/reference-manifest.json
          test -f site/reference/reference.js
          test -f site/reference/sdk-api/index.html
          test -f site/reference/event-manager/index.html
          test -f site/reference/ai/index.html
          test -f site/reference/core/arcane-api/index.html
          test -f site/reference/core/capabilities/index.html
          test -f site/reference/runtime-modules/index.html
          test -f site/reference/runtime-modules/ai/index.html
          test -f site/reference/inventory/package-api.json
          if find site -type l -print -quit | grep -q .; then
            echo "The Pages artifact must not contain symbolic links." >&2
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
