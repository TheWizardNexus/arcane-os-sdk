            /out/authority/toolchain-versions.tsv
          grep -E $'^em[+][+]\t.*4[.]0[.]4 [(]273f0216fede04f2445367765eaf2aabeeb60d84[)]$' \
            /out/authority/toolchain-versions.tsv
          grep -Fx $'clang\tclang version 21.0.0git (https:/github.com/llvm/llvm-project 148111fdcf0e807fe74274b18fcf65c4cff45d63)' \
            /out/authority/toolchain-versions.tsv
          grep -Fx $'node\tv20.18.0' /out/authority/toolchain-versions.tsv
          grep -Fx $'python3\tPython 3.10.12' /out/authority/toolchain-versions.tsv
          grep -Fx $'make\tGNU Make 4.3' /out/authority/toolchain-versions.tsv
