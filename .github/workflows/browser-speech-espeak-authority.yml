          cp /inputs/MUSL_COPYRIGHT "$corresponding/legal/emscripten/musl-COPYRIGHT"
          cp /inputs/EMSDK_LICENSE "$corresponding/legal/emsdk/LICENSE"
          cp /out/legal/build-tools/* "$corresponding/legal/build-tools/"
          (
