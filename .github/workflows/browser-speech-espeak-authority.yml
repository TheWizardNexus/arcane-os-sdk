            find . -type f \
              ! -path ./ARCANE_ESPEAK_NG_CORRESPONDING_SOURCE.sha256 \
              -printf '%P\0' \
              | LC_ALL=C sort --zero-terminated \
              | xargs --null sha256sum \
              > ARCANE_ESPEAK_NG_CORRESPONDING_SOURCE.sha256
            sha256sum --check --strict ARCANE_ESPEAK_NG_CORRESPONDING_SOURCE.sha256
            test "$(find . -type f | wc -l)" = \
              "$(( $(wc -l < ARCANE_ESPEAK_NG_CORRESPONDING_SOURCE.sha256) + 1 ))"
          )
          find "$corresponding" -type f -exec chmod 0644 {} +
          find "$corresponding" -type d -exec chmod 0755 {} +
          find "$corresponding" -exec touch --date="@$SOURCE_DATE_EPOCH" {} +
          (
            cd "$corresponding"
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 --group=0 --numeric-owner \
              --format=gnu --create --file=- . \
              | gzip -n -9 \
              > "/out/arcane-espeak-ng-corresponding-source-328128ea63358979d5f74a20f5000078863795bd.tar.gz"
          )
          test -s "/out/arcane-espeak-ng-corresponding-source-328128ea63358979d5f74a20f5000078863795bd.tar.gz"
          find /out -type f -printf '%P\n' | LC_ALL=C sort > /tmp/output-files
          diff --unified - /tmp/output-files <<'EOF_OUTPUT_FILES'
          arcane-browser-node-unavailable.mjs
          arcane-espeak-ng-corresponding-source-328128ea63358979d5f74a20f5000078863795bd.tar.gz
          arcane-espeak-ng.data
          arcane-espeak-ng.mjs
          arcane-espeak-ng.wasm
          arcane-espeak-phonemizer.mjs
          authority/dpkg-inventory.tsv
          authority/toolchain-versions.tsv
          legal/arcane-sdk/LICENSE
          legal/arcane-sdk/NOTICE
          legal/build-tools/autoconf-copyright
          legal/build-tools/automake-copyright
          legal/build-tools/autotools-dev-copyright
          legal/build-tools/file-copyright
          legal/build-tools/libmagic-mgc-copyright
          legal/build-tools/libmagic1-copyright
          legal/build-tools/libsigsegv2-copyright
          legal/build-tools/libtool-copyright
          legal/build-tools/m4-copyright
