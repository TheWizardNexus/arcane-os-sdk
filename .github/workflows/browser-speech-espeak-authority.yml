          deterministic_flags="${compile_flags[*]}"

          cd /work/native
          ./autogen.sh
          CFLAGS="$deterministic_flags" CXXFLAGS="$deterministic_flags" \
            ./configure "${common_configure[@]}"
          make -j1 en
          for selected in "${selected_data[@]}"; do
