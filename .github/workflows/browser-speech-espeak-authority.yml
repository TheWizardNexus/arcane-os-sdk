          legal/espeak-ng/COPYING.UCD
          legal/espeak-ng/MODIFICATIONS
          EOF_OUTPUT_FILES
          find /out -type d -printf '%P\n' | LC_ALL=C sort > /tmp/output-directories
          diff --unified - /tmp/output-directories <<'EOF_OUTPUT_DIRECTORIES'

          authority
