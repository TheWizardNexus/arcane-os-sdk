          test -z "$(find /out -mindepth 1 ! -type d ! -type f -print -quit)"
          test -z "$(find /out -type f -empty -print -quit)"
          find /out -type f -exec chmod 0644 {} +
          find /out -type d -exec chmod 0755 {} +
          find /out -exec touch --date="@$SOURCE_DATE_EPOCH" {} +
          EOF
          chmod 0755 "$inputs/build.sh"

          install -m 0644 LICENSE "$inputs/ARCANE_SDK_LICENSE"
          install -m 0644 NOTICE "$inputs/ARCANE_SDK_NOTICE"
          install -m 0644 .github/workflows/browser-speech-espeak-authority.yml \
            "$inputs/browser-speech-espeak-authority.yml"

          docker pull --platform linux/amd64 "$TOOLCHAIN_IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$TOOLCHAIN_IMAGE")" = linux/amd64
          test "$(docker image inspect --format '{{.Id}}' "$TOOLCHAIN_IMAGE")" = "sha256:$TOOLCHAIN_CONFIG_SHA256"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$TOOLCHAIN_IMAGE" \
            | grep -Fx "emscripten/emsdk@sha256:$TOOLCHAIN_SHA256"
          docker image inspect "$TOOLCHAIN_IMAGE" | python3 -c '
          import hashlib, json, os, sys
          from pathlib import Path

          item = json.load(sys.stdin)[0]
          inputs = Path(sys.argv[1])
          labels = item.get("Config", {}).get("Labels") or {}

          def identity(path):
              data = path.read_bytes()
              return {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          result = {
              "Id": item["Id"],
              "Os": item["Os"],
              "Architecture": item["Architecture"],
              "RepoDigests": sorted(item.get("RepoDigests") or []),
              "Labels": {
                  key: labels[key]
                  for key in (
                      "org.label-schema.name",
                      "org.label-schema.vcs-url",
                      "org.label-schema.docker.dockerfile",
                  )
                  if key in labels
              },
              "EmsdkSourceAuthority": {
                  "repository": "https://github.com/emscripten-core/emsdk",
                  "revision": os.environ["EMSDK_REVISION"],
                  "tag": "4.0.4",
                  "verification": "the authenticated commit archive contains the exact release-index and license bytes matched inside the digest-pinned image",
                  "scope": "exact correspondence of the two recorded files; not a whole-image or installed-compiler source-revision proof",
                  "sourceArchive": {
                      **identity(inputs / "EMSDK_SOURCE_ARCHIVE"),
                      "sourceUrl": os.environ["EMSDK_SOURCE_URL"],
                  },
                  "releaseIndex": {
                      **identity(inputs / "EMSDK_RELEASES_TAGS"),
                      "sourceUrl": os.environ["EMSDK_RELEASE_INDEX_URL"],
                      "imagePath": "/emsdk/emscripten-releases-tags.json",
                  },
                  "license": {
                      **identity(inputs / "EMSDK_LICENSE"),
                      "sourceUrl": os.environ["EMSDK_LICENSE_URL"],
                      "imagePath": "/emsdk/LICENSE",
                  },
              },
          }
          json.dump(result, sys.stdout, indent=2, sort_keys=True)
          sys.stdout.write("\n")
          ' "$inputs" > "$inputs/toolchain-image-authority.json"
          docker build \
            --platform linux/amd64 \
            --network=none \
            --pull=false \
            --build-arg "BASE_IMAGE=$TOOLCHAIN_IMAGE" \
            --tag arcane-espeak-authority:4.0.4 \
            --file "$inputs/Dockerfile" \
            "$inputs"
          docker image inspect arcane-espeak-authority:4.0.4 | python3 -c '
          import json, sys
          item = json.load(sys.stdin)[0]
          result = {
              "Id": item["Id"],
              "Os": item["Os"],
              "Architecture": item["Architecture"],
          }
          json.dump(result, sys.stdout, indent=2, sort_keys=True)
          sys.stdout.write("\n")
          ' > "$inputs/derived-image-authority.json"
          derived_image_id="$(docker image inspect --format '{{.Id}}' arcane-espeak-authority:4.0.4)"
          test -n "$derived_image_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$derived_image_id")" = linux/amd64
          (
