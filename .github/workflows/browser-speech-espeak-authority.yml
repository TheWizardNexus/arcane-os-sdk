            test "$(find . -type f ! -path ./ARCANE_ESPEAK_NG_INPUTS.sha256 | wc -l)" = \
              "$(wc -l < ARCANE_ESPEAK_NG_INPUTS.sha256)"
            test -z "$(find . -mindepth 1 ! -type d ! -type f -print -quit)"
          )
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          echo "derived_image_id=$derived_image_id" >> "$GITHUB_OUTPUT"

      - name: Build in two fresh network-disabled containers
        shell: bash
        env:
          ROOT: ${{ steps.inputs.outputs.root }}
          INPUTS: ${{ steps.inputs.outputs.inputs }}
          DERIVED_IMAGE_ID: ${{ steps.inputs.outputs.derived_image_id }}
        run: |
          set -euo pipefail
          for run in 1 2; do
            output="$ROOT/output-$run"
            evidence="$ROOT/evidence-$run"
            mkdir -p "$output" "$evidence"
            docker run --rm --interactive \
              --platform linux/amd64 \
              --pull=never \
              --network=none \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --tmpfs /work:rw,exec,nosuid,nodev,size=5g \
              --mount "type=bind,src=$INPUTS,dst=/inputs,readonly" \
              --mount "type=bind,src=$output,dst=/out" \
              --mount "type=bind,src=$evidence,dst=/evidence" \
              "$DERIVED_IMAGE_ID" \
              bash -s <<'ARCANE_BUILD'
          set -euo pipefail
          /inputs/build.sh 2>&1 | tee /evidence/build.log
          (
            cd /out
            find . -type f -printf '%P\0' \
              | LC_ALL=C sort --zero-terminated \
              | xargs --null sha256sum
          ) > /evidence/output.sha256
          (
            cd /out
            sha256sum --check --strict /evidence/output.sha256
            test "$(find . -type f | wc -l)" = \
              "$(wc -l < /evidence/output.sha256)"
            test -z "$(find . -mindepth 1 ! -type d ! -type f -print -quit)"
            printf '%s\0' \
              arcane-browser-node-unavailable.mjs \
              arcane-espeak-ng.data \
              arcane-espeak-ng.mjs \
              arcane-espeak-ng.wasm \
              arcane-espeak-phonemizer.mjs \
              | xargs --null sha256sum \
              > /evidence/runtime.sha256
            sha256sum --check --strict /evidence/runtime.sha256
            test "$(wc -l < /evidence/runtime.sha256)" = 5
          )
          node /inputs/verify-runtime.mjs /out \
            /inputs/ARCANE_ESPEAK_COMPATIBILITY_AUTHORITY.json \
            > /evidence/runtime-proof.json
          ARCANE_BUILD
          done
          docker run --rm --interactive \
            --platform linux/amd64 \
            --pull=never \
            --network=none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$ROOT,dst=/evidence,readonly" \
            "$DERIVED_IMAGE_ID" \
            bash -s <<'ARCANE_COMPARE'
          set -euo pipefail
          diff --no-dereference --recursive /evidence/output-1 /evidence/output-2
          diff --unified /evidence/evidence-1/output.sha256 /evidence/evidence-2/output.sha256
          diff --unified /evidence/evidence-1/runtime.sha256 /evidence/evidence-2/runtime.sha256
          diff --unified /evidence/evidence-1/runtime-proof.json /evidence/evidence-2/runtime-proof.json
          ARCANE_COMPARE

      - name: Assemble exact runtime, legal, and corresponding-source authority
        id: authority
        shell: bash
        env:
          ROOT: ${{ steps.inputs.outputs.root }}
          INPUTS: ${{ steps.inputs.outputs.inputs }}
          DERIVED_IMAGE_ID: ${{ steps.inputs.outputs.derived_image_id }}
        run: |
          set -euo pipefail
          artifact="$ROOT/artifact"
          mkdir -p "$artifact"
          docker run --rm --interactive \
            --platform linux/amd64 \
            --pull=never \
            --network=none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$INPUTS,dst=/inputs,readonly" \
            --mount "type=bind,src=$ROOT,dst=/evidence,readonly" \
            --mount "type=bind,src=$artifact,dst=/authority" \
            --env ESPEAK_REVISION \
            --env ESPEAK_SOURCE_URL \
            --env ESPEAK_SOURCE_BYTES \
            --env ESPEAK_SOURCE_SHA256 \
            --env SOURCE_DATE_EPOCH \
            --env TOOLCHAIN_IMAGE \
            --env TOOLCHAIN_CONFIG_SHA256 \
            --env EMSDK_REVISION \
            --env EMSCRIPTEN_REVISION \
            --env UBUNTU_SNAPSHOT \
            --env GITHUB_REPOSITORY \
            --env GITHUB_SHA \
            --env GITHUB_RUN_ID \
            --env GITHUB_RUN_ATTEMPT \
            --env GITHUB_EVENT_NAME \
            --env GITHUB_REF \
            "$DERIVED_IMAGE_ID" \
            bash -s <<'ARCANE_ASSEMBLY'
          set -euo pipefail
          ROOT=/evidence
          INPUTS=/inputs
          artifact=/authority
          cp --archive "$ROOT/output-1/." "$artifact/"
          cp "$ROOT/evidence-1/runtime.sha256" "$artifact/arcane-espeak-ng.runtime.sha256"
          cp "$ROOT/evidence-1/output.sha256" "$artifact/arcane-espeak-ng.build-output.sha256"
          cp "$ROOT/evidence-1/build.log" "$artifact/arcane-espeak-ng.build-1.log"
          cp "$ROOT/evidence-2/build.log" "$artifact/arcane-espeak-ng.build-2.log"
          cp "$ROOT/evidence-1/runtime-proof.json" "$artifact/arcane-espeak-ng.runtime-proof-1.json"
          cp "$ROOT/evidence-2/runtime-proof.json" "$artifact/arcane-espeak-ng.runtime-proof-2.json"
          cp "$INPUTS/ARCANE_ESPEAK_NG_INPUTS.sha256" \
            "$artifact/ARCANE_ESPEAK_NG_INPUTS.sha256"
          cp "$INPUTS/ARCANE_ESPEAK_NG_BUILD_CONTRACT.json" \
            "$artifact/ARCANE_ESPEAK_NG_BUILD_CONTRACT.json"
          cp "$INPUTS/ARCANE_ESPEAK_COMPATIBILITY_AUTHORITY.json" \
            "$artifact/ARCANE_ESPEAK_COMPATIBILITY_AUTHORITY.json"
          test -z "$(find "$artifact" -mindepth 1 ! -type d ! -type f -print -quit)"
          test -z "$(find "$artifact" -type f -empty -print -quit)"
          (
            cd "$artifact"
            sha256sum --check --strict arcane-espeak-ng.build-output.sha256
            sha256sum --check --strict arcane-espeak-ng.runtime.sha256
            test "$(wc -l < arcane-espeak-ng.runtime.sha256)" = 5
          )
          printf '%s  %s\n' \
            8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903 \
            "$artifact/legal/espeak-ng/COPYING" \
