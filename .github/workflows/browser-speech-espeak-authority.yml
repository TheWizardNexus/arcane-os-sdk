          install -m 0644 /inputs/ARCANE_SDK_NOTICE /out/legal/arcane-sdk/NOTICE
          for legal in COPYING COPYING.APACHE COPYING.BSD2 COPYING.UCD; do
            install -m 0644 "/work/native/$legal" "/out/legal/espeak-ng/$legal"
          done
          install -m 0644 /inputs/ARCANE_ESPEAK_NG_MODIFICATIONS.txt \
            /out/legal/espeak-ng/MODIFICATIONS

          corresponding=/work/corresponding-source
          mkdir -p "$corresponding/legal/arcane-sdk" \
            "$corresponding/legal/espeak-ng" \
            "$corresponding/legal/emscripten" \
            "$corresponding/legal/emsdk" \
            "$corresponding/legal/build-tools"
          cp /inputs/espeak-ng.tar.gz "$corresponding/"
          cp /inputs/ESPEAK_UPSTREAM_FIX_WCTYPE "$corresponding/"
          cp /inputs/arcane_espeak_phonemes.c "$corresponding/"
          cp /inputs/arcane-espeak-phonemizer.mjs "$corresponding/"
          cp /inputs/arcane-browser-node-unavailable.mjs "$corresponding/"
          cp /inputs/apply-source-patches.py "$corresponding/"
          cp /inputs/verify-runtime.mjs "$corresponding/"
          cp /inputs/build.sh "$corresponding/"
          cp /inputs/Dockerfile "$corresponding/"
          cp /inputs/dependencies.tsv "$corresponding/"
          cp /inputs/debs.sha256 "$corresponding/"
          cp /inputs/ARCANE_ESPEAK_NG_INPUTS.sha256 "$corresponding/"
          cp /inputs/ARCANE_ESPEAK_NG_BUILD_CONTRACT.json "$corresponding/"
          cp /inputs/ARCANE_ESPEAK_NG_MODIFICATIONS.txt "$corresponding/"
          cp /inputs/EMSDK_SOURCE_ARCHIVE \
            "$corresponding/emsdk-074211759c17c646164d3271ca1d155cc174f78e.tar.gz"
          cp /inputs/EMSDK_RELEASES_TAGS "$corresponding/"
          cp /inputs/EMSDK_LICENSE "$corresponding/"
          cp /inputs/toolchain-image-authority.json "$corresponding/"
          cp /inputs/derived-image-authority.json "$corresponding/"
          cp /inputs/browser-speech-espeak-authority.yml "$corresponding/"
          cp /inputs/ARCANE_SDK_LICENSE "$corresponding/legal/arcane-sdk/LICENSE"
          cp /inputs/ARCANE_SDK_NOTICE "$corresponding/legal/arcane-sdk/NOTICE"
          for legal in COPYING COPYING.APACHE COPYING.BSD2 COPYING.UCD; do
            cp "/work/native/$legal" "$corresponding/legal/espeak-ng/$legal"
          done
          cp /inputs/ARCANE_ESPEAK_NG_MODIFICATIONS.txt \
            "$corresponding/legal/espeak-ng/MODIFICATIONS"
          cp /inputs/EMSCRIPTEN_LICENSE "$corresponding/legal/emscripten/LICENSE"
          cp /inputs/EMSCRIPTEN_COMPILER_RT_LICENSE \
