name: Build authenticated Browser Speech eSpeak authority

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-speech-espeak-authority
  cancel-in-progress: false

jobs:
  build:
    name: Build one reproducible phonemizer authority twice
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ESPEAK_REVISION: 328128ea63358979d5f74a20f5000078863795bd
      ESPEAK_SOURCE_URL: https://codeload.github.com/espeak-ng/espeak-ng/tar.gz/328128ea63358979d5f74a20f5000078863795bd
      ESPEAK_SOURCE_BYTES: '17629421'
      ESPEAK_SOURCE_SHA256: 2476231f2da9cce6565573492d112994c02cd79937025231c43189f0e32f19e7
      ESPEAK_UPSTREAM_FIX_URL: https://raw.githubusercontent.com/espeak-ng/espeak-ng/690ee601ff8fb91c2eb6b37cce746d4d0913fcd3/src/include/compat/wctype.h
      ESPEAK_UPSTREAM_FIX_BYTES: '1490'
      ESPEAK_UPSTREAM_FIX_SHA256: 398855e24fd0435ee626cf3274985409fd3d9d52b2b439ecb4132fcff90d3c12
      SOURCE_DATE_EPOCH: '1724522532'
      TOOLCHAIN_IMAGE: docker.io/emscripten/emsdk:4.0.4@sha256:47d573d5a86379a06f850de200d69407e6baa2d2f9c19d9e156a67db57f80f2f
      TOOLCHAIN_SHA256: 47d573d5a86379a06f850de200d69407e6baa2d2f9c19d9e156a67db57f80f2f
      TOOLCHAIN_CONFIG_SHA256: a411b47f58dbac78da4f2ea974e6bdbb4cd0598d6de7d8166903cdb34d6ecc9e
      EMSDK_REVISION: 074211759c17c646164d3271ca1d155cc174f78e
      EMSDK_SOURCE_URL: https://codeload.github.com/emscripten-core/emsdk/tar.gz/074211759c17c646164d3271ca1d155cc174f78e
      EMSDK_SOURCE_BYTES: '114281'
      EMSDK_SOURCE_SHA256: d5e9af17d3da29c2f6000118e4634bcc406a8b45a3023f1d7650c78626b276ca
      EMSDK_RELEASE_INDEX_URL: https://raw.githubusercontent.com/emscripten-core/emsdk/074211759c17c646164d3271ca1d155cc174f78e/emscripten-releases-tags.json
      EMSDK_RELEASE_INDEX_BYTES: '15316'
      EMSDK_RELEASE_INDEX_SHA256: 48dc0b83b004a48e24a42f244dcf16dbf8e23376a375ae530fe18e6280ea502d
      EMSDK_LICENSE_URL: https://raw.githubusercontent.com/emscripten-core/emsdk/074211759c17c646164d3271ca1d155cc174f78e/LICENSE
      EMSDK_LICENSE_BYTES: '1326'
      EMSDK_LICENSE_SHA256: 99d9a9616fbde3f5ee22a71d8645799a8522d48526130c5ba6dc27ad15ce01f1
      EMSCRIPTEN_REVISION: 273f0216fede04f2445367765eaf2aabeeb60d84
      EMSCRIPTEN_LICENSE_URL: https://raw.githubusercontent.com/emscripten-core/emscripten/273f0216fede04f2445367765eaf2aabeeb60d84/LICENSE
      EMSCRIPTEN_LICENSE_BYTES: '5093'
      EMSCRIPTEN_LICENSE_SHA256: 620a78084fc7ca97c0b5dea9abf891f3ffcadfdbf305276f099c9c4e12fc1d86
      EMSCRIPTEN_COMPILER_RT_LICENSE_URL: https://raw.githubusercontent.com/emscripten-core/emscripten/273f0216fede04f2445367765eaf2aabeeb60d84/system/lib/compiler-rt/LICENSE.TXT
      EMSCRIPTEN_COMPILER_RT_LICENSE_BYTES: '16708'
      EMSCRIPTEN_COMPILER_RT_LICENSE_SHA256: 1a8f1058753f1ba890de984e48f0242a3a5c29a6a8f2ed9fd813f36985387e8d
      MUSL_COPYRIGHT_URL: https://raw.githubusercontent.com/emscripten-core/emscripten/273f0216fede04f2445367765eaf2aabeeb60d84/system/lib/libc/musl/COPYRIGHT
      MUSL_COPYRIGHT_BYTES: '6204'
      MUSL_COPYRIGHT_SHA256: f9bc4423732350eb0b3f7ed7e91d530298476f8fec0c6c427a1c04ade22655af
      PHONEMIZER_REVISION: 6835144b7ee9043129222549c1ed2f6a27216278
      PHONEMIZER_SOURCE_URL: https://raw.githubusercontent.com/xenova/phonemizer.js/6835144b7ee9043129222549c1ed2f6a27216278/src/phonemizer.js
      PHONEMIZER_SOURCE_BYTES: '2204'
      PHONEMIZER_SOURCE_SHA256: 1edf7dc6ca674d91e8be9f7e07ab268af5bb1d56f87bcf24624d937c3599d175
      KOKORO_REVISION: 664c76a704021239ba59c84dcbaa4d3dece01fe9
      KOKORO_PHONEMIZE_SOURCE_URL: https://raw.githubusercontent.com/hexgrad/kokoro/664c76a704021239ba59c84dcbaa4d3dece01fe9/kokoro.js/src/phonemize.js
      KOKORO_PHONEMIZE_SOURCE_BYTES: '6617'
      KOKORO_PHONEMIZE_SOURCE_SHA256: fc8f3c63edd56bdaa967b92274ad6df891a1926211fbc884675b7069f398a2d4
      KOKORO_PHONEMIZE_TEST_URL: https://raw.githubusercontent.com/hexgrad/kokoro/664c76a704021239ba59c84dcbaa4d3dece01fe9/kokoro.js/tests/phonemize.test.js
      KOKORO_PHONEMIZE_TEST_BYTES: '4801'
      KOKORO_PHONEMIZE_TEST_SHA256: 3c90f9bdce54c2378981fe5f137f41c0de73153e59f55084a05a22994cc7bbeb
      UBUNTU_SNAPSHOT: https://snapshot.ubuntu.com/ubuntu/20250225T232300Z
    steps:
      - name: Admit only the canonical main workflow dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TheWizardNexus/arcane-os-sdk
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main

      - name: Check out the exact SDK build contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the exact clean SDK source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"

      - name: Fetch and authenticate every external build input
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/arcane-espeak-authority"
          inputs="$root/inputs"
          debs="$inputs/debs"
          mkdir -p "$debs"

          download_exact() {
            local relative_path="$1"
            local expected_bytes="$2"
            local expected_sha256="$3"
            local url="$4"
            local target="$inputs/$relative_path"
            mkdir -p "$(dirname "$target")"
            curl --fail --show-error --silent --location \
              --proto '=https' --tlsv1.2 \
              --output "$target" "$url"
            test "$(stat -c '%s' "$target")" = "$expected_bytes"
            printf '%s  %s\n' "$expected_sha256" "$target" | sha256sum --check --strict
          }

          download_exact \
            espeak-ng.tar.gz \
            "$ESPEAK_SOURCE_BYTES" \
            "$ESPEAK_SOURCE_SHA256" \
            "$ESPEAK_SOURCE_URL"
          download_exact \
            ESPEAK_UPSTREAM_FIX_WCTYPE \
            "$ESPEAK_UPSTREAM_FIX_BYTES" \
            "$ESPEAK_UPSTREAM_FIX_SHA256" \
            "$ESPEAK_UPSTREAM_FIX_URL"
          download_exact \
            EMSDK_SOURCE_ARCHIVE \
            "$EMSDK_SOURCE_BYTES" \
            "$EMSDK_SOURCE_SHA256" \
            "$EMSDK_SOURCE_URL"
          download_exact \
            EMSDK_RELEASES_TAGS \
            "$EMSDK_RELEASE_INDEX_BYTES" \
            "$EMSDK_RELEASE_INDEX_SHA256" \
            "$EMSDK_RELEASE_INDEX_URL"
          download_exact \
            EMSDK_LICENSE \
            "$EMSDK_LICENSE_BYTES" \
            "$EMSDK_LICENSE_SHA256" \
            "$EMSDK_LICENSE_URL"
          download_exact \
            EMSCRIPTEN_LICENSE \
            "$EMSCRIPTEN_LICENSE_BYTES" \
            "$EMSCRIPTEN_LICENSE_SHA256" \
            "$EMSCRIPTEN_LICENSE_URL"
          download_exact \
            EMSCRIPTEN_COMPILER_RT_LICENSE \
            "$EMSCRIPTEN_COMPILER_RT_LICENSE_BYTES" \
            "$EMSCRIPTEN_COMPILER_RT_LICENSE_SHA256" \
            "$EMSCRIPTEN_COMPILER_RT_LICENSE_URL"
          download_exact \
            MUSL_COPYRIGHT \
            "$MUSL_COPYRIGHT_BYTES" \
            "$MUSL_COPYRIGHT_SHA256" \
            "$MUSL_COPYRIGHT_URL"
          download_exact \
            PHONEMIZER_SOURCE.js \
            "$PHONEMIZER_SOURCE_BYTES" \
            "$PHONEMIZER_SOURCE_SHA256" \
            "$PHONEMIZER_SOURCE_URL"
          download_exact \
            KOKORO_PHONEMIZE_SOURCE.js \
            "$KOKORO_PHONEMIZE_SOURCE_BYTES" \
            "$KOKORO_PHONEMIZE_SOURCE_SHA256" \
            "$KOKORO_PHONEMIZE_SOURCE_URL"
          download_exact \
            KOKORO_PHONEMIZE_TEST.js \
            "$KOKORO_PHONEMIZE_TEST_BYTES" \
            "$KOKORO_PHONEMIZE_TEST_SHA256" \
            "$KOKORO_PHONEMIZE_TEST_URL"

          cat > "$inputs/dependencies.tsv" <<'EOF'
          autoconf_2.71-2_all.deb	337608	96b528889794c4134015a63c75050f93d8aecdf5e3f2a20993c1433f4c61b80e	pool/main/a/autoconf/autoconf_2.71-2_all.deb
          automake_1.16.5-1.3_all.deb	557936	59e3890fc8407bcf8ccc9f709d6513156346d5c942e8c624dc90435e58f6f978	pool/main/a/automake-1.16/automake_1.16.5-1.3_all.deb
          autotools-dev_20220109.1_all.deb	44886	d909f0327b09d9a9136239caca975df89782fa28efd721c4eb4caea422d3fc5a	pool/main/a/autotools-dev/autotools-dev_20220109.1_all.deb
          libtool_2.4.6-15build2_all.deb	163940	fb994bc0152f4e77a791b51bc54fd5e38963aa6473e60c45369ef373b6119124	pool/main/libt/libtool/libtool_2.4.6-15build2_all.deb
          m4_1.4.18-5ubuntu2_amd64.deb	198836	572a544d2c18bf49d25c465720c570cd8e6e38731386ac9c0a7f29bed2486f3e	pool/main/m/m4/m4_1.4.18-5ubuntu2_amd64.deb
          libsigsegv2_2.13-1ubuntu3_amd64.deb	14612	894fcb0804df54dca59edbd0860d6f3eeac25d1555aebd3fa99d80665969f891	pool/main/libs/libsigsegv/libsigsegv2_2.13-1ubuntu3_amd64.deb
          file_5.41-3ubuntu0.1_amd64.deb	21524	b63b48e8b32c6f0fce5ad37d5ec3269cbbdc8feed13170aae1f416a43ebe898b	pool/main/f/file/file_5.41-3ubuntu0.1_amd64.deb
          libmagic1_5.41-3ubuntu0.1_amd64.deb	87242	344d0cc65fea4175ca1ab222c20b5b95fb1357acafea6b016add9988760829d0	pool/main/f/file/libmagic1_5.41-3ubuntu0.1_amd64.deb
          libmagic-mgc_5.41-3ubuntu0.1_amd64.deb	257310	23fcefb8b9ee73eb74e127fc230330918a8f81e127fa54015f191cfd34726b3c	pool/main/f/file/libmagic-mgc_5.41-3ubuntu0.1_amd64.deb
          EOF

          total_bytes=0
          while IFS=$'\t' read -r filename bytes sha256 pool_path; do
            download_exact "debs/$filename" "$bytes" "$sha256" \
              "$UBUNTU_SNAPSHOT/$pool_path"
            total_bytes=$((total_bytes + bytes))
          done < "$inputs/dependencies.tsv"
          test "$total_bytes" = 1683894

          awk -F '\t' '{ print $3 "  " $1 }' "$inputs/dependencies.tsv" \
            > "$inputs/debs.sha256"

          cat > "$inputs/Dockerfile" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY debs /arcane-authority/debs
          COPY debs.sha256 /arcane-authority/debs.sha256
          COPY dependencies.tsv /arcane-authority/dependencies.tsv
          COPY EMSDK_RELEASES_TAGS /arcane-authority/EMSDK_RELEASES_TAGS
          COPY EMSDK_LICENSE /arcane-authority/EMSDK_LICENSE
          COPY EMSCRIPTEN_COMPILER_RT_LICENSE /arcane-authority/EMSCRIPTEN_COMPILER_RT_LICENSE
          RUN set -eux; \
              cmp /arcane-authority/EMSDK_RELEASES_TAGS /emsdk/emscripten-releases-tags.json; \
              cmp /arcane-authority/EMSDK_LICENSE /emsdk/LICENSE; \
              cmp /arcane-authority/EMSCRIPTEN_COMPILER_RT_LICENSE /emsdk/upstream/emscripten/system/lib/compiler-rt/LICENSE.TXT; \
              test "$(dpkg --print-architecture)" = amd64; \
              test "$(. /etc/os-release && printf '%s' "$VERSION_ID")" = 22.04; \
              test "$(find /arcane-authority/debs -maxdepth 1 -type f | wc -l)" = 9; \
              test -z "$(find /arcane-authority/debs -mindepth 1 ! -type f -print -quit)"; \
              cd /arcane-authority/debs; \
              sha256sum --check --strict ../debs.sha256; \
              test "$(find . -maxdepth 1 -type f -printf '%s\n' | awk '{ total += $1 } END { print total }')" = 1683894; \
              cd /; \
              dpkg --unpack --force-downgrade /arcane-authority/debs/*.deb; \
              dpkg --configure -a; \
              dpkg --audit; \
              test "$(dpkg-query -W -f='${Version}' autoconf)" = 2.71-2; \
              test "$(dpkg-query -W -f='${Version}' automake)" = 1:1.16.5-1.3; \
              test "$(dpkg-query -W -f='${Version}' autotools-dev)" = 20220109.1; \
              test "$(dpkg-query -W -f='${Version}' libtool)" = 2.4.6-15build2; \
              test "$(dpkg-query -W -f='${Version}' m4)" = 1.4.18-5ubuntu2; \
              test "$(dpkg-query -W -f='${Version}' libsigsegv2)" = 2.13-1ubuntu3; \
              test "$(dpkg-query -W -f='${Version}' file)" = 1:5.41-3ubuntu0.1; \
              test "$(dpkg-query -W -f='${Version}' libmagic1)" = 1:5.41-3ubuntu0.1; \
              test "$(dpkg-query -W -f='${Version}' libmagic-mgc)" = 1:5.41-3ubuntu0.1
          EOF

          cat > "$inputs/arcane_espeak_phonemes.c" <<'EOF'
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <emscripten/emscripten.h>
          #include <espeak-ng/speak_lib.h>

          static int initialized = 0;
          static int last_error = 0;

          EMSCRIPTEN_KEEPALIVE
          int arcane_espeak_initialize(void) {
            if (initialized) return 0;
            const int sample_rate = espeak_Initialize(
              AUDIO_OUTPUT_SYNCHRONOUS,
              100,
              "/usr/share",
              espeakINITIALIZE_DONT_EXIT
            );
            if (sample_rate < 1) return last_error = -1;
            if (espeak_SetVoiceByName("en-us") != EE_OK) return last_error = -2;
            initialized = 1;
            last_error = 0;
            return 0;
          }

          EMSCRIPTEN_KEEPALIVE
          int arcane_espeak_set_voice(const char *voice) {
            if (!initialized || voice == NULL) return last_error = -1;
            if (strcmp(voice, "en") != 0 && strcmp(voice, "en-us") != 0) {
              return last_error = -2;
            }
            if (espeak_SetVoiceByName(voice) != EE_OK) return last_error = -3;
            last_error = 0;
            return 0;
          }

          static int append_text(char **output, size_t *length, const char *chunk) {
            const size_t chunk_length = chunk == NULL ? 0 : strlen(chunk);
            if (chunk_length == 0) return 0;
            const size_t separator = *length == 0 ? 0 : 1;
            if (chunk_length > SIZE_MAX - *length - separator - 1) return -1;
            const size_t next_length = *length + separator + chunk_length;
            char *next = realloc(*output, next_length + 1);
            if (next == NULL) return -1;
            if (separator) next[*length] = '\n';
            memcpy(next + *length + separator, chunk, chunk_length);
            next[next_length] = '\0';
            *output = next;
            *length = next_length;
            return 0;
          }

          EMSCRIPTEN_KEEPALIVE
          char *arcane_espeak_phonemize(const char *text) {
            if (!initialized || text == NULL) {
              last_error = -4;
              return NULL;
            }
            char *output = calloc(1, 1);
            if (output == NULL) {
              last_error = -5;
              return NULL;
            }
            size_t output_length = 0;
            const void *cursor = text;
            while (cursor != NULL) {
              const void *before = cursor;
              const char *chunk = espeak_TextToPhonemes(
                &cursor,
                espeakCHARS_UTF8,
                espeakPHONEMES_IPA
              );
              if (append_text(&output, &output_length, chunk) != 0) {
                free(output);
                last_error = -5;
                return NULL;
              }
              if (cursor == before) break;
            }
            last_error = 0;
            return output;
          }

          EMSCRIPTEN_KEEPALIVE
          void arcane_espeak_free(void *value) {
            free(value);
          }

          EMSCRIPTEN_KEEPALIVE
          int arcane_espeak_last_error(void) {
            return last_error;
          }

          EMSCRIPTEN_KEEPALIVE
          int arcane_espeak_dispose(void) {
            if (!initialized) return 0;
            const int result = espeak_Terminate();
            initialized = 0;
            last_error = result == EE_OK ? 0 : -6;
            return last_error;
          }
          EOF

          cat > "$inputs/apply-source-patches.py" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          contract = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          patch = contract["sourcePatch"]
          target = root / patch["path"]
          original = target.read_bytes()
          original_sha256 = hashlib.sha256(original).hexdigest()
          if original_sha256 != patch["inputSha256"]:
              raise SystemExit(f"Unexpected wctype.h input: {original_sha256}")
          open_guard = b"#include <ucd/ucd.h>\n"
          close_guard = b"#define toupper udc_toupper\n"
          if original.count(open_guard) != 1 or original.count(close_guard) != 1:
              raise SystemExit("The authenticated Emscripten compatibility patch did not match exactly once.")
          patched = original.replace(open_guard, b"#ifndef __EMSCRIPTEN__\n" + open_guard)
          patched = patched.replace(close_guard, close_guard + b"#endif\n")
          patched_sha256 = hashlib.sha256(patched).hexdigest()
          if patched_sha256 != patch["outputSha256"]:
              raise SystemExit(f"Unexpected wctype.h output: {patched_sha256}")
          if len(patched) != patch["outputBytes"]:
              raise SystemExit(f"Unexpected wctype.h output bytes: {len(patched)}")
          patched_git_blob = hashlib.sha1(
              b"blob " + str(len(patched)).encode("ascii") + b"\0" + patched
          ).hexdigest()
          if patched_git_blob != patch["outputGitBlob"]:
              raise SystemExit(f"Unexpected wctype.h output Git blob: {patched_git_blob}")
          target.write_bytes(patched)
          print(
              f"wctype.h {original_sha256} -> {patched_sha256} "
              f"({len(patched)} bytes, Git blob {patched_git_blob})"
          )
          PY

          printf 'export default null;\n' > "$inputs/arcane-browser-node-unavailable.mjs"
          test "$(stat -c '%s' "$inputs/arcane-browser-node-unavailable.mjs")" = 21
          printf '%s  %s\n' \
            fabf6997a3adf11e45d11e3c4d58d0634ab98f9d72f3116f3694123818ccd457 \
            "$inputs/arcane-browser-node-unavailable.mjs" | sha256sum --check --strict

          cat > "$inputs/arcane-espeak-phonemizer.mjs" <<'EOF'
          import createArcaneEspeakModule from "./arcane-espeak-ng.mjs";

          const ASSET_BASE =
            "https://github.com/TheWizardNexus/arcane-os-sdk/releases/download/0.3.0";
          const ASSET_URLS = Object.freeze({
            "arcane-espeak-ng.data": `${ASSET_BASE}/arcane-espeak-ng.data`,
            "arcane-espeak-ng.wasm": `${ASSET_BASE}/arcane-espeak-ng.wasm`,
          });
          const LANGUAGES = new Set(["en", "en-us"]);
          let modulePromise = null;
          let operationTail = Promise.resolve();

          function loadModule() {
            modulePromise ??= createArcaneEspeakModule({
              locateFile(path) {
                const url = ASSET_URLS[path];
                if (!url) throw new Error(`Undeclared eSpeak runtime file: ${path}.`);
                return url;
              },
            }).then((module) => {
              if (module._arcane_espeak_initialize() !== 0) {
                throw new Error("The authenticated eSpeak runtime did not initialize.");
              }
              return module;
            });
            return modulePromise;
          }

          function withUtf8(module, value, operation) {
            const bytes = module.lengthBytesUTF8(value) + 1;
            const pointer = module._malloc(bytes);
            if (!pointer) throw new Error("The eSpeak runtime could not allocate UTF-8 input.");
            try {
              module.stringToUTF8(value, pointer, bytes);
              return operation(pointer);
            } finally {
              module._free(pointer);
            }
          }

          async function runPhonemize(text, language) {
            if (typeof text !== "string") throw new TypeError("Phonemizer text must be a string.");
            if (!LANGUAGES.has(language)) {
              throw new TypeError('Phonemizer language must be exactly "en" or "en-us".');
            }
            if (!text) return [];
            const module = await loadModule();
            const voiceResult = withUtf8(
              module,
              language,
              (pointer) => module._arcane_espeak_set_voice(pointer),
            );
            if (voiceResult !== 0) throw new Error("The authenticated eSpeak voice was rejected.");
            const resultPointer = withUtf8(
              module,
              text,
              (pointer) => module._arcane_espeak_phonemize(pointer),
            );
            if (!resultPointer) throw new Error("The authenticated eSpeak phonemizer failed.");
            try {
              return module.UTF8ToString(resultPointer)
                .split("\n")
                .filter((value) => value.length > 0);
            } finally {
              module._arcane_espeak_free(resultPointer);
            }
          }

          export function phonemize(text, language = "en-us") {
            const operation = operationTail.then(
              () => runPhonemize(text, language),
              () => runPhonemize(text, language),
            );
            operationTail = operation.then(() => undefined, () => undefined);
            return operation;
          }

          export function dispose() {
            const operation = operationTail.then(async () => {
              if (!modulePromise) return false;
              const module = await modulePromise;
              if (module._arcane_espeak_dispose() !== 0) {
                throw new Error("The authenticated eSpeak runtime did not dispose cleanly.");
              }
              modulePromise = null;
              return true;
            });
            operationTail = operation.then(() => undefined, () => undefined);
            return operation;
          }
          EOF

          cat > "$inputs/verify-runtime.mjs" <<'EOF'
          import fs from "node:fs/promises";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.argv[2];
          if (!root) throw new Error("The exact runtime directory is required.");
          const compatibilityAuthorityPath = process.argv[3];
          if (!compatibilityAuthorityPath) {
            throw new Error("The authenticated compatibility authority is required.");
          }
          const compatibilityAuthority = JSON.parse(
            await fs.readFile(compatibilityAuthorityPath, "utf8"),
          );
          if (
            compatibilityAuthority.schema !==
              "arcane.browser-speech.espeak-compatibility-authority/1" ||
