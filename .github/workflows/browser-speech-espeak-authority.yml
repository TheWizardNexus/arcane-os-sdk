              "/out/legal/build-tools/$package-copyright"
          done
          tar --extract --gzip --file /inputs/espeak-ng.tar.gz --directory /work/native \
            --strip-components 1 --no-same-owner --no-same-permissions
          tar --extract --gzip --file /inputs/espeak-ng.tar.gz --directory /work/wasm \
