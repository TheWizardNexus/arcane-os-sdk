          printf '%s  %s\n' \
            c238c4eb71879698842ce05ef519529f46fdc0f493d88c38c94854f519a97009 \
            /work/native/emscripten/README.md \
            61b7a8a341b7c86d330752cf383af3e50f7ef141e1e51692fdb503400afc603e \
