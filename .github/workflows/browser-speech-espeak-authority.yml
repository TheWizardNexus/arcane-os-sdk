          install -m 0644 /inputs/MUSL_COPYRIGHT \
            /out/legal/emscripten/musl-COPYRIGHT
          install -m 0644 /inputs/EMSDK_LICENSE /out/legal/emsdk/LICENSE
          for package in autoconf automake autotools-dev libtool m4 libsigsegv2 file libmagic1 libmagic-mgc; do
            test -s "/usr/share/doc/$package/copyright"
