name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        node:
          - 22.23.2
          - 24
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Run development checks
        run: npm run check

  pack_npm_release:
    name: Pack one exact npm release artifact
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs['artifact-id'] }}
      version: ${{ steps.pack.outputs.version }}
      tarball-filename: ${{ steps.pack.outputs['tarball-filename'] }}
      manifest-filename: ${{ steps.pack.outputs['manifest-filename'] }}
      checksum-filename: ${{ steps.pack.outputs['checksum-filename'] }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the pinned npm pack toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          architecture: x64
          package-manager-cache: false
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build and authenticate the npm tarball once
        id: pack
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/arcane-sdk-npm-release
        run: node tools/build-npm-release.mjs --output "$RELEASE_OUTPUT" --source-sha "$GITHUB_SHA"
      - name: Upload the exact tarball, manifest, and checksum
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcane-sdk-npm-${{ steps.pack.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.manifest }}
            ${{ steps.pack.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  exercise_npm_release:
    name: Exact npm artifact / ${{ matrix.target }}
    needs: pack_npm_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      npm_config_cache: ${{ runner.temp }}/arcane-sdk-npm-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            platform: win32
            architecture: x64
          - target: linux-x64
            os: ubuntu-24.04
            platform: linux
            architecture: x64
          - target: macos-arm64
            os: macos-15
            platform: darwin
            architecture: arm64
    steps:
      - name: Check out only the exact Vanilla Test contract source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the pinned native test toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install the exact Vanilla Test dependency
        run: npm ci --ignore-scripts
      - name: Download the one producer artifact by immutable id
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.pack_npm_release.outputs['artifact-id'] }}
          path: ${{ runner.temp }}/arcane-sdk-npm-release
      - name: Exercise the downloaded tarball through Vanilla Test
        env:
          ARCANE_SDK_NPM_RELEASE_METADATA: ${{ runner.temp }}/arcane-sdk-npm-release/${{ needs.pack_npm_release.outputs['manifest-filename'] }}
          ARCANE_SDK_EXPECTED_PLATFORM: ${{ matrix.platform }}
          ARCANE_SDK_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node ./bin/arcane-test.mjs test/tarball.test.mjs

  npm_release_ready:
    name: npm release readiness gate
    if: github.event_name != 'pull_request' && always()
    needs:
      - pack_npm_release
      - exercise_npm_release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the producer and every native exact-artifact test
        shell: bash
        env:
          PACK_RESULT: ${{ needs.pack_npm_release.result }}
          MATRIX_RESULT: ${{ needs.exercise_npm_release.result }}
        run: |
          test "$PACK_RESULT" = success
          test "$MATRIX_RESULT" = success
