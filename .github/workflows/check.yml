name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_validation:
    name: Validate package source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the minimum supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install declared dependencies
        run: npm ci --ignore-scripts
      - name: Validate the package source boundary
        run: node tools/check-source.mjs --package-only

  pack_npm_release:
    name: Pack npm release
    needs: source_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs['artifact-id'] }}
      version: ${{ steps.pack.outputs.version }}
      tarball-filename: ${{ steps.pack.outputs['tarball-filename'] }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the release Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          architecture: x64
          package-manager-cache: false
      - name: Install declared dependencies
        run: npm ci --ignore-scripts
      - name: Pack the npm tarball
        id: pack
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/arcane-sdk-npm-release
        run: node tools/build-npm-release.mjs --output "$RELEASE_OUTPUT"
      - name: Verify the packed npm boundary
        shell: bash
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.pack.outputs.version }}
        run: node tools/verify-npm-release.mjs --tarball "$RELEASE_TARBALL" --expected-version "$RELEASE_VERSION"
      - name: Upload the npm tarball
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: arcane-sdk-npm-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  installed_capability_smoke:
    name: Informational installed capability smoke / linux-x64
    needs: pack_npm_release
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out smoke source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the minimum supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: x64
          package-manager-cache: false
      - name: Install declared test dependencies
        run: npm ci --ignore-scripts
      - name: Download the npm tarball
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack_npm_release.outputs['artifact-id'] }}
          path: ${{ runner.temp }}/arcane-sdk-npm-release
      - name: Exercise the installed package
        env:
          ARCANE_SDK_NPM_RELEASE_TARBALL: ${{ runner.temp }}/arcane-sdk-npm-release/${{ needs.pack_npm_release.outputs['tarball-filename'] }}
          ARCANE_SDK_EXPECTED_PLATFORM: linux
          ARCANE_SDK_EXPECTED_ARCHITECTURE: x64
        run: node ./bin/arcane-test.mjs test/release-capability-smoke.test.mjs
